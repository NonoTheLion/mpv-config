# Ce fichier définit les raccourcis clavier de mpv et les entrées du menu contextuel d’uosc
# Keymap pensé pour un clavier AZERTY sous Linux :
#   - lecture et navigation sans modificateur ; Maj = variante inverse ou forte ; Ctrl = réglage avancé ; Alt = outils et scripts
#   - aucune touche AltGr, aucune touche morte, aucun chiffre nécessitant Maj ; aucune sortie sur une touche seule
#   - les lignes commençant par « # » suivies d’une commande et d’un « #menu: » restent accessibles uniquement depuis le menu uosc
# SPACE, RIGHT, TAB, PGUP et PGDWN sont aussi définis dans inputevent_key.conf (clic/appui long), qui a la priorité :
# les lignes ci-dessous servent à afficher le raccourci dans le menu ; modifier les deux fichiers

##⇘⇘Menu principal d’uosc : Ouvrir
o                script-message-to uosc open-file                                                                       #menu: Ouvrir > Ouvrir le navigateur intégré
O                script-message-to file_browser browse-files;script-message-to file_browser dynamic/reload;show-text '' #menu: Ouvrir > Ouvrir le navigateur OSD
TAB              script-message-to uosc playlist                                                                        #menu: Ouvrir > Liste de lecture
#                script-message-to uosc chapters                                                                        #menu: Ouvrir > Menu des chapitres
#                script-message-to uosc editions                                                                        #menu: Ouvrir > Menu des éditions
#                script-message-to uosc audio                                                                           #menu: Ouvrir > Autres pistes audio
#                script-message-to uosc subtitles                                                                       #menu: Ouvrir > Autres sous-titres
#                ignore                                                                                                 #menu: Ouvrir > ---
h                script-message-to simplehistory open-list;show-text ''                                                 #menu: Ouvrir > Historique > Ouvrir le menu de l’historique
#                script-message-to simplehistory history-incognito-mode                                                 #menu: Ouvrir > Historique > Activer/désactiver l’historique privé
#                script-message-to simplehistory history-load-last                                                      #menu: Ouvrir > Historique > Charger le dernier fichier lu
H                script-message-to simplehistory history-resume                                                         #menu: Ouvrir > Historique > Charger le dernier fichier lu et reprendre la lecture
ALT+b            script-message-to simplebookmark open-list;show-text ''                                                #menu: Ouvrir > Marque-pages > Ouvrir le menu des marque-pages
ALT+B            script-message-to simplebookmark bookmark-save                                                         #menu: Ouvrir > Marque-pages > Ajouter un marque-page avec la position
