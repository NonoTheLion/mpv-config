# Ce fichier définit les raccourcis clavier de mpv et les entrées du menu contextuel d’uosc

##⇘⇘Menu principal d’uosc : Ouvrir
o                script-message-to uosc open-file                                                                       #menu: Ouvrir > Ouvrir le navigateur intégré
CTRL+o           script-message-to open_dialog import_files                                                             #menu: Ouvrir > Ouvrir le sélecteur de fichiers natif
TAB              script-message-to file_browser browse-files;script-message-to file_browser dynamic/reload;show-text '' #menu: Ouvrir > Ouvrir le navigateur OSD
#                script-message-to uosc playlist                                                                        #menu: Ouvrir > Liste de lecture
#                script-message-to uosc chapters                                                                        #menu: Ouvrir > Menu des chapitres
#                script-message-to uosc editions                                                                        #menu: Ouvrir > Menu des éditions
#                script-message-to uosc audio                                                                           #menu: Ouvrir > Autres pistes audio
#                script-message-to uosc subtitles                                                                       #menu: Ouvrir > Autres sous-titres
#                ignore                                                                                                 #menu: Ouvrir > ---
`                script-message-to simplehistory open-list;show-text ''                                                 #menu: Ouvrir > Historique > Ouvrir le menu de l’historique
ALT+l            script-message-to simplehistory history-incognito-mode                                                 #menu: Ouvrir > Historique > Activer/désactiver l’historique privé
CTRL+L           script-message-to simplehistory history-load-last                                                      #menu: Ouvrir > Historique > Charger le dernier fichier lu
CTRL+l           script-message-to simplehistory history-resume                                                         #menu: Ouvrir > Historique > Charger le dernier fichier lu et reprendre la lecture
N                script-message-to simplebookmark open-list;show-text ''                                                #menu: Ouvrir > Marque-pages > Ouvrir le menu des marque-pages
CTRL+n           script-message-to simplebookmark bookmark-save                                                         #menu: Ouvrir > Marque-pages > Ajouter un marque-page avec la position
CTRL+N           script-message-to simplebookmark bookmark-fileonly                                                     #menu: Ouvrir > Marque-pages > Ajouter un marque-page du fichier
#                script-message-to webtorrent toggle-info;show-text ''                                                  #menu: Ouvrir > Youtube-dl > Afficher/masquer l’OSD des liens magnet
CTRL+F           script-message-to quality_menu video_formats_toggle                                                    #menu: Ouvrir > Youtube-dl > Afficher/masquer le menu de sélection vidéo ytdl
ALT+F            script-message-to quality_menu audio_formats_toggle                                                    #menu: Ouvrir > Youtube-dl > Afficher/masquer le menu de sélection audio ytdl
#                script-message-to quality_menu reload                                                                  #menu: Ouvrir > Youtube-dl > Recharger ytdl
#                ignore                                                                                                 #menu: Ouvrir > ---
#                script-binding recentmenu/open                                                                         #menu: Ouvrir > Lectures récentes #@recent

##⇘⇘Menu principal d’uosc : Fichier
SHIFT+F11        stop                                                                                                   #menu: Fichier > Arrêter
ALT+t            cycle ontop;show-text "Toujours au premier plan : ${ontop}"                                                                  #menu: Fichier > Toujours au premier plan      #@state=(ontop and 'checked')
ALT+b            cycle window-maximized                                                                                 #menu: Fichier > Fenêtre maximisée        #@state=(window_maximized and 'checked')
ENTER            cycle fullscreen                                                                                       #menu: Fichier > Plein écran          #@state=(fullscreen and 'checked')
p                script-message-to pip toggle-pip                                                                       #menu: Fichier > Activer/désactiver l’image dans l’image
i                script-binding stats/display-stats                                                                     #menu: Fichier > Afficher temporairement les statistiques
I                script-binding stats/display-stats-toggle                                                              #menu: Fichier > Afficher en permanence les statistiques
l                ab-loop                                                                                                #menu: Fichier > Définir/effacer la boucle A-B
L                cycle-values loop-file inf no;show-text "Lecture en boucle : ${loop-file}"                                        #menu: Fichier > Activer/désactiver la lecture en boucle      #@state=(loop_file and 'checked')
n                script-message playlistmanager shuffle                                                                 #menu: Fichier > Lecture aléatoire
[                no-osd add      speed -0.1; script-message-to uosc flash-speed                                         #menu: Fichier > Vitesse > Vitesse -0.1
]                no-osd add      speed  0.1; script-message-to uosc flash-speed                                         #menu: Fichier > Vitesse > Vitesse +0.1
{                no-osd multiply speed  0.5; script-message-to uosc flash-speed                                         #menu: Fichier > Vitesse > Demi-vitesse
}                no-osd multiply speed  2.0; script-message-to uosc flash-speed                                         #menu: Fichier > Vitesse > Vitesse double
BS               no-osd set      speed  1.0; script-message-to uosc flash-speed                                         #menu: Fichier > Vitesse > Réinitialiser la vitesse
ALT+o            script-message-to uosc show-in-directory                                                               #menu: Fichier > Afficher le fichier courant dans son dossier
DEL              script-message-to delete_current_file delete-file 1  "Appuyez sur 1 pour confirmer la suppression"                                 #menu: Fichier > Supprimer le fichier courant

##⇘⇘Menu principal d’uosc : Navigation
#                show-text ${track-list} 5000                                                                           #menu: Navigation > Afficher les informations OSD des pistes
O                no-osd cycle-values osd-level 3 1                                                                      #menu: Navigation > Afficher/masquer la barre temporelle OSD
F4               script-binding select/menu;show-text ''                                                                #menu: Navigation > Menu interactif OSD > Menu général
F5               script-message-to playlistmanager showplaylist;show-text ''                                            #menu: Navigation > Menu interactif OSD > Liste de lecture
F6               script-binding select/select-audio-device;show-text ''                                                 #menu: Navigation > Menu interactif OSD > Liste des périphériques audio
#                script-binding select/select-edition;show-text ''                                                      #menu: Navigation > Menu interactif OSD > Liste des éditions
F7               script-binding select/select-chapter;show-text ''                                                      #menu: Navigation > Menu interactif OSD > Liste des chapitres
F8               script-binding select/select-track;show-text ''                                                        #menu: Navigation > Menu interactif OSD > Liste des pistes
F9               script-binding select/select-vid;show-text ''                                                          #menu: Navigation > Menu interactif OSD > Liste des pistes vidéo
F10              script-binding select/select-aid;show-text ''                                                          #menu: Navigation > Menu interactif OSD > Liste des pistes audio
F11              script-binding select/select-sid;show-text ''                                                          #menu: Navigation > Menu interactif OSD > Liste des pistes de sous-titres
ALT+c            script-message-to chapter_make_read create_chapter                                                     #menu: Navigation > Création de chapitres > Marquer la position du chapitre
ALT+e            script-message-to chapter_make_read edit_chapter                                                       #menu: Navigation > Création de chapitres > Modifier le titre du chapitre
ALT+r            script-message-to chapter_make_read remove_chapter                                                     #menu: Navigation > Création de chapitres > Supprimer le chapitre courant
ALT+w            script-message-to chapter_make_read write_chapter chp                                                  #menu: Navigation > Création de chapitres > Créer un fichier de chapitres CHP
ALT+g            script-message-to chapter_make_read write_chapter ogm                                                  #menu: Navigation > Création de chapitres > Créer un fichier de chapitres OGM
<                playlist-prev;show-text "Liste de lecture:${playlist-pos-1}/${playlist-count}"                                 #menu: Navigation > Fichier précédent
>                playlist-next;show-text "Liste de lecture:${playlist-pos-1}/${playlist-count}"                                 #menu: Navigation > Fichier suivant
PGDWN            add chapter -1                                                                                         #menu: Navigation > Chapitre précédent
PGUP             add chapter  1                                                                                         #menu: Navigation > Chapitre suivant
F3               script-message-to chapterskip skip-to-silence;show-text "Aller au prochain silence"                           #menu: Navigation > Aller au prochain silence
ALT+q            script-message-to chapterskip chapter-skip                                                             #menu: Navigation > Changer le mode de saut des chapitres
ALT+n            script-message-to chapterskip toggle-markskip                                                          #menu: Navigation > Marquer le générique de début et de fin
,                frame-back-step;show-text "Image actuelle : ${estimated-frame-number}"                                          #menu: Navigation > Déplacement > Image précédente
.                frame-step     ;show-text "Image actuelle : ${estimated-frame-number}"                                          #menu: Navigation > Déplacement > Image suivante
RIGHT            seek  5                                                                                                #menu: Navigation > Déplacement > Avancer de 5 secondes
LEFT             seek -5                                                                                                #menu: Navigation > Déplacement > Reculer de 5 secondes
UP               no-osd add volume  1; script-message-to uosc flash-volume                                              #menu: Navigation > Volume > Volume +1
DOWN             no-osd add volume -1; script-message-to uosc flash-volume                                              #menu: Navigation > Volume > Volume −1
SHIFT+RIGHT      seek  1 exact                                                                                          #menu: Navigation > Déplacement > Avancer précisément de 1 seconde
SHIFT+LEFT       seek -1 exact                                                                                          #menu: Navigation > Déplacement > Reculer précisément de 1 seconde
SHIFT+UP         seek  80 exact                                                                                         #menu: Navigation > Déplacement > Avancer précisément de 80 secondes
SHIFT+DOWN       seek -80 exact                                                                                         #menu: Navigation > Déplacement > Reculer précisément de 80 secondes
CTRL+z           script-message-to undoredo undo                                                                        #menu: Navigation > Déplacements > Annuler le déplacement
CTRL+x           script-message-to undoredo redo                                                                        #menu: Navigation > Déplacements > Rétablir le déplacement
CTRL+ALT+z       script-message-to undoredo undoLoop                                                                    #menu: Navigation > Déplacements > Boucler les déplacements

##⇘⇘Menu principal d’uosc : Image
#                set video-aspect-override no;show-text "Format d’image : ${video-aspect-override}"                               #menu: Image > Format d’image > Valeur par défaut
#                set video-aspect-override "16:9";show-text "Format d’image : ${video-aspect-override}"                           #menu: Image > Format d’image > 16:9
#                set video-aspect-override "4:3";show-text "Format d’image : ${video-aspect-override}"                            #menu: Image > Format d’image > 4:3
#                set video-aspect-override "2.35:1";show-text "Format d’image : ${video-aspect-override}"                         #menu: Image > Format d’image > 2.35:1
A                cycle-values video-aspect-override 16:9 4:3 2.35:1 no ;show-text "Format d’image : ${video-aspect-override}"     #menu: Image > Format d’image > Parcourir les valeurs
CTRL+LEFT        cycle-values video-rotate 0 270 180 90;show-text "Rotation vidéo : ${video-rotate}"                            #menu: Image > Pivoter vers la gauche
CTRL+RIGHT       cycle-values video-rotate 0 90 180 270;show-text "Rotation vidéo : ${video-rotate}"                            #menu: Image > Pivoter vers la droite
CTRL+-           add window-scale -0.1;show-text "Taille de fenêtre : ${window-scale}"                                             #menu: Image > Zoom et déplacement > Réduire la fenêtre
CTRL+=           add window-scale  0.1;show-text "Taille de fenêtre : ${window-scale}"                                             #menu: Image > Zoom et déplacement > Agrandir la fenêtre
ALT+-            add video-zoom   -0.1;show-text "Zoom vidéo : ${video-zoom}"                                               #menu: Image > Zoom et déplacement > Dézoomer la vidéo
ALT+=            add video-zoom    0.1;show-text "Zoom vidéo : ${video-zoom}"                                               #menu: Image > Zoom et déplacement > Zoomer la vidéo
ALT+LEFT         add video-pan-x  -0.1;show-text "Position horizontale : ${video-pan-x}"                                            #menu: Image > Zoom et déplacement > Déplacer la vidéo vers la gauche
ALT+RIGHT        add video-pan-x   0.1;show-text "Position horizontale : ${video-pan-x}"                                            #menu: Image > Zoom et déplacement > Déplacer la vidéo vers la droite
ALT+UP           add video-pan-y  -0.1;show-text "Position verticale : ${video-pan-y}"                                            #menu: Image > Zoom et déplacement > Déplacer la vidéo vers le haut
ALT+DOWN         add video-pan-y   0.1;show-text "Position verticale : ${video-pan-y}"                                            #menu: Image > Zoom et déplacement > Déplacer la vidéo vers le bas
ALT+p            cycle-values panscan 0.0 1.0;show-text "Recadrage vidéo : ${panscan}"                                       #menu: Image > Activer/désactiver le recadrage plein cadre        #@state=(panscan and 'checked')
#                ignore                                                                                                 #menu: Image > ---
ALT+BS           set video-zoom 0;set panscan 0;set video-rotate 0;set video-pan-x 0;set video-pan-y 0;set video-aspect-override no;show-text "Réglages d’image réinitialisés"        #menu: Image > Réinitialiser les réglages d’image
#                ignore                                                                                                 #menu: Image > ---
CTRL+I           cycle icc-profile-auto   ;show-text "ICC Correction colorimétrique automatique : ${icc-profile-auto}"                                 #menu: Image > Activer/désactiver la correction colorimétrique ICC automatique   #@state=(icc_profile_auto and 'checked')
#                cycle sigmoid-upscaling;show-text "Conversion colorimétrique non linéaire : ${sigmoid-upscaling}"                                #menu: Image > Activer/désactiver la conversion colorimétrique non linéaire  #@state=(sigmoid_upscaling and 'checked')
1                add contrast -1;show-text "Contraste:${contrast}"                                                         #menu: Image > Couleurs > Contraste -1
2                add contrast  1;show-text "Contraste:${contrast}"                                                         #menu: Image > Couleurs > Contraste +1
3                add brightness -1;show-text "Luminosité:${brightness}"                                                       #menu: Image > Couleurs > Luminosité -1
4                add brightness  1;show-text "Luminosité:${brightness}"                                                       #menu: Image > Couleurs > Luminosité +1
5                add gamma -1;show-text "Gamma:${gamma}"                                                                 #menu: Image > Couleurs > Gamma -1
6                add gamma  1;show-text "Gamma:${gamma}"                                                                 #menu: Image > Couleurs > Gamma +1
7                add saturation -1;show-text "Saturation:${saturation}"                                                     #menu: Image > Couleurs > Saturation -1
8                add saturation  1;show-text "Saturation:${saturation}"                                                     #menu: Image > Couleurs > Saturation +1
-                add hue -1;show-text "Teinte:${hue}"                                                                     #menu: Image > Couleurs > Teinte -1
=                add hue  1;show-text "Teinte:${hue}"                                                                     #menu: Image > Couleurs > Teinte +1
CTRL+BS          set contrast 0;set brightness 0;set gamma 0;set saturation 0;set hue 0;show-text "Couleurs réinitialisées"            #menu: Image > Couleurs > Réinitialiser
D                cycle deband;show-text "Réduction des bandes:${deband}"                                                              #menu: Image > Réduction des bandes > Activer/désactiver deband	  #@state=(deband and 'checked')
ALT+z            add   deband-iterations +1;show-text "Intensité de deband augmentée : ${deband-iterations}"                             #menu: Image > Réduction des bandes > Intensité de deband +1
ALT+x            add   deband-iterations -1;show-text "Intensité de deband réduite : ${deband-iterations}"                             #menu: Image > Réduction des bandes > Intensité de deband −1
h                cycle-values tone-mapping auto spline bt.2390 hable bt.2446a st2094-40 st2094-10;show-text "Courbe de tone mapping HDR : ${tone-mapping}"   #menu: Image > Réglages HDR > Changer la courbe de tone mapping HDR
ALT+h            cycle-values hdr-compute-peak yes no;show-text "Tone mapping HDR dynamique : ${hdr-compute-peak}"                      #menu: Image > Réglages HDR > Changer le tone mapping HDR dynamique  #@state=(hdr_compute_peak and 'checked')
CTRL+h           cycle target-colorspace-hint;show-text "Mode HDR direct : ${target-colorspace-hint}"                        #menu: Image > Réglages HDR > Changer le mode HDR direct  #@state=(target_colorspace_hint and 'checked')
CTRL+t           cycle-values target-trc auto pq gamma2.2;show-text "Fonction de transfert de l’écran : ${target-trc}"                      #menu: Image > Réglages HDR > Changer la fonction de transfert de l’écran
CTRL+T           cycle-values hdr-reference-white 100 203;show-text "Blanc de référence HDR : ${hdr-reference-white}"             #menu: Image > Réglages HDR > Changer la luminance blanche de référence HDR
CTRL+g           cycle gamut-mapping-mode ;show-text "Mode de mappage du gamut : ${gamut-mapping-mode}"                               #menu: Image > Réglages HDR > Changer le mode de mappage du gamut
#                cycle tone-mapping-visualize;show-text "Visualisation du tone mapping : ${tone-mapping-visualize}"                  #menu: Image > Réglages HDR > Changer la visualisation du tone mapping
#                ignore                                                                                                 #menu: --- 

