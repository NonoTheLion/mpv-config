##⇘⇘Menu principal d’uosc
#                cycle window-minimized                                                                                 #menu: Réduire
CTRL+q           quit                                                                                                   #menu: Quitter
CTRL+Q           quit-watch-later                                                                                       #menu: Quitter et enregistrer la position

##⇘⇘Les raccourcis ci-dessous ne figurent pas dans le menu d’uosc
MENU             script-message-to uosc menu-blurred                                       # Afficher/masquer le menu uosc
PLAY             set pause no;script-message-to uosc flash-pause-indicator
PAUSE            set pause yes;script-message-to uosc flash-pause-indicator
PLAYPAUSE        cycle pause;script-message-to uosc flash-pause-indicator
STOP             set pause yes;script-message-to uosc flash-pause-indicator                # Ne quitte pas
FORWARD          seek  60
REWIND           seek -60
NEXT             playlist-next;show-text "Liste de lecture : ${playlist-pos-1}/${playlist-count}"
PREV             playlist-prev;show-text "Liste de lecture : ${playlist-pos-1}/${playlist-count}"

SPACE            cycle pause;script-message-to uosc flash-pause-indicator
ESC              set fullscreen no

# MBTN_LEFT est géré par inputevent_key.conf : clic simple ignoré, double clic en plein écran
# MBTN_MID est laissé libre volontairement
MBTN_RIGHT       script-message-to uosc menu-blurred                                       # Afficher/masquer le menu uosc
MBTN_FORWARD     playlist-next;show-text "Liste de lecture : ${playlist-pos-1}/${playlist-count}" # Bouton Suivant : fichier suivant de la liste
MBTN_BACK        playlist-prev;show-text "Liste de lecture : ${playlist-pos-1}/${playlist-count}" # Bouton Précédent : fichier précédent de la liste
WHEEL_UP         no-osd add volume  1; script-message-to uosc flash-volume
WHEEL_DOWN       no-osd add volume -1; script-message-to uosc flash-volume
CTRL+MBTN_LEFT   script-binding positioning/drag-to-pan              # Déplacer l’image
CTRL+MBTN_MID    script-binding positioning/align-to-cursor          # Aligner l’image sur le pointeur
CTRL+WHEEL_UP    script-binding positioning/cursor-centric-zoom  0.1 # Zoomer dans l’image
CTRL+WHEEL_DOWN  script-binding positioning/cursor-centric-zoom -0.1 # Dézoomer dans l’image
