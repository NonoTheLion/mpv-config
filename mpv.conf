[Tscale+]
 video-sync=display-resample
 #video-sync-max-video-change=5
 interpolation
 #interpolation-preserve=no
 tscale=sphinx
 tscale-blur=0.65

[HQ]
 scale=ewa_lanczossharp
 cscale=bilinear
 dscale=lanczos
 scale-antiring=0.5
 dscale-antiring=0.5
 linear-upscaling=no
 sigmoid-upscaling=yes
 correct-downscaling=yes
 linear-downscaling=no
 #scaler-resizes-only=no
 deband=no

[DeBand-low]
 profile-desc=DeBand low
 deband-iterations=1
 deband-threshold=48
 deband-range=16
 deband-grain=16

[DeBand-medium]
 profile-desc=deband medium
 deband-iterations=2
 deband-threshold=64
 deband-range=16
 deband-grain=24

[DeBand-high]
 profile-desc=deband high
 deband-iterations=3
 deband-threshold=64
 deband-range=16
 deband-grain=24

[HDR2SDR]
 profile-desc=Paramètres de conversion HDR vers SDR
 tone-mapping=auto
 #tone-mapping-param=1.0
 #tone-mapping-max-boost=1.0
 gamut-mapping-mode=auto
 hdr-contrast-recovery=0.30
 #hdr-contrast-smoothness=3.5
 hdr-compute-peak=auto
 hdr-peak-percentile=99.995
 hdr-peak-decay-rate=20
 hdr-scene-threshold-low=1.0
 hdr-scene-threshold-high=3.0
 allow-delayed-peak-detect=no

[SDR2HDR]
 profile-desc=Paramètres de conversion inverse SDR vers HDR
 icc-profile=""
 icc-profile-auto=no
 target-prim=auto
 #target-gamut=dci-p3   # ou adobe, pour l’espace colorimétrique argb
 target-trc=auto
 target-peak=auto  # avec --gpu-api=vulkan, la luminance maximale de l’écran doit être indiquée ; avec --gpu-api=d3d11, la valeur par défaut récupère automatiquement cette information
 target-colorspace-hint=auto
 inverse-tone-mapping=yes

##⇘⇘Autre méthode de mise à l’échelle logicielle
##Le moteur de mise à l’échelle logicielle est utilisé lorsque mpv doit effectuer une conversion de format en interne
[SWscaler]
 profile-desc=Configuration de la mise à l’échelle logicielle
 sws-allow-zimg=no                  # privilégier zimg (généralement de meilleure qualité) à libswscale ; yes par défaut. ffmpeg rencontre souvent des problèmes de compatibilité avec zimg, désactivation recommandée
 sws-scaler=bicublin                # [libswscale] <fast-bilinear|bilinear|bicubic par défaut|x|point|area|bicublin|gauss|sinc|lanczos|spline>
                                    # [libswscale] algorithme de mise à l’échelle (également appliqué au plan de chrominance)
 #sws-fast=yes                      # [libswscale] optimiser les performances au détriment de la qualité ; no par défaut
 zimg-scaler-chroma=bicubic         # [zimg] <point|bilinear|bicubic|spline16|spline36|lanczos par défaut>
                                    # [zimg] algorithme de reconstruction de la chrominance
 #zimg-scaler-chroma-param-a=1/3    # [zimg] sous-paramètre de l’algorithme de reconstruction de la chrominance ; sans effet sur les algorithmes non réglables ; default par défaut
 #zimg-scaler-chroma-param-b=1/3
 zimg-scaler=bicubic                # [zimg] algorithme de mise à l’échelle ; voir --zimg-scaler-chroma pour les valeurs disponibles
 zimg-scaler-param-a=1/3            # [zimg] sous-paramètre de l’algorithme de mise à l’échelle
 zimg-scaler-param-b=1/3
 #zimg-dither=error-diffusion       # [zimg] <no|ordered|random par défaut|error-diffusion> algorithme de tramage de la profondeur de couleur
 zimg-fast=no                       # [zimg] optimiser les performances au détriment de la qualité ; yes par défaut


[NNEDI3]
 profile-desc=Convient à la plupart des usages
 glsl-shaders="~~/shaders/nnedi3/nnedi3-nns32-win8x4.glsl;~~/shaders/igv/SSimDownscaler.glsl"

