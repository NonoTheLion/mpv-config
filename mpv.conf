##⇘⇘Informations générales :
## La présence du symbole de commentaire « # » en début de ligne signifie que l’option est désactivée (MPV utilise donc son réglage par défaut) ; supprimez-le pour l’activer
## Certains paramètres activés n’ont pas de « = » : leur valeur réelle est alors « yes ». Par exemple, deband est désactivé par défaut : --deband équivaut à --deband=yes ; de même, --deband=no équivaut à commenter ce paramètre
## Explication des commentaires —— # <valeurs possibles> [conditions requises] description du paramètre (complément)

########
# Base #
########

## Décodage
vo=gpu-next                           # <gpu/gpu-next/libmpv> Pilote de sortie vidéo. De nombreuses options suivantes ne fonctionnent correctement qu’avec ces trois choix. La valeur par défaut de la version actuelle est gpu-next
                                      ## gpu est l’ancien moteur de rendu et ne dispose plus de nombreuses fonctions récentes ; gpu-next lui succède ; libmpv est conçu pour certaines interfaces et n’est généralement pas utilisé
                                      ## gpu-next sait interpréter et mapper les métadonnées de la couche RPU Dolby Vision, mais ne prend pas encore en charge celles de la couche EL
                                      ## Pour les différences précises entre gpu-next et gpu, consultez la page correspondante du wiki officiel : https://github.com/mpv-player/mpv/wiki/GPU-Next-vs-GPU
gpu-api=vulkan                        # <opengl/vulkan/d3d11> [d3d11 recommandé avec l’interpolation d’images SVP] Sélectionne l’API graphique
                                      ## opengl est le choix le moins recommandé. Sous Windows, le rendu natif est d3d11 (valeur par défaut de mpv sous Windows ; pensez à activer le mode d’alimentation adaptatif du GPU)
                                      ## d3d11-adapter permet de choisir la carte graphique utilisée par mpv. Voir la documentation : https://mpv.io/manual/master/#options-d3d11-adapt
                                      ### Quelle valeur choisir pour gpu-api ?
                                      ## Linux/macOS : vulkan ou opengl ; vulkan est recommandé
                                      ## Windows : vulkan, d3d11 et opengl sont disponibles. L’API native d3d11 est recommandée : elle offre les meilleures performances et une sortie 10bit
#gpu-context=auto                     # <win/dxinterop/angle/d3d11/winvk/macvk> Sélectionne le moteur de sortie. La valeur correcte est généralement choisie automatiquement par --gpu-api=<value> ; avec --gpu-api=opengl, angle est sélectionné par défaut, mais win/dxinterop est préférable
#fbo-format=auto                      # Précision du traitement interne. La valeur correcte est généralement choisie automatiquement par --gpu-api=<value>, avec une précision de 16 bits ou plus privilégiée par défaut. Ce paramètre n’est pas modifiable avec --vo=gpu-next
#d3d11-exclusive-fs=yes               # Plein écran exclusif avec --gpu-api=d3d11
#d3d11-flip=no                        # [survient généralement lorsque --d3d11-exclusive-fs=yes et --on-top sont utilisés ensemble] Peut éviter le gel de l’image en plein écran dans MPV
                                      # Activez ce paramètre si ce problème existe ; sinon, ne l’utilisez pas, car le modèle de présentation flip offre les meilleures performances avec d3d11. Les tests montrent une limitation des performances du mode flip avec les pilotes NVIDIA ; il est conseillé de le désactiver en cas de goulot d’étranglement du rendu
                                      # [si --gpu-context=angle provoque aussi un gel en plein écran] Utilisez --angle-flip=no à la place de d3d11-flip=no
#d3d11va-zero-copy=yes                # [avec gpu-api=d3d11] Par défaut, lors du décodage matériel avec --gpu-api=d3d11, l’image vidéo est copiée de la surface du décodeur (GPU vers GPU) vers une ressource de shader.
                                      # Cette option évite la copie en échantillonnant directement l’image du décodeur. Cela peut améliorer les performances et réduire la consommation, mais le remplissage peut entraîner un échantillonnage incorrect aux bords inférieur et droit de l’image, ainsi que des erreurs de pilote, car Direct3D 11 n’autorise techniquement pas l’échantillonnage depuis une surface de décodeur (bien que la plupart des pilotes le prennent en charge.)
                                      # Vous pouvez essayer cette option si le décodage saccade ou perd des images
hwdec=auto-copy-safe                  # Indique l’API de décodage vidéo matériel à utiliser ; choisissez no pour le décodage logiciel. Sous Windows, d3d11va ou d3d12va-copy sont recommandés. d3d11va offre la meilleure prise en charge du décodage matériel, notamment l’accélération native du format av1 en 4k60 et en 8k. nvdec prend en charge le décodage matériel yuv444, mais ce format est rare et son décodage logiciel ne pose généralement pas de problème
                                      # --hwdec=auto-safe équivaut à --hwdec=yes. Avec --gpu-api=d3d11, auto privilégie d3d11va ; avec --gpu-api=vulkan, auto privilégie nvdec. auto-copy privilégie d3d11va-copy
                                      # Le décodage matériel natif sans copie, théoriquement le plus efficace, n’est pas recommandé afin que tous les réglages, filtres et shaders fonctionnent correctement (certains ne le prennent pas en charge). Notez que le décodage nvdec sans copie ne prend pas en charge d3d11, seulement vulkan et opengl
                                      ## Une liste de plusieurs valeurs par ordre de priorité est aussi possible ; par exemple, vulkan-copy,nvdec-copy,auto essaie successivement ces modes de décodage
                                      ## Si vous utilisez auto sans imposer une API de décodage matériel, le paramètre auto-safe est recommandé : il privilégie les API activement prises en charge par les développeurs (d3d11va ou nvdec sous Windows)
                                      ## Le décodage matériel peut rencontrer certains problèmes ; privilégiez le décodage logiciel (le manuel officiel déconseille le décodage matériel)
                                      ## Les tests montrent qu’avec --vo=gpu, les modes de décodage matériel copy causent des pertes d’images anormales sur les vidéos 4K ou supérieures à >=60fps ; utilisez plutôt le décodage logiciel ou matériel sans copie
#hwdec-codecs=all                     # Essaie le décodage matériel pour les formats de codec sélectionnés ; la valeur par défaut actuelle est --hwdec-codecs="h264,vc1,hevc,vp8,vp9,av1,prores"
#hwdec-threads=0                      # Nombre de threads utilisés pour le décodage matériel (valeur par défaut : 4). Avec 0, ce nombre est déterminé automatiquement selon le nombre de cœurs CPU disponibles
#vd-lavc-dr=no                        # [avec gpu-api=d3d11] Active le rendu direct (par défaut : auto). Avec yes, la vidéo est décodée directement dans la mémoire vidéo du GPU (ou dans un tampon intermédiaire)
                                      # Avec no, la vidéo est décodée dans la mémoire système puis copiée dans la mémoire du GPU. Cela peut réduire les performances, mais résoudre des problèmes sur certains GPU Intel d’entrée de gamme
                                      # La valeur auto sélectionne automatiquement le mode selon les capacités du décodeur et du GPU (désactivation automatique sur les GPU Intel d’entrée de gamme)
#vd-queue-enable=yes                  # Active la file d’attente du décodeur vidéo (par défaut : no). Avec yes, le décodeur vidéo fonctionne dans un thread séparé ; cela peut réduire les performances, mais résoudre des problèmes sur certains GPU Intel d’entrée de gamme
#vd-lavc-threads=8                    # Nombre de threads de décodage. Leur prise en charge effective dépend du codec (valeur par défaut : 0). 0 détecte automatiquement le nombre de cœurs de la machine et en utilise jusqu’à 16. Vous pouvez définir manuellement plus de 16 threads
#vd-lavc-assume-old-x264=yes          # Suppose que la vidéo a été encodée avec une ancienne version défectueuse de x264 (par défaut : no). À essayer uniquement en cas d’erreur de décodage d’une vidéo x264 au format yuv444p10, pour résoudre les problèmes de compatibilité de ffmpeg avec les anciens encodages x264
#opengl-pbo=yes                       # Active les PBO. Cela peut être plus rapide avec certains pilotes, surtout si la vidéo source est volumineuse (par exemple une vidéo dite « 4K »). Avec d’autres pilotes, cela peut être plus lent ou causer des problèmes de latence
##⇘⇘Gestion des ordinateurs portables à deux GPU
#vd=h264_qsv,hevc_qsv,mpeg2_qsv,vp9_qsv,vp8_qsv,av1_qsv
                                      # Avec une configuration associant un GPU Intel intégré et un NVDIA_MX_x50, le rendu sur le GPU dédié ne permet en pratique que le décodage logiciel, même si hwdec demande le décodage matériel, car les GPU dédiés de la série MX ne possèdent pas d’unité de décodage
                                      # Ce paramètre permet au GPU intégré d’assurer le décodage matériel et le rendu auxiliaire tout en laissant le rendu principal au GPU dédié (avec hwdec=no, l’avance rapide peut bloquer MPV ; un mode de décodage xxxx-copy est recommandé)
#d3d11-adapter="NVIDIA GeForce RTX 2070 Super"
                                      # [avec gpu-api=d3d11] Désigne une carte graphique comme sortie de rendu principale ; par défaut, la carte de rendu principale définie par le système est sélectionnée automatiquement
                                      # Adaptez le nom de la carte d’après le Gestionnaire des tâches. Ce paramètre équivaut à demander dans le panneau du pilote que mpv s’exécute sur le GPU dédié
                                      # Par exemple, avec l’écran interne d’un portable à double GPU I+N, « Intel(R) UHD Graphics » est réellement utilisé ; désigner le GPU dédié ici peut réduire la part de rendu 3d des deux GPU affichée dans le Gestionnaire des tâches
                                      # Avec un écran externe, la plupart des portables à double GPU se comportent comme si le GPU dédié était directement connecté ; la sortie utilise alors automatiquement ce GPU sans ce paramètre
                                      # [avec gpu-api=vulkan] Utilisez --vulkan-device à la place de --d3d11-adapter
#vulkan-device="NVIDIA GeForce RTX 2070 Super"
                                      # [avec gpu-api=vulkan] Ce paramètre remplace --d3d11-adapter pour sélectionner la carte graphique
                                      # Vide par défaut ; exemple : "NVIDIA GeForce RTX 2070 Super" (le nom complet du périphérique ou son UUID est obligatoire)

########
# Fonctions #
########

title=${?pause==yes:⏸}${?mute==yes:🔇}${?ontop==yes:📌}${?demuxer-via-network==yes:${media-title}}${?demuxer-via-network==no:${filename}}
                                      # Personnalise le titre affiché dans la fenêtre et affecte aussi la propriété title de certains scripts. Valeur par défaut : ${?media-title:${media-title}}${!media-title:No file}
osc=no                                # [prérequis pour utiliser un script osc tiers] Désactive l’OSC d’origine (le script « osc.lua » intégré) afin d’assurer la compatibilité avec les interfaces tierces
#fs                                   # fs=fullscreen : démarre en plein écran
#no-border                            # L’interface native du système est utilisée par défaut ; activez cette option pour une fenêtre sans bordure (sans décorations de fenêtre Windows)
no-title-bar                          # Contrôle l’utilisation de la barre de titre pendant la lecture ; elle est activée par défaut. Contrairement à --no-border, --no-title-bar permet de conserver les fonctions natives des fenêtres Windows
input-ime=no                          # <yes|no par défaut> Active ou non la fonction IME globale ; par défaut, l’IME n’est activé que pendant la saisie de texte
#media-controls=yes                   # <yes|player par défaut|no>  Active l’intégration de l’interface de contrôle multimédia SMTC (Windows uniquement)
                                      ## Avec player, seul le lecteur mpv utilise les commandes ; yes active aussi les commandes intégrées à libmpv
#backdrop-type=auto                   # <auto|none|mica|acrylic|mica-alt> Contrôle le style de l’arrière-plan et des bordures (Windows uniquement)
#window-corners=roundsmall            # <default|donotround|round|roundsmall> Option réservée à Windows ; contrôle l’arrondi des coins de la fenêtre
#window-maximized=yes                 # Maximise automatiquement la fenêtre au lancement de MPV (avec une interface sans bordure, cela ressemble à un « mode fenêtre sans bordure » et non au « plein écran »)
#background=none                      # <none|color|tiles par défaut> Si l’image possède un canal alpha, indique avec quel arrière-plan éventuel la composer. Sans canal alpha, cette option n’a aucun effet
                                      ## none : ne compose pas l’image et conserve son alpha ; color : compose l’image avec la couleur d’arrière-plan (définie par --background-color, noire par défaut)
                                      ## tiles : compose l’image avec un damier 16x16 utilisant les couleurs définies par --background-tile-color-0 et --background-tile-color-1 (grise et blanche par défaut)
#border-background=none               # <none|color|tiles par défaut|blur> Semblable à --background, mais uniquement pour dessiner les parties de la fenêtre mpv non couvertes par la vidéo
#background-blur-radius=16            # <0-100> Avec --border-background=blur, définit l’intensité du flou d’arrière-plan. Valeur par défaut : 16
#background-color="#778899"           # <format (AA)RRGGBB> Avec --background=color, couleur utilisée pour dessiner les parties de la fenêtre mpv non couvertes par la vidéo
#background-tile-color-0="#778899"    # <format (AA)RRGGBB> Avec --background=tiles, couleur utilisée pour dessiner les parties de la fenêtre mpv non couvertes par la vidéo
#background-tile-color-1="#778899"    # <format (AA)RRGGBB> Avec --background=tiles, couleur utilisée pour dessiner les parties de la fenêtre mpv non couvertes par la vidéo
#background-tile-size=16              # <1-4096> Avec --background=tiles, définit la taille du motif d’arrière-plan en pixels. Valeur par défaut : 16
#hidpi-window-scale=yes               # <yes|no par défaut> Active ou non la mise à l’échelle HIDPI. Ce paramètre peut affecter la taille de la fenêtre ; le désactiver permet de rendre cette taille indépendante du DPI
                                      # Avec la valeur par défaut, la fenêtre vidéo initiale change de taille selon le DPI : par exemple, une vidéo 800p ouverte sur un écran 4k réglé à 200 % est automatiquement agrandie 2 fois jusqu’à 1600p. Cela affecte aussi certains contenus d’autres scripts
#window-scale=1.0                     # Facteur d’échelle de la fenêtre par rapport à la taille d’origine de la vidéo ; 1.0 par défaut
                                      # Pour obtenir une échelle réelle de 1, hidpi-window-scale=no est nécessaire (sinon le DPI système est pris en compte). Priorité inférieure à geometry et aux paramètres --autofit
#current-window-scale=1.0             # Même fonction que window-scale, mais permet de modifier dynamiquement la taille de la fenêtre en cours d’exécution
#auto-window-resize=yes               # <yes par défaut|no> Autorise ou non mpv à ajuster automatiquement la taille de la fenêtre lors d’un changement de fichier. Cette option n’affecte pas geometry ni autofit
#geometry=75%x70%                     # <[W[xH]][+-x+-y][/WS]>, <x:y> Dimensions précises de la fenêtre au démarrage (ce qui les fige) et/ou position (calculée du coin au bord d’image le plus proche)
                                      # Si le rapport diffère de celui de la vidéo, des bandes noires sont ajoutées automatiquement. Même en cas d’étirement, le rapport défini est conservé autant que possible. Avec cette option, les paramètres --autofit et --window-scale sont sans effet
autofit=70%                           # <[W[xH]]> Taille initiale de la fenêtre et taille cible de mise à l’échelle lors de la lecture en mode fenêtré (pourcentage ou pixels), valeur par défaut : 60 %
#autofit-larger=90%x90%               # <[W[xH]]> Pourcentage maximal de l’écran occupé en mode fenêtré (par exemple, pour éviter une fenêtre initiale trop grande lors de l’ouverture d’une vidéo 4k sur un écran FHD)
autofit-smaller=40%x30%               # <[W[xH]]> Pourcentage minimal de l’écran occupé en mode fenêtré (par exemple, pour éviter une fenêtre initiale trop petite lors de l’ouverture d’une vidéo 480p sur un écran 4k)
#keepaspect=no                        # yes par défaut : MPV étire normalement la vidéo en conservant son rapport d’origine. Activez cette option pour toujours déformer l’image aux dimensions de la fenêtre
#keepaspect-window=no                 # yes par défaut : le rapport de la fenêtre MPV est normalement verrouillé sur celui de la vidéo. Activez cette option pour pouvoir étirer librement la fenêtre (avec keepaspect=yes, des bandes noires remplissent les bords)
#panscan=1.0                          # <0.0-1.0> Recadre l’image pour remplir la fenêtre (utilisation recommandée avec keepaspect-window=no)
#pause                                # Démarre le lecteur en pause
#loop=inf                             # <N|inf|no> Lit toujours le fichier actuel en boucle
#loop-playlist=no                     # <N|inf|force|no> Lecture en boucle de la liste de lecture
#keep-open=yes                        # <yes|no par défaut|always> Reste ouvert à la fin de la liste de lecture ; always : met automatiquement en pause à la fin du fichier sans lire le suivant
#keep-open-pause=no                   # <yes par défaut|no> Met en pause à la fin de la liste de lecture
                                      ## --keep-open=yes et --keep-open-pause=yes sont des prérequis pour l’activation du profil conditionnel [end]
idle=yes                              # <yes|no|once par défaut> Reste inactif en attente (mpv continue de fonctionner après l’arrêt de la lecture ou la fin de tous les fichiers)
#untimed                              # Ne pas temporiser la sortie des images vidéo. (Empêche l’affichage correct de la valeur d’interpolation d’images)
log-file="~~/files/mpv.log"           # Enregistre le journal
ontop                                 # Fenêtre toujours au premier plan
snap-window=yes                       # Accroche la fenêtre aux bords de l’écran lors de son déplacement (systèmes Windows uniquement)
#window-affinity=default              # <default par défaut|excludefromcmcapture|monitor> Contrôle le comportement d’affinité de la fenêtre mpv. excludefromcmcapture : la fenêtre MPV est totalement exclue des captures par les applications externes ou les logiciels d’enregistrement d’écran ; monitor : noircit la zone extérieure à la fenêtre MPV
hr-seek=yes                           # <no|absolute|default|yes|always> Détermine quand effectuer une recherche précise non limitée aux images clés. Ce type de recherche doit décoder la vidéo depuis l’image clé précédente jusqu’à la position cible et peut donc prendre du temps selon les performances de décodage
                                      # no : désactivée ; absolute : recherche précise pour les chapitres uniquement ; default : semblable à absolute, mais active la recherche précise pour l’audio seul. Le comportement peut évoluer selon les versions ; yes : utilise la recherche précise autant que possible ; always : identique à yes (pour compatibilité)
hr-seek-framedrop=no                  # Perd des images pendant une recherche ; la désactivation aide à corriger le retard audio    # no recommandé avec l’interpolation d’images SVP
save-position-on-quit=yes             # Mémorise l’état de lecture à la fermeture. Le répertoire de cache par défaut est « watch_later » dans le dossier de configuration
                                      # Le raccourci Q permet aussi d’enregistrer la progression en quittant
write-filename-in-watch-later-config  # Écrit le nom du fichier dans le fichier cache de l’historique de lecture
#ignore-path-in-watch-later-config    # Ignore le chemin avec la fonction « regarder plus tard » (utilise donc uniquement le nom du fichier). (Valeur par défaut : no)
resume-playback-check-mtime=yes       # Reprend la lecture depuis le sous-répertoire de configuration watch_later (généralement ~/.config/mpv/watch_later/) si la date de modification du fichier est identique à celle enregistrée. Cela évite un comportement incorrect avec des fichiers homonymes dont le contenu diffère (par défaut : no)
watch-later-dir="~~/cache/watch_later"
                                      # Stocke dans ce répertoire le dossier « watch_later », dont les fichiers enregistrent les options indiquées par --watch-later-options
watch-later-options=start,vid,aid,sid
                                      # [valeur vide recommandée avec l’interpolation d’images SVP] Liste blanche de la fonction « regarder plus tard »
                                      # Avec --save-position-on-quit=yes ou le raccourci qui enregistre dans « regarder plus tard » à la fermeture, l’absence de liste blanche enregistre aussi de nombreux états, notamment la liste des filtres, le volume et la vitesse, puis les restaure au prochain lancement
                                      # Valeurs précises des paramètres : start,speed,edition,volume,mute,audio-delay,gamma,brightness,contrast,saturation,hue,deinterlace,vf,af,panscan,aid,vid,sid,sub-delay,sub-speed,sub-pos,sub-visibility,secondary-sub-visibility,sub-scale,sub-use-margins,sub-ass-force-margins,sub-ass-vsfilter-aspect-compat,sub-ass-override,ab-loop-a,ab-loop-b,video-aspect-override
#watch-later-options-clr              # Interdit la restauration de tous les réglages modifiés pendant la lecture lors de la reprise de l’historique, ce qui peut résoudre certains problèmes connus
#watch-later-options-remove=contrast  # Utilisez cette option pour empêcher la restauration de certains paramètres
                                      # Les paramètres doivent actuellement être indiqués séparément ; une liste comme --watch-later-options=option1,option2,... n’est pas encore possible. Il est conseillé de configurer une liste blanche avec watch-later-options
save-watch-history=yes                # <yes|no par défaut> Enregistre ou non les fichiers lus afin de pouvoir ensuite les parcourir avec le script interne select
watch-history-path=~~/files/watch_history.jsonl
                                      # Chemin de stockage de l’historique de visionnage. Valeur par défaut : ~~state/watch_history.jsonl
                                      # Chaque ligne de ce fichier contient un objet JSON. Son champ time est un UNIX timestamp, son champ path est le path normalisé et son champ title est le title (si disponible)
reset-on-next-file=vid,aid,sid,secondary-sid,vf,af,loop-file,deinterlace,contrast,brightness,gamma,saturation,hue,video-zoom,video-rotate,video-pan-x,video-pan-y,panscan,speed,audio-delay,sub-pos,sub-scale,sub-delay,sub-speed,sub-visibility,secondary-sub-visibility
                                      # Réglages à réinitialiser lors de la lecture du fichier suivant (couleurs, image, pistes, sous-titres et filtres)
input-ipc-server=/tmp/mpvsocket       # input-ipc-server=<ipc_path> Active la fonction IPC
                                      # Avec SVP manager, cette option doit avoir la valeur mpvpipe
#demuxer-max-bytes=500MiB             # Taille cible du cache lors de la lecture de vidéos en réseau (KiB ou MiB)
#demuxer-readahead-secs=20            # Limite la durée maximale du cache des vidéos en réseau (en secondes)
#video-exts=3g2,3gp,asf,avi,bdmv,f4v,flv,h264,h265,iso,ifo,ivf,m2ts,m4v,mkv,mov,mp4,mp4v,mpeg,mpg,ogm,ogv,rm,rmvb,ts,vob,webm,wmv,y4m
                                      # Liste des extensions de fichiers vidéo à faire correspondre avec les options --autocreate-playlist et --directory-filter-types
#audio-exts=aac,ac3,aiff,ape,au,dsf,dts,flac,m4a,mid,midi,mka,mp3,mp4a,mxf,oga,ogg,opus,spx,tak,tta,wav,weba,wma,wv
                                      # Liste des extensions de fichiers audio à faire correspondre avec les options --audio-file-auto, --autocreate-playlist et --directory-filter-types
#image-exts=apng,avif,bmp,gif,j2k,jp2,jfif,jpeg,jpg,jxl,mj2,png,qoi,svg,tga,tif,tiff,webp
                                      # Liste des extensions de fichiers image à faire correspondre avec les options --cover-art-auto, --autocreate-playlist et --directory-filter-types
#playlist-exts=cue,edl,m3u,m3u8,pls    
                                      # Liste des extensions de fichiers de liste de lecture à reconnaître
#playlist-inherit-options=yes         # <yes|no par défaut|current> Indique si les options du fichier de liste de lecture sont héritées par chacun de ses éléments. La valeur `current` signifie que seuls les fichiers des listes créées par `--automerate-playlist` héritent de ces options
directory-mode=ignore                 # <auto par défaut|recursive|lazy|ignore> À l’ouverture d’un répertoire, choisit de parcourir récursivement, paresseusement ou d’ignorer tous les sous-répertoires
#directory-filter-types=video         # <video,audio,image> Types de fichiers multimédias à filtrer lors de l’ouverture d’un répertoire. Si la liste est vide, tous les fichiers sont ajoutés à la liste de lecture (valeur par défaut : video,audio,image)
#autocreate-playlist=same             # <no par défaut|filter|same> Définit le comportement de création automatique d’une liste de lecture lors de l’ouverture d’un fichier local
                                      ## no : n’en crée pas et charge uniquement le fichier ; filter : crée depuis le répertoire parent une liste contenant les fichiers des types définis par --directory-filter-types ; same : crée depuis le répertoire parent une liste contenant les fichiers du même type multimédia, selon l’option --*-exts correspondant au fichier chargé
                                      #! Attention : cette option dépend aussi de --directory-mode ; si --directory-mode n’est pas ignore, la liste de lecture contiendra les sous-répertoires
#ordered-chapters=no                  # Prise en charge des chapitres ordonnés, activée par défaut ; utilisez no-ordered-chapters pour la désactiver
                                      # Cette option prend en charge la fonction chapter-links de mkv ; si elle est désactivée, mpv ne charge ni ne recherche les segments vidéo d’autres fichiers et ignore aussi tout ordre de chapitres défini par le fichier principal
metadata-codepage=auto                # Définit l’encodage des différentes métadonnées d’entrée (valeur par défaut : auto). Cela affecte l’interprétation des balises, titres de chapitres, etc. Par exemple, auto active la détection automatique de l’encodage (les encodages autres que UTF-8 constituent un cas limite obscur)
msg-level=all=info,auto_profiles=warn 
                                      # <module1=level1,module2=level2,...> Contrôle le niveau de détail des journaux de chaque module dans la console et affecte aussi le fichier journal. level disponibles : <no|fatal|error|warn|info|status par défaut|verbose|debug|trace>
                                      # Cet exemple n’affiche que les messages de niveau info ou supérieur. Pour plus d’informations et d’exemples, consultez le manuel officiel : https://mpv.io/manual/master/#options-msg-level

#######
# OSD #
#######

##⇘⇘OSD signifie On-Screen-Display : il s’agit généralement des informations affichées en surimpression à l’écran. OSC signifie on-screen-controller et désigne dans MPV l’interface de contrôle simplifiée
##Plus d’options de personnalisation : https://mpv.io/manual/master/#osd

no-osd-bar
osd-on-seek=msg-bar                   # <no,bar,msg,msg-bar> Type d’informations affichées lors d’un déplacement sur la barre temporelle
osd-bar-w=100
osd-bar-h=2
osd-bar-align-y=-1
#osd-fonts-dir=~~/fonts               # Répertoire de recherche des polices OSD ; l’exemple correspond à la valeur par défaut
osd-font="Noto Sans Mono CJK SC"      # Police de l’OSD
osd-font-size=24                      # Modifie la taille de la police OSD (globale, affecte le texte de plusieurs fonctions) (valeur par défaut : 38)
osd-color="#FFFFFF"                   # Couleur principale du texte OSD. <format (AA)RRGGBB> AA est l’opacité hexadécimale et RRGGBB la représentation hexadécimale de la couleur
osd-outline-size=1.0                  # Taille du contour du texte OSD
osd-outline-color="#1C1B1F"           # Couleur du contour du texte OSD
osd-shadow-offset=0                   # Taille de l’ombre du texte et des sous-titres OSD
osd-back-color="#1C1B1F"              # Couleur de l’ombre/de l’arrière-plan du texte et des sous-titres OSD
osd-border-style=outline-and-shadow   # <par défaut outline-and-shadow|opaque-box|background-box> Style de bordure du texte et des sous-titres
                                      # outline-and-shadow : dessine un contour et une ombre ; opaque-box : dessine le contour et l’ombre sous forme d’un cadre opaque épousant chaque ligne de texte ; background-box : dessine un cadre d’arrière-plan englobant toutes les lignes de texte
#osd-spacing=1                        # Espacement des caractères du texte et des sous-titres OSD
#osd-blur=0.5                         # Flou des bords du texte et des sous-titres OSD <0..20.0>
#osd-bar-outline-size=1.2             # Taille du contour de la barre OSD
#osd-scale-by-window=no               # <par défaut yes|no> Indique si l’OSD doit être redimensionné selon la taille de la fenêtre
osd-playlist-entry=filename           # <par défaut title|filename|both> Affiche dans la liste de lecture le titre du média, le nom du fichier ou les deux
#osd-playing-msg="${?demuxer-via-network==yes:${media-title}}${?demuxer-via-network==no:${filename}} ${!playlist-count==1:Liste :${playlist-pos-1}/${playlist-count}}"
                                      # Informations brièvement affichées au début de chaque fichier. Le préréglage affiche le nom du fichier
osd-status-msg=${playback-time/full} / ${duration/full} (${percent-pos}%)\nimage : ${estimated-frame-number} / ${estimated-frame-count}
                                      # Informations affichées par l’OSD lors d’un saut
osd-fractions=yes                     # Affiche le temps OSD en secondes avec une précision à la milliseconde, utile pour connaître l’horodatage exact d’une image vidéo
osd-duration=2000                     # Durée globale d’affichage des messages texte OSD, en millisecondes (valeur par défaut : 1000)
#osd-playing-msg-duration=2000        # Durée du texte --osd-playing-msg ; si cette option n’est pas définie, la durée globale est utilisée

########
# Vidéo #
########

### Les réglages vidéo sont définis au moyen de profils. Les paramètres ci-dessous ne sont que des exemples documentés ; pour les réglages effectifs, voir les profils correspondants plus bas, dans [Compléments des paramètres généraux] et [Profils]

##⇘⇘ Paramètres de gestion des couleurs ICC
#icc-profile="~~/icc/ITU-RBT709ReferenceDisplay.icc" 
                                      # Charge un profil ICC et l’utilise pour convertir le RVB de la vidéo vers la sortie écran. Choisissez le profil ICC correspondant au gamut du moniteur. Cette option remplace --target-prim, --target-trc et --icc-profile-auto
                                      ## Comme la cible d’étalonnage de mpv est bt.1886 (proche de gamma=2.4), l’emploi de --icc-profile-auto avec le profil système par défaut (srgb), dont la courbe de transfert est généralement srgb, peut produire un affichage incorrect dans mpv
                                      ## Pour éviter ce problème, il est préférable d’indiquer manuellement le profil d’étalonnage du gamut du moniteur doté d’une courbe gamma2.4 ; l’exemple ci-dessus peut servir de référence
#icc-profile-auto                     # À activer après un étalonnage professionnel si le répertoire système contient le profil ICM correspondant. Sur un écran à large gamut non étalonné, définir manuellement target-prim=<value>
                                      # La gestion des couleurs permet d’afficher assez fidèlement une vidéo en espace colorimétrique standard sur un écran à large gamut ; la désactiver rétablit un rendu sursaturé
                                      # Avec la gestion des couleurs ICC, la courbe cible bt.1886 de mpv peut actuellement provoquer une dominante colorée ou une image trop sombre sur certains écrans https://github.com/mpv-player/mpv/issues/8009
                                      ## L’option --icc-force-contrast=1000 peut corriger l’image trop sombre causée par le contraste très élevé de certains profils (sur OLED, déterminez vous-même une valeur adaptée). #! Attention : cela ne corrige toujours pas l’assombrissement dû au mappage HDR
                                      # Autre possibilité : gérer l’espace colorimétrique avec --target-prim=<value>
#icc-intent=0                         # Intention de rendu ICC : 0 : perceptive, 1 : colorimétrie relative (valeur par défaut), 2 : saturation, 3 : colorimétrie absolue. Le rendu perceptif est recommandé  https://github.com/mpv-player/mpv/issues/8009#issuecomment-923607273
#icc-force-contrast=1000              # <no|0-1000000|inf> Gestion des couleurs. Remplace les données de contraste statique du profil ICC ; no, par défaut, ne les remplace pas. Pour un OLED, inf représente un contraste infini (repli automatique sur 1000 si cette donnée manque dans le profil ICC). Cette option n’agit que sur le contenu bt.1886
                                      ## Un LCD ordinaire utilise généralement 1000 (selon les caractéristiques natives de la dalle) ; avec un écran OLED, essayez 1000000 ou la valeur spéciale inf. Régler un LCD sur 1000 peut empêcher certains profils au contraste très élevé de rendre les noirs excessivement profonds
                                      #! Avec --vo=gpu-next, cette option est sans effet : les données de contraste inscrites dans le profil ICC sont utilisées, ou 1000 par défaut si elles manquent
#icc-3dlut-size=64x64x64              # <par défaut auto|RxGxB> Taille de la LUT 3D générée à partir du profil ICC dans chaque dimension. Plage <2--512>
#icc-cache=no                         # Indique s’il faut stocker localement le cache 3dlut du profil ICC ; activé par défaut
#icc-cache-dir="~~/cache/icc_cache"   # Répertoire où stocker et charger les LUT 3D créées à partir de profils ICC, afin d’accélérer le chargement. Ces fichiers contiennent des LUT non compressées ; leur taille dépend de --icc-3dlut-size et peut être très importante. Attention : aucun nettoyage automatique n’est effectué, de sorte que d’anciens fichiers de cache inutilisés peuvent subsister indéfiniment
                                      ## Le cache 3dlut est censé accélérer le chargement, mais un disque aux E/S insuffisantes peut produire l’effet inverse ; activez-le ou non selon votre situation
#use-embedded-icc-profile=no          # Charge le profil ICC intégré au fichier multimédia, par exemple une image PNG (par défaut : yes). Avec --vo=gpu, cette option n’agit que si un profil ICC d’affichage est aussi utilisé (--icc-profile ou --icc-profile-auto)

##⇘⇘ Paramètres de gestion des couleurs target
#target-prim=auto                     # Sur un écran à large gamut, définir une valeur précise pour éviter la sursaturation. Sans gestion des couleurs ICC, les couleurs vidéo sont adaptées à cet espace. Un écran srgb peut garder la valeur par défaut (bt.709). Exemples : adobe pour un écran argb à 99 %, dci-p3 ou display-p3 pour un écran couvrant plus de 90 % du gamut p3
                                      # Gérer l’espace colorimétrique avec --target-prim=<value> peut créer une dominante en HDR ; activer --gamut-mapping-mode=clip lors du mappage HDR corrige ce problème  https://github.com/mpv-player/mpv/issues/9071
                                      #! Attention : à partir de Windows 11 24H2, ne modifiez pas cette option si le HDR système ou l’ACM (gestion automatique des couleurs) est activé, sous peine de restreindre deux fois le gamut et de désaturer les couleurs
#target-gamut=dci-p3                  # [Actif avec --vo=gpu-next] Limite explicitement le gamut de l’écran. Cette option permet par exemple de limiter la sortie à DCIP3-in-BT.2020 : réglez `--target-prim` sur la spécification de l’espace colorimétrique et `--target-gamut` sur le gamut de sortie voulu. Dépend de `--target-prim`
                                      ## Les versions récentes de mpv acceptent des primaires CIE xy personnalisées. Format des coordonnées chromatiques : `Rx,Ry,Gx,Gy,Bx,By,Wx,Wy` (primaire rouge, primaire verte, primaire bleue, point blanc). Toutes les valeurs doivent être comprises entre 0.0 et 1.0
                                      #! Attention : à partir de Windows 11 24H2, ne modifiez pas cette option si le HDR système ou l’ACM (gestion automatique des couleurs) est activé, sous peine de restreindre deux fois le gamut et de désaturer les couleurs
#target-trc=gamma2.2                  # Définit la fonction de transfert (gamma) de l’écran ; actif sans gestion des couleurs ICC. Valeur par défaut auto : avec --vo=gpu, emploie gamma2.2 en HDR et ne fait rien en SDR ; avec --vo=gpu-next, emploie toujours la courbe bt.1886 (en supposant un contraste infini, donc un OLED)
                                      ## Pour les écrans non OLED et hors HDR, il est conseillé de toujours utiliser gamma2.2 afin d’éviter une image mpv trop sombre. En passthrough HDR, employer auto ou pq
                                      ## Sur un écran à large gamut et en HDR, scrgb (transfert linéaire étendu) est également possible. Si le système ne fournit pas correctement les informations d’affichage, le résultat équivaut en pratique à bt.709. Disponible uniquement avec --vo=gpu-next
#target-contrast=auto                 # <auto|10-1000000|inf> Définit le contraste mesuré de l’affichage de sortie. Combiné à --target-peak pour calculer le point noir utilisé dans sa compensation durant le tone mapping HDR
                                      # La valeur par défaut auto suppose un contraste de 1000:1, typique d’un écran SDR ; en passthrough HDR, le contraste est considéré comme infini. inf désigne un écran au noir parfait, tel qu’un OLED
#target-peak=auto                     # <auto|nits> Définit la luminance de crête mesurée de l’écran de sortie. Dépend de --target-trc. Avec auto, une valeur adaptée au paramètre trc est utilisée ; la valeur SDR par défaut est 203. En HDR, il est conseillé d’indiquer une valeur concrète en nits selon le rendu observé
                                      # Avec la gestion des couleurs ICC, une valeur en nits supérieure à la valeur par défaut (203) fait considérer l’écran comme HDR par mpv
                                      #! Attention : si le mode HDR du système est activé, cette option doit valoir 203 pour le contenu SDR, sinon l’image sera fortement assombrie. Pour le contenu HDR, employer auto ou la luminance de crête
#sdr-adjust-gamma=yes                 # <par défaut auto|yes|no> [Actif avec --vo=gpu-next]. Détermine s’il faut ajuster le gamma du contenu SDR. Ne s’applique qu’aux cibles de sortie sRGB, cas le plus courant et le plus ambigu
                                      ## no : le contenu signalé avec une fonction de transfert sRGB, gamma2.2 ou bt.1886 est rendu tel quel ; yes : conversion selon les métadonnées disponibles ; auto : se comporte comme no, sauf si --target-trc est explicitement défini, auquel cas il se comporte comme yes
                                      ## Si vous êtes certain que les métadonnées de la source et de la cible sont correctes, il est généralement conseillé d’activer cette option pour un rendu plus fidèle
                                      ## De plus, bt.1886 exige de connaître le contraste de l’écran pour être rendu correctement
#treat-srgb-as-power22=no             # <no|input|output|both|par défaut auto> [Actif avec --vo=gpu-next]. Une fois activé, emploie une courbe gamma2.2 à la place de la fonction de transfert sRGB standard
                                      ## no : aucun traitement spécial ; input : traite sRGB comme gamma 2.2 avant la conversion de l’entrée vers l’espace colorimétrique cible ; output : traite sRGB comme gamma 2.2 après la conversion vers l’espace colorimétrique de sortie ;
                                      ## both : applique les modes input et output ; auto : similaire à both, avec d’éventuels ajustements propres à la plateforme pour stabiliser le rendu, car l’EOTF sRGB du compositeur système peut varier selon la plateforme
##⇘⇘ Paramètres relatifs aux 3dlut
#lut=<file>                           # [Actif avec --vo=gpu-next] Applique aux couleurs une LUT personnalisée (format Adobe .cube) au cours de la conversion. La méthode exacte dépend de --lut-type
#lut-type=conversion                  # [Actif lorsque --lut=<file> est activé] <par défaut auto|native|normalized|conversion> Contrôle le traitement des valeurs colorimétriques à l’entrée et à la sortie de la LUT indiquée par --lut
                                      # auto : sélection automatique de la LUT à partir des métadonnées signalées, sinon repli sur le système (par défaut) ; native : application au contenu original de l’image (lumière non linéaire) dans son espace RVB natif avant conversion vers l’espace de sortie
                                      # normalized : application au contenu RVB normalisé en lumière linéaire avant conversion vers l’espace colorimétrique de sortie
                                      # conversion : remplace entièrement la conversion de l’espace colorimétrique de l’image vers celui de sortie. Une telle LUT a la priorité absolue et remplace tout profil ICC ainsi que les options liées au tone mapping et à la chromaticité de sortie (--target-prim, --target-trc, etc.)
#target-lut=<file>                    # [Actif avec --vo=gpu-next] Indique un fichier LUT personnalisé (format Adobe .cube) à appliquer aux couleurs avant leur affichage à l’écran
                                      # Après encodage dans l’espace colorimétrique cible, cette LUT reçoit des valeurs RVB normalisées ; elle est donc traitée après --target-trc
#image-lut=<file>                     # [Actif avec --vo=gpu-next] Indique un fichier LUT personnalisé (format Adobe .cube) à appliquer aux couleurs pendant le décodage de l’image. La méthode exacte dépend de --image-lut-type
#image-lut-type=conversion            # [Actif lorsque --image-lut=<file> est activé] <par défaut auto|native|normalized|conversion> Contrôle le traitement des valeurs colorimétriques à l’entrée et à la sortie de la LUT indiquée par --image-lut
                                      # auto : sélection automatique de la LUT à partir des métadonnées signalées, sinon repli sur le système (par défaut) ; native : application au contenu original dans son espace colorimétrique natif avant décodage en RVB. Pour une image HDR10, par exemple, l’entrée correspond à des valeurs YCbCr codées en PQ dans la plage 0.0-1.0
                                      # normalized : application au contenu RVB normalisé après décodage depuis son encodage colorimétrique natif, mais avant linéarisation
                                      # conversion : remplace entièrement le décodage des couleurs. Ce type de LUT doit accepter l’espace colorimétrique natif de l’image et produire un RVB non linéaire normalisé
##⇘⇘ Paramètres relatifs au HDR
#inverse-tone-mapping=yes             # <yes|par défaut no> [Actif avec --vo=gpu-next] Autorise le tone mapping inverse (extension du SDR vers le HDR), uniquement sur un appareil HDR. Les courbes de tone mapping partiel ne sont pas prises en charge ; à utiliser avec prudence
#target-colorspace-hint=no            # <par défaut auto|yes|no> [Actif avec --vo=gpu-next] Configure si possible l’espace colorimétrique de sortie de l’écran pour transmettre les valeurs d’entrée du flux multimédia (utile pour le passthrough HDR ou pour définir l’espace de sortie d’un contenu SDR). Nécessite la prise en charge du pilote
                                      ## auto : définit l’espace cible uniquement lorsque les paramètres d’affichage actuels sont connus. Wayland, D3D11 et winvk prennent actuellement cette fonction en charge ; yes : définit toujours l’espace cible ; no : n’utilise pas la transmission de l’espace cible
                                      ## Sous Windows, le mode HDR de l’écran doit être activé manuellement (limitation de Windows) pour permettre le passthrough HDR
#target-colorspace-hint-mode=target   # <par défaut target|source|source-dynamic> [Actif avec --vo=gpu-next] Définit la manière de traiter la transmission de l’espace colorimétrique cible
                                      ## target : emploie des métadonnées fondées sur les capacités réelles de l’écran cible et tente de revenir à source si elles sont absentes. C’est le mode le plus fiable
                                      ## source : emploie les métadonnées du contenu source. C’est le mode de passthrough HDR historique, qui suppose que le compositeur et l’écran traiteront directement l’espace colorimétrique et effectueront tout mappage nécessaire. Déconseillé
                                      ## source-dynamic : identique à 'source', mais emploie des métadonnées dynamiques scène par scène au lieu de métadonnées HDR10 statiques. Ce mode expérimental dépend de la capacité de l’écran à réagir aux changements de métadonnées. Il n’envoie pas les métadonnées HDR10+ ou Dolby Vision complètes, mais les utilise pour générer des métadonnées HDR10 dynamiques scène par scène
#target-colorspace-hint-strict=no     # <no|par défaut yes> [Actif avec --vo=gpu-next] Lorsqu’il est activé (par défaut), respecte le gamut configuré de la chaîne d’échange (hint inclus). Dans ce mode, les options `--target-*` servent uniquement d’indications et le format négocié de la chaîne d’échange est utilisé pour le rendu de sortie. Lorsqu’il est désactivé, le gamut de la chaîne d’échange est remplacé pour correspondre aux options `--target-*`
#tone-mapping=hable                   # Algorithme de tone mapping. Autres choix conseillés : clip|mobius|reinhard|hable|bt.2390|gamma|spline|bt.2446a|st2094-10|st2094-40. La valeur par défaut auto choisit la meilleure courbe selon une heuristique interne (en pratique spline avec --vo=gpu-next)
                                      # Les algorithmes spline, bt.2446a, st2094-10 et st2094-40 ne sont disponibles qu’avec --vo=gpu-next
                                      ## Avec vo=gpu, il est conseillé d’essayer hable ou bt.2390. hable préserve mieux les détails, tandis que bt.2390 offre un meilleur contraste
                                      ## Avec vo=gpu-next, il est actuellement conseillé d’essayer spline, hable et bt.2446a. Associé à --hdr-compute-peak, spline offre actuellement le meilleur tone mapping interne de mpv
#tone-mapping-param=0.3               # Paramètre secondaire de l’algorithme de tone mapping. hable et bt.2446a n’en ont pas ; bt.2390 n’en a pas avec --vo=gpu et vaut 1.0 par défaut avec -vo=gpu-next ; valeur par défaut de st2094-10 : 0.7, de mobius et spline : 0.5, de reinhard : 0.5, de gamma : 1.8 (0.3 par défaut avec --vo=gpu-next)
                                      # Valeur conseillée pour bt.2390 avec -vo=gpu-next : 2.0, ou 0.5 conformément à la recommandation ITU-R
#tone-mapping-max-boost=1.0           # <1.0-10.0> Multiplicateur d’exposition maximal de la luminance moyenne, par défaut : 1.0. L’augmenter révèle les détails cachés dans les zones sombres, mais une valeur excessive les rend artificiellement lumineuses. Essayez 1.0 et 1.33. Disponible uniquement avec --vo=gpu
#gamut-mapping-mode=clip              # <par défaut auto|clip|perceptual|relative|saturation|absolute|linear|warn|desaturate|darken> Définit le traitement du gamut cible après tout tone mapping. auto choisit automatiquement le meilleur mode (en pratique perceptual)
                                      # clip : écrêtage dur de chaque canal RVB dans le gamut cible, recommandé en priorité ; perceptual : mappage perceptif équilibré du gamut à coude doux, avec atténuation des zones écrêtées et conversion de teinte, tout en préservant la saturation
                                      # relative : écrêtage colorimétrique relatif en conservant la relation exponentielle entre luminance et chromaticité ; saturation : mappage simple de saturation RVB->RVB. N’écrête jamais, mais déforme toutes les teintes et/ou produit un aspect délavé
                                      # absolute : écrêtage colorimétrique absolu, semblable à 'relative' mais sans adaptation du point blanc ; linear : réduit linéairement et uniformément la saturation pour ramener toute l’image dans le gamut cible
                                      # warn : met simplement en évidence les pixels hors gamut ; desaturate : écrêtage colorimétrique à luminance constante qui réduit la saturation vers le blanc jusqu’au retour dans la plage ; darken : assombrit légèrement et uniformément l’entrée pour éviter l’écrêtage des hautes lumières surexposées, puis la contraint colorimétriquement à la limite du gamut d’entrée, avec un léger biais destiné à préserver la chromaticité de la luminance
#hdr-reference-white=100              # <auto|10-1000000> [Actif avec --vo=gpu-next] Définit la luminance du blanc diffus de référence HDR du contenu SDR, en cd/m² (nits). Il s’agit essentiellement de la luminance SDR dans un conteneur HDR. Valeur par défaut : 203 cd/m²
                                      ## Lorsque la fonction de transfert cible de sortie est SDR, cette option remplace la valeur de --target-peak si celle-ci est définie. Les sorties SDR et HDR peuvent ainsi être réglées séparément
#hdr-contrast-recovery=0.30           # <0.0-2.0> Active l’algorithme de récupération du contraste HDR, conçu pour renforcer le contraste des vidéos HDR après tone mapping. Uniquement avec --vo=gpu-next
                                      # L’intensité (valeur par défaut : 0.0) indique le degré de récupération du contraste : 0.0 désactive entièrement la fonction, 1.0 correspond à 100 %. Les valeurs supérieures à 1.0 sont permises, mais peuvent produire une accentuation excessive
                                      ## Dans le profil intégré gpu-hq de mpv, la valeur par défaut de ce paramètre est 0.30
#hdr-contrast-smoothness=3.5          # <1.0-100.0> Active l’algorithme de lissage du contraste HDR, conçu pour améliorer la douceur des vidéos HDR après tone mapping. Uniquement avec --vo=gpu-next
                                      # Le lissage (valeur par défaut : 3.5) indique le degré de filtrage passe-bas appliqué à la source HDR pour obtenir les informations de contraste ; 2.0 correspond à une réduction d’un facteur 2. Les écrans à faible DPI (<= 100) peuvent nécessiter une valeur inférieure, tandis que les écrans à très haut DPI (« Retina ») peuvent nécessiter une valeur supérieure
#hdr-compute-peak=yes                 # <par défaut auto|yes|no> Fournit essentiellement un tone mapping dynamique fondé sur la scène (paramètre non pris en charge par les anciennes cartes graphiques, où l’image peut devenir délavée) et peut faire varier ou scintiller la luminosité lors des changements de scène
                                      # Avec --hdr-compute-peak, certaines courbes de tone mapping (bt.2390, reinhard) perdent facilement des détails dans les hautes lumières ou les surexposent ; d’autres (spline, bt.2446a, hable) peuvent au contraire les améliorer nettement
#hdr-peak-decay-rate=20               # [Actif lorsque --hdr-compute-peak=yes] Taux de décroissance de l’algorithme de détection des pics HDR (<0.0-1000.0>, valeur par défaut : 20.0)
#hdr-scene-threshold-low=1.0          # [Actif lorsque --hdr-compute-peak=yes] Seuil inférieur de différence de luminance (dB) considéré comme un changement de scène (<0.0-100.0>, valeur par défaut : 1.0)
#hdr-scene-threshold-high=3.0         # [Actif lorsque --hdr-compute-peak=yes] Seuil supérieur de différence de luminance (dB) considéré comme un changement de scène (<0.0-100.0>, valeur par défaut : 3.0)
#hdr-peak-percentile=100              # Actif avec [--hdr-compute-peak=yes] et [-vo=gpu-next]. (<0.0-100.0>, valeur par défaut : 100.0) Définit le percentile de l’histogramme de luminance de l’image d’entrée à considérer comme le véritable pic
                                      # À 100 (valeur par défaut), le pixel le plus lumineux est mesuré. Sinon, le haut de la distribution de fréquence est progressivement retranché. Une valeur trop faible écrête les détails très lumineux, mais peut accroître la plage dynamique des scènes comportant des hautes lumières isolées très intenses. Toute valeur autre que 100 entraîne une légère perte de performances
                                      ## Si la luminosité de l’image fluctue constamment, réduisez ce paramètre pour ignorer une partie des pics ; une valeur inférieure à 99.7 est déconseillée
                                      ## Dans le profil intégré gpu-hq de mpv, la valeur par défaut de ce paramètre est 99.995
#allow-delayed-peak-detect=no         # Actif avec [--hdr-compute-peak=yes] et [-vo=gpu-next], valeur par défaut : no. Avec --hdr-compute-peak, permet de retarder d’une image le pic détecté lorsque cela améliore les performances
                                      # Cela évite notamment un traitement FBO inutile lorsque le rendu avancé n’est pas requis. Notez que -vo=gpu retarde par défaut le traitement des pics

##⇘⇘ Paramètres de réglage du rendu de l’image
#video-sync=display-resample          # Effet de type "ReClock" : synchronise les images vidéo avec la fréquence de rafraîchissement de l’écran et ajuste automatiquement la vitesse audio pour compenser le décalage. # Désactivation recommandée avec l’interpolation SVP
                                      # La valeur par défaut audio (synchronisation sur l’audio/l’horloge système) offre généralement la meilleure compatibilité, au prix de rares images perdues ou répétées
#video-sync-max-video-change=5        # [Actif uniquement avec --video-sync=display-xxxx] Valeur par défaut : 1
#interpolation                        # [Actif uniquement avec --video-sync=display-xxxx] Réduit les saccades dues à la différence entre les fps de la vidéo et la fréquence de rafraîchissement de l’écran. # Désactivation recommandée avec l’interpolation SVP
                                      # Algorithme utilisé par interpolation. Voir https://mpv.io/manual/master/#options-tscale
                                      # Quelques discussions : https://github.com/mpv-player/mpv/issues/2685
#interpolation-preserve=no            # [Actif avec --vo=gpu-next] Valeur par défaut : yes. Conserve le résultat d’interpolation de l’image précédente même si les paramètres du moteur de rendu changent. Les options de recadrage et de placement vidéo font exception et invalident toujours le cache
                                      # Cette option fluidifie les mises à jour dynamiques des réglages du moteur de rendu, au prix d’une latence légèrement accrue lors de ces changements
#tscale=oversample                    # [Actif uniquement lorsque --interpolation est activé] Choisit l’algorithme d’interpolation temporelle (sans compensation de mouvement MEMC). # Désactivation recommandée avec l’interpolation SVP
                                      # L’algorithme d’interpolation par défaut est oversample. Dans l’ensemble, mitchell est plus fluide (sans égaler l’interpolation SVP), mais produit du flou. oversample ne produit pas de flou, mais est moins fluide (il restitue approximativement l’aspect des 24 images/s, comme smoothmotion de MADVR) ; triangle se situe entre les deux, et catmull_rom est relativement net
                                      # Choisissez selon vos besoins
#tscale-radius=1.0                    # Définit le rayon du filtre réglable ; nombre flottant compris entre 0.5 et 16.0. S’il n’est pas indiqué, le rayon préféré du filtre est utilisé. Ne s’applique pas à toutes les combinaisons de redimensionneur et de VO
#tscale-clamp=0.0                     # <0.0-1.0> Définit le biais de poids appliqué aux coefficients négatifs. --scale-clamp=1 supprime complètement les poids négatifs et limite effectivement la plage des valeurs à [0-1]. Une valeur entre 0.0 et 1.0 permet de ne réduire que modérément les poids négatifs
                                      # Pour tscale, la valeur par défaut est 1.0, ce qui réduit efficacement les artefacts de ringing qu’il produit. La valeur par défaut des autres algorithmes scale est 0.0
#tscale-antiring=1.0                  # Définit l’intensité de l’anti-ringing. Cette fonction tente d’éliminer le ringing, mais introduit d’autres artefacts. Nombre flottant compris entre 0.0 et 1.0. La valeur par défaut 0.0 désactive entièrement l’anti-ringing
                                      # Notez que cela n’affecte pas les filtres spéciaux bilinear et bicubic_fast
#dither-depth=auto                    # <N|no|par défaut auto> Active ou non le tramage de profondeur pour compenser les pertes de conversion des couleurs. Indiquez 8 pour un écran 8 bits et 10 pour un écran 10 bits. La valeur auto dépend de --gpu-api et n’est pas nécessairement correcte
                                      # Si un écran 8 bits + FRC vers 10 bits présente une sortie anormale avec la valeur 10, revenez à 8
#dither=fruit                         # <par défaut fruit|ordered|error-diffusion|no> [Actif lorsque --dither-depth est activé] Choisit l’algorithme de tramage de profondeur
                                      # error-diffusion offre le meilleur résultat, mais consomme le plus de ressources ; si les performances sont insuffisantes, repli automatique sur fruit
#dither-size-fruit=6                  # [Actif avec --dither=fruit] <2-8> Définit la taille de la matrice de tramage de profondeur (valeur par défaut : 6). Sa taille réelle est (2^N)x(2^N), l’option représentant N ; 6 correspond donc à 64x64
#error-diffusion=sierra-lite          # <simple|par défaut sierra-lite|floyd-steinberg|atkinson> [Actif avec --dither=error-diffusion] Noyau algorithmique employé par error-diffusion
#temporal-dither                      # [Actif lorsque --dither-depth est activé] Active le tramage temporel de profondeur (mélange du tramage de profondeur entre les images)
                                      # Il alterne entre huit motifs de tramage par image en changeant l’orientation de la matrice en mosaïque, ce qui peut provoquer un scintillement sur les écrans LCD
#temporal-dither-period=1             # <1-128> [Actif lorsque --temporal-dither est activé] Définit la fréquence de mise à jour du motif de tramage. 1 (valeur par défaut) le met à jour à chaque image vidéo

#scale=ewa_hanning                    # Algorithme d’agrandissement. L’algorithme par défaut est lanczos ; ewa_lanczos, ewa_lanczossharp et ewa_hanning sont recommandés, c’est-à-dire jinc et ses variantes
                                      # ewa_hanning réduit le ringing par rapport aux autres algorithmes jinc
                                      # Parmi les algorithmes scale intégrés, spline36 convient mieux aux prises de vues réelles, tandis que les algorithmes ewa conviennent mieux aux images d’anime
#scale-radius=3.2383154841662362      # Définit le rayon du filtre réglable ; nombre flottant compris entre 0.5 et 16.0. S’il n’est pas indiqué, le rayon préféré du filtre est utilisé. Ne s’applique pas à toutes les combinaisons de redimensionneur et de VO
#scale-antiring=1.0                   # Définit l’intensité de l’anti-ringing. Cette fonction tente d’éliminer le ringing, mais introduit d’autres artefacts. Nombre flottant compris entre 0.0 et 1.0. La valeur par défaut 0.0 désactive entièrement l’anti-ringing
                                      # Notez que cela n’affecte pas les filtres spéciaux bilinear et bicubic_fast
                                      ## Cette option est généralement inutile avec un shader d’agrandissement externe
#cscale=bilinear                      # Algorithme de reconstruction de chrominance ; si omis, --scale est repris automatiquement (déconseillé). bilinear est recommandé : les différences entre les algorithmes de suréchantillonnage chromatique sont peu perceptibles et ne justifient généralement pas une forte dépense de performances
                                      # Les essais pratiques montrent que bilinear convient mieux aux sources de faible qualité, tandis que catmull_rom convient mieux aux bonnes sources
                                      # Bien que "KrigBilateral.glsl" donne le meilleur résultat, il peut entraîner une consommation excessive avec certaines sources (VFR) et combinaisons particulières de shaders
#cscale-radius=3                      # Définit le rayon du filtre réglable ; nombre flottant compris entre 0.5 et 16.0. S’il n’est pas indiqué, le rayon préféré du filtre est utilisé. Ne s’applique pas à toutes les combinaisons de redimensionneur et de VO
#cscale-antiring=1.0                  # Définit l’intensité de l’anti-ringing. Cette fonction tente d’éliminer le ringing, mais introduit d’autres artefacts. Nombre flottant compris entre 0.0 et 1.0. La valeur par défaut 0.0 désactive entièrement l’anti-ringing
                                      # Notez que cela n’affecte pas les filtres spéciaux bilinear et bicubic_fast
                                      ## Cette option est généralement inutile avec un shader cscale externe
#dscale=catmull_rom                   # Algorithme de réduction. L’algorithme par défaut est hermite
                                      # Si vous utilisez uniquement les algorithmes dscale intégrés, bicubic (notamment sa variante catmull_rom) ou ewa_hanning sont recommandés. Vous pouvez aussi essayer robidouxsharp, ewa_robidouxsharp et les autres algorithmes
#dscale-radius=1                      # Définit le rayon du filtre réglable ; nombre flottant compris entre 0.5 et 16.0. S’il n’est pas indiqué, le rayon préféré du filtre est utilisé. Ne s’applique pas à toutes les combinaisons de redimensionneur et de VO
#dscale-antiring=1.0                   # Définit l’intensité de l’anti-ringing. Cette fonction tente d’éliminer le ringing, mais introduit d’autres artefacts. Nombre flottant compris entre 0.0 et 1.0. La valeur par défaut 0.0 désactive entièrement l’anti-ringing
                                      # Notez que cela n’affecte pas les filtres spéciaux bilinear et bicubic_fast
                                      ## Cette option est généralement inutile avec un shader dscale externe
#linear-upscaling=no                  # [Nécessite une précision d’au moins 16 bits définie par --fbo-format ; incompatible avec --sigmoid-upscaling] (sans effet sur le contenu HDR)
#sigmoid-upscaling=no                 # [Incompatible avec --linear-upscaling] Conversion non linéaire des couleurs lors de l’agrandissement, qui évite les forts artefacts de ringing. Activée par défaut
                                      ## Les développeurs conseillent soit de privilégier --sigmoid-upscaling, soit de n’utiliser aucune de ces deux options (donc de redimensionner en lumière gamma)
                                      ## Cette option est généralement inutile avec un shader d’agrandissement externe
#correct-downscaling=yes              # [Sans effet avec --dscale=bilinear] Améliore la qualité de l’algorithme de réduction (anticrénelage), mais peut produire une légère déformation sur les vidéos au format inhabituel. Activé par défaut
                                      ## Peut être remplacé par le meilleur shader "SSimDownscaler.glsl"
#linear-downscaling=no                # [Doit être désactivé avec "SSimDownscaler.glsl" ; --fbo-format doit spécifier une précision d'au moins 16 bits] (sans effet sur le contenu HDR). Activé par défaut
                                      ## Les deux paramètres --linear- ci-dessus correspondent à « scale in linear light » dans MADVR ; lors d'une réduction, le traitement linéaire améliore la précision du contraste des couleurs et atténue les artefacts de ringing produits par certains algorithmes
#scaler-resizes-only=no               # Valeur par défaut : yes. En l'absence de redimensionnement, l'algorithme bilinear restitue parfaitement l'image ; si désactivé, la valeur de scale indiquée est appliquée même sans changement de taille, ce qui peut corriger le décalage d'un demi-pixel introduit par nnedi3 et ravu (mais ce n'est pas nécessaire)
#deband=no                            # Supprime les bandes de couleur ; inutile de le laisser activé en permanence, il peut être activé manuellement selon la source
#deband-iterations=1                  # <0-16> Nombre de passes de debanding ; une valeur élevée augmente l'intensité, mais aussi le coût en temps et en ressources. Les valeurs >4 n'ont en pratique aucun effet (1 par défaut) ; 3-4 équivaut au réglage high de deband dans madvr
#deband-threshold=48                  # <0-4096> Seuil de coupure du filtre ; une valeur élevée augmente l'intensité, mais réduit progressivement les détails de l'image (48 par défaut)
#deband-range=16                      # <1-64> Rayon initial ; une valeur élevée renforce le debanding et consomme davantage de ressources, tandis qu'une valeur faible produit un résultat plus lisse (16 par défaut). Si --deband-iterations est augmenté, réduire cette valeur pour compenser
#deband-grain=32                      # <0-4096> Ajoute un bruit dynamique qui aide à masquer les artefacts de quantification restants (32 par défaut)

########
# Audio #
########

audio-device=auto                     # Indique le périphérique de sortie audio utilisé au démarrage
                                      # Exemple de valeur explicite : --audio-device="wasapi/{xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx}" ; consulter le manuel officiel pour savoir comment obtenir le nom du périphérique
audio-channels=7.1,5.1,stereo         # <valeur par défaut : auto-safe|auto|layouts|stereo> Si certains canaux sont absents lors de la lecture d'un film multicanal sur un système stéréo, essayer de forcer la sortie stéréo
                                      # Attention : cette option doit correspondre aux canaux réellement pris en charge par le périphérique de sortie audio, ou en donner l'ordre de priorité. Les modes auto-safe et auto par défaut de mpv peuvent perdre des canaux lors du downmix multicanal ; ils sont déconseillés
                                      # L'exemple 7.1,5.1,stereo définit un ordre de priorité courant et se rabat automatiquement sur une valeur compatible avec le périphérique de sortie réel (la plupart des appareils sont stéréo)
                                      # Si, après le downmix d'une piste multicanal en stéréo, le fond sonore paraît trop fort et les dialogues trop faibles, consulter : https://github.com/mpv-player/mpv/issues/6563
ao=alsa                               # --ao=<driver1,driver2,...[,]> Liste prioritaire des pilotes de sortie audio à utiliser ; si la liste se termine par ',', mpv se rabat sur les pilotes qui n'y figurent pas
                                      ## Sous windows, wasapi est recommandé ; sous linux, alsa est recommandé avec --audio-channels=auto ; sous macos, coreaudio ou coreaudio_exclusive est recommandé
                                      ## D'après les tests, si un autre logiciel prend le contrôle exclusif du canal audio avant l'ouverture de MPV, l'image devient extrêmement saccadée
#audio-exclusive=yes                  # Accès exclusif au canal audio. En cas de saccades audio, désactiver cette option ou la précédente
#volume=100                           # Volume au démarrage du lecteur. 0 coupe le son ; valeur par défaut : 100
#volume-max=130                       # <100.0-1000.0> Volume maximal. Valeur par défaut : 130 (le volume perçu à 130 est environ deux fois celui à 100 : 1.3^3≈2)
#audio-pitch-correction=no            # [Prérequis pour --af=scaletempo/scaletempo2/rubberband] Correction de la hauteur pendant la lecture à vitesse modifiée ; yes par défaut. Insère automatiquement l'un des trois premiers filtres audio (voir la section des filtres pour plus d'informations)
#audio-delay=0.04                     # Si nécessaire, définit un décalage audio
#audio-samplerate=96000               # Force le rééchantillonnage en 96 kHz, 24 bits (le matériel audio doit le prendre en charge). Attention : ce n'est pas indispensable
#audio-format=s32
#audio-normalize-downmix=yes          # Active/désactive la normalisation lors du downmix d'un son surround en stéréo (par défaut : no). Si cette fonction est désactivée, le downmix peut provoquer de l'écrêtage ; si elle est activée, le niveau de sortie peut être trop faible. Cela dépend de la source audio
#replaygain=track                     # <par défaut no|track|album> Ajuste le gain du volume selon la valeur ReplayGain enregistrée dans les métadonnées du fichier
                                      # no : aucun ajustement ; track : applique le gain de piste ; album : applique le gain d'album s'il existe, sinon se rabat sur le gain de piste
#ad-lavc-downmix=yes                  # <yes|no par défaut> Demande ou non au décodeur de réduire les canaux audio. Certains décodeurs (par exemple AC-3, AAC et DTS) peuvent remixer l'audio pendant le décodage
gapless-audio=no                      # <no|yes|weak par défaut> Tente d'enchaîner des fichiers audio sans silence ni interruption lors d'un changement de fichier. Valeur par défaut weak : réinitialise la sortie audio lorsque le format audio change
                                      # La valeur yes oblige les fichiers à conserver la même fréquence d'échantillonnage, ce qui réduit la qualité audio
#audio-file-auto-exts=aac,ac3,dts,eac3,flac,m4a,mka,mp3,ogg,opus,thd,wav,wv
                                      # Extensions des fichiers audio à rechercher avec l'option "audio-file-auto". L'exemple correspond à la valeur par défaut
audio-file-auto=all                   # <par défaut no|exact|fuzzy|all> Définit le mode de chargement automatique des pistes audio externes
                                      ## no : désactivé ; exact : charge automatiquement les pistes externes dont l'extension respecte la syntaxe des balises de langue BCP 47 ; fuzzy : charge celles dont le nom contient celui du fichier vidéo ; all : charge toutes les pistes audio détectées
audio-file-paths=audio:audios
                                      # <path1:path2:...> Recherche les pistes audio correspondantes dans les répertoires supplémentaires indiqués ; les chemins relatifs et absolus sont pris en charge
                                      ## Sous windows, remplacer ":" par ";"
alang=japanese,jpn,jap,ja,jp,english,eng,en
                                      # Définit les langues audio préférées, mais MPV donne la priorité aux pistes externes
#aid=1                                # Il n'est actuellement pas possible de sélectionner une piste selon d'autres metadata ; comme mpv préfère par défaut les pistes externes, il choisit souvent une piste indésirable
                                      ## Il est recommandé d'utiliser le script trackselect.lua pour sélectionner automatiquement une piste selon ses metadata : https://github.com/po5/trackselect

########
# Sous-titres #
########

sub-font-provider=fontconfig                  # <auto par défaut|none|fontconfig> API de rendu des polices ; sous Linux, fontconfig est utilisé
                                              # auto sélectionne automatiquement l'interface système de rendu des polices : DirectWrite sous Windows, fontconfig sous Linux et CoreText sous macOS
                                              # none ignore la police indiquée par les sous-titres et utilise le paramètre sub-font, sans modifier leur style (sans effet sur les sous-titres intégrés)
                                              # fontconfig utilise les entrées de chargement de polices du fichier fonts.conf dans le répertoire de mpv.conf ; le chemin fonts peut être personnalisé avec <dir>CUSTOMFONTDIR</dir>
                                              # Sous Windows, lors de la première utilisation de fontconfig, toutes les polices du répertoire sont chargées en mémoire ; les chargements suivants se font à la demande. Le chargement et le changement de police sont extrêmement lents, donc cette option est déconseillée
#sub-ass-override=no                          # <yes|no|scale par défaut|force|strip> Définit le mode de rendu des sous-titres et contrôle l'application des remplacements de style
                                              ## no : désactivé ; yes : applique toutes les options de remplacement de style --sub-ass-* ; force : force toutes les options --sub-* ; scale : comme yes, mais applique aussi --sub-scale ; strip : supprime toutes les balises et tous les styles ASS, et affecte également les formats tels que pgs et srt

#sub-scale-by-window=no                       # Met ou non les sous-titres à l'échelle selon la taille de la fenêtre (par défaut : yes). Affecte le texte brut et le format ASS
#sub-scale-with-window=no                     # Dimensionne la police des sous-titres par rapport à la fenêtre plutôt qu'à la vidéo (par défaut : yes). Affecte uniquement les sous-titres en texte brut
#sub-ass-scale-with-window=yes                # Semblable à --sub-scale-with-window, mais uniquement pour le format ASS (par défaut : no). Cette option peut parfois désaligner les styles ass
#embeddedfonts=no                             # Utilise les polices intégrées aux conteneurs Matroska et aux scripts ASS (par défaut : yes)
sub-codepage=gb18030                          # Page de codes utilisée pour décoder les sous-titres texte ; auto par défaut : détecte automatiquement l'encodage, essaie d'abord UTF-8, puis lance uchardet pour le deviner en cas d'échec (mpv doit avoir été compilé avec uchardet)
                                              ## Dans cet exemple, si l'encodage détecté n'est pas UTF-8, GB18030 est essayé en premier (adapté aux utilisateurs de sous-titres chinois)
                                              ## Attention : cela ne s'applique qu'aux fichiers de sous-titres texte. Les autres types de sous-titres, en particulier ceux des fichiers mkv, sont toujours supposés être en UTF-8
#sub-auto-exts=ass,idx,lrc,mks,pgs,rt,sbv,scc,smi,srt,ssa,sub,sup,utf,utf-8,utf8,vtt
                                              # Extensions de sous-titres à rechercher avec l'option "sub-auto". L'exemple correspond à la valeur par défaut
sub-auto=all                                  # <no|exact par défaut|fuzzy|all> Définit le mode de chargement automatique des sous-titres externes
                                              ## no : désactivé ; exact : charge automatiquement les sous-titres externes dont l'extension respecte la syntaxe des balises de langue BCP 47 ; fuzzy : charge ceux dont le nom contient celui du fichier vidéo ; all : charge tous les sous-titres détectés
sub-file-paths=sub:subs:subtitles
                                              # <path1:path2:...> Recherche les sous-titres correspondants dans les répertoires supplémentaires indiqués. Les chemins relatifs et absolus sont pris en charge ; l'exemple recherche automatiquement les dossiers "sub", "subs" et "subtitles" sous le chemin du fichier courant
                                              ## Sous windows, remplacer ":" par ";"
slang=fr,fra,french,en,eng,english
                                              ## Définit les langues de sous-titres préférées, mais MPV donne la priorité aux pistes externes
#sid=1                                        ## Il n'est actuellement pas possible de sélectionner une piste selon d'autres metadata ; comme mpv préfère par défaut les pistes externes, il choisit souvent des sous-titres indésirables
                                              ## Il est recommandé d'utiliser le script sub-select.lua pour sélectionner automatiquement des sous-titres selon leurs metadata : https://github.com/CogentRedTester/mpv-sub-select
#subs-fallback=default                        # <yes|default par défaut|no> Si aucune piste de sous-titres ne satisfait --slang, se rabat sur une autre ; la valeur default sélectionne uniquement les pistes marquées « par défaut »
#subs-fallback-forced=no                      # <yes par défaut|always|no> Lors de la sélection automatique, si aucune piste ne correspond à la langue préférée, sélectionne une piste forcée correspondant à la langue de la piste audio choisie
#subs-with-matching-audio=yes                 # <yes par défaut|forced|no> Lors de la sélection automatique, choisit une piste de sous-titres complète/non forcée même si la piste audio sélectionnée correspond à la langue de sous-titres préférée
#subs-match-os-language=yes                   # <yes par défaut|no> Lors de la sélection automatique, choisit une piste correspondant à la langue du système d'exploitation (si le flux audio utilise une autre langue). Attention : ce réglage est entièrement ignoré si "--slang" est défini

#blend-subtitles=yes                          # <yes|video|no par défaut> Fusionne les sous-titres dans l'image vidéo avant l'interpolation et la gestion des couleurs. video est semblable à yes, mais dessine les sous-titres à la résolution d'origine de la vidéo et les redimensionne avec elle
                                              # L'activation de cette fonction limite les sous-titres à la partie visible de la vidéo (ils ne peuvent pas apparaître dans la zone noire sous l'image)
                                              # Elle soumet également les sous-titres aux effets de --icc-profile, --target-prim, --target-trc, --interpolation, --gamma-factor, --glsl-shaders, etc.
                                              # Avec --interpolation, un algorithme tscale adapté peut améliorer les performances des sous-titres
                                              ## État des problèmes sous hdr : https://github.com/mpv-player/mpv/issues/6368 (le mappage statique n'est pas affecté)
#sub-ass-force-margins=yes                    # [Sans effet avec --blend-subtitles=yes/video] Valeur par défaut : no. Avec yes, les sous-titres ass sont affichés autant que possible dans les bandes noires
                                              ## Il est déconseillé de laisser yes en permanence, car cela peut casser le positionnement pos de certains sous-titres ass ; mieux vaut activer ou désactiver l'option manuellement avec un raccourci
#stretch-image-subs-to-screen=yes             # Force l'étirement des sous-titres graphiques jusqu'à la résolution mise à l'échelle plutôt qu'à la résolution vidéo de référence, ce qui permet aux PGS d'être affichés dans les bandes noires. Attention : cela peut détériorer le rendu
                                              ## Remarque : si le ratio de la vidéo diffère de celui des sous-titres PGS, cette option est indispensable pour un affichage correct (ce problème est courant avec les sous-titres pgs intégrés aux encodages de films chinois)
#sub-hdr-peak=sdr                             # <sdr par défaut|10-10000> Contrôle la luminosité des sous-titres texte et de l'OSD en sortie HDR ; la valeur spéciale sdr correspond au blanc de référence SDR (203 nit)
                                              ## Attention : cette option affecte aussi la luminosité des sous-titres texte SDR mappés en HDR avec --blend-subtitles=<yes|video>
image-subs-hdr-peak=sdr                       # <sdr|video|video-static|video-dynamic|10-10000> Contrôle la luminosité des sous-titres graphiques en sortie HDR ; valeur par défaut : 1000
                                              ## sdr : blanc de référence SDR (203 nit) ; video : utilise les métadonnées vidéo ; video-static : utilise les métadonnées statiques ; video-dynamic : utilise les métadonnées dynamiques

##⇘⇘Le rendu des sous-titres diffère de xy-subfilter ? Essayer d'activer les réglages ci-dessous
#sub-ass-vsfilter-color-compat=full           # <basic par défaut|full|force-601|no> Imite le comportement de (xy-)vsfilter lors de la conversion de l'espace colorimétrique des sous-titres
#sub-ass-use-video-data=none                  # <none|aspect-ratio|all par défaut> Contrôle les informations du flux vidéo transmises à libass. Toute valeur autre que 'all' est incompatible avec le standard ASS et VSFilter
                                              ## Pour certains fichiers ASS endommagés, essayer 'aspect-ratio' afin d'obtenir un rendu normal ; si un fichier ASS endommagé apparaît étiré sur une vidéo anamorphique, essayer 'none' pour le corriger. Ce paramètre n'affecte pas les vidéos non anamorphiques
#sub-ass-video-aspect-override=16:9           # <no par défaut|ratio> Permet de transmettre à libass un rapport d'aspect arbitraire au lieu du rapport réel de la vidéo. Un rapport nul ou négatif équivaut à 'no'
                                              ## Cette option est sans effet lorsque 'sub-ass-use-video-data' vaut none
#sub-vsfilter-bidi-compat=yes                 # <yes|no par défaut> Une fois activé, définit la détection bidirectionnelle implicite sur "ltr" plutôt que "auto" afin de reproduire le comportement par défaut d'ass. À activer uniquement si la détection bidirectionnelle des sous-titres est incorrecte
                                              ## Affecte uniquement les sous-titres en texte brut (non ASS)
#sub-ass-style-overrides-append=Encoding=-1   # Style forcé : active la détection automatique. Peut corriger les erreurs d'identification de l'encodage des caractères et du sens du texte, et améliorer le rendu de certaines balises ass
#sub-ass-style-overrides-append=ScaledBorderAndShadow=no
                                              # Style forcé : ne redimensionne pas les bordures ni les ombres. Évite le style dit « encre épaisse » : https://github.com/libass/libass/issues/287
                                              # Remarque : le problème est corrigé dans les versions git postérieures à libass 0.15.2

#sub-gauss=1.5                                # <0.0-3.0> Applique un flou gaussien aux sous-titres graphiques (0 par défaut). Cela améliore l'aspect des DVD/Vobsub pixellisés
#sub-gray=yes                                 # Convertit les sous-titres graphiques en niveaux de gris. Peut améliorer l'aspect des DVD/Vobsubs jaunes
#sub-fix-timing=yes                           # Ajuste le minutage afin de supprimer les petits intervalles ou chevauchements entre sous-titres (si l'écart est inférieur à la valeur définie). Dans certains cas, le résultat peut empirer ; essayer alors de désactiver cette option. Désactivée par défaut
#sub-fix-timing-threshold=210                 # Seuil de --sub-fix-timing en millisecondes (210 par défaut)
#sub-fix-timing-keep=400                      # Durée minimale, en millisecondes, d'un événement de sous-titres pour déclencher --sub-fix-timing (400 par défaut)
#sub-stretch-durations=yes                    # Prolonge la durée des sous-titres pour qu'ils se terminent au début du suivant. Cela peut aider les sous-titres ayant par erreur une durée nulle, mais aussi endommager des sous-titres normaux. Désactivé par défaut
#sub-fps                                      # Définit la fréquence d'images du fichier de sous-titres (par défaut : video fps). Affecte uniquement les sous-titres texte
#sub-speed=24/23.976                          # Multiplie les horodatages des événements de sous-titres par la valeur donnée. Permet de corriger la vitesse de lecture des formats de sous-titres fondés sur les images. Affecte uniquement les sous-titres texte
                                              # --sub-speed=24/23.976 lit des sous-titres fondés sur les images en supposant une fréquence de 23.976, à 24 images par seconde
#stretch-dvd-subs=yes                         # Étire les sous-titres DVD lors de la lecture d'une vidéo anamorphique ; désactivé par défaut
#sub-filter-regex-plain=yes                   # Convertit ou non d'abord le champ ASS "Text" en texte brut (par défaut : no). Les balises ASS sont retirées et les instructions ASS (comme \N) sont appliquées aux sauts de ligne. Si le résultat comporte plusieurs lignes, les ancres d'expression régulière ^ et $ correspondent à chaque ligne, mais toute correspondance supprime malgré tout toutes les lignes
#sub-filter-regex-warn=yes                    # Consigne les lignes supprimées au niveau d'avertissement plutôt qu'au niveau détaillé (par défaut : no). Utile pour les tests
#sub-filter-regex-enable=no                   # Active ou non le filtrage par expression régulière (par défaut : yes) ; reste sans effet si les deux paramètres suivants sont vides
#sub-filter-regex-append=opensubtitles\.org   # --sub-filter-regex-...=... définit la liste des expressions régulières à rechercher dans les sous-titres texte et supprime toute ligne correspondante (vide par défaut). La recherche ignore la casse, mais son fonctionnement dépend de libc et ne s'applique probablement qu'à l'ASCII. Ne s'applique pas aux sous-titres bitmap/graphiques
#sub-filter-jsre-append=                      # Identique à --sub-filter-regex, mais avec des expressions régulières JavaScript. Partage les options de contrôle --sub-filter-regex-* et requiert la prise en charge de JavaScript

##⇘⇘Réglages des sous-titres en l'absence de style intégré
#sub-fonts-dir=~~/fonts                       # Répertoire de recherche des polices utilisées pour les sous-titres texte ; l'exemple correspond à la valeur par défaut
sub-font="Noto Sans"                          # Police des sous-titres en texte brut. Ce paramètre ne devrait pas affecter les sous-titres ASS, mais il modifie en pratique leur police par défaut : https://github.com/mpv-player/mpv/issues/8637
sub-font-size=50                              # Taille de police des sous-titres texte
sub-bold=yes                                  # Affiche les sous-titres texte en gras
#sub-italic=yes                               # Affiche les sous-titres texte en italique
sub-color="#FFFFFF"                           # Couleur de police des sous-titres texte. <format : (AA)RRGGBB> AA est l'opacité hexadécimale et RRGGBB la représentation hexadécimale de la couleur
sub-outline-size=1                            # Taille du contour des sous-titres texte
sub-outline-color="#000000"                   # Couleur du contour des sous-titres texte
sub-shadow-offset=1                           # Taille de l'ombre des sous-titres texte
sub-back-color="#000000"                      # Couleur d'ombre/de fond des sous-titres texte
#sub-border-style=opaque-box                  # <outline-and-shadow par défaut|opaque-box|background-box> Style de bordure des sous-titres texte
                                              # outline-and-shadow : dessine un contour et une ombre ; opaque-box : dessine le contour et l'ombre sous forme de boîte opaque serrée autour de chaque ligne de texte ; background-box : dessine une boîte de fond autour de toutes les lignes de texte
#sub-spacing=1                                # Espacement des caractères des sous-titres texte
#sub-blur=0.5                                 # Flou des bords des sous-titres texte ; valeur recommandée entre 0.5 et 3.0 <0..20.0>
#sub-use-margins=no                           # Affiche ou non les sous-titres en texte brut dans les bandes noires ; yes par défaut
#sub-pos=100                                  # Position des sous-titres à l'écran. La valeur est la position verticale en pourcentage de la hauteur de l'écran. Valeur par défaut : 100 ; une valeur supérieure les déplace vers le bas. Affecte les sous-titres ass et en texte brut
#sub-margin-x=25                              # Marges gauche et droite, en pixels mis à l'échelle ; définit la distance du sous-titre par rapport aux bords gauche et droit
#sub-margin-y=22                              # Marges supérieure et inférieure, en pixels mis à l'échelle ; définit la marge verticale des sous-titres en texte brut. Pour ne modifier que leur position verticale, utiliser --sub-pos
#sub-align-x=center                           # <left|center par défaut|right> Contrôle l'alignement horizontal des sous-titres texte à l'écran. Ne s'applique jamais aux sous-titres ASS, sauf en mode --no-sub-ass, ni aux sous-titres graphiques PGS
#sub-align-y=bottom                           # <top|center|bottom par défaut> Contrôle la position verticale des sous-titres texte
#sub-justify=left                             # <auto par défaut|left|center|right> Contrôle l'alignement des sous-titres multilignes (par défaut : auto, selon --sub-align-y). L'alignement à gauche est recommandé
#sub-ass-justify=yes                          # Si --sub-ass-override n'est pas défini sur no, applique --sub-justify aux sous-titres ASS. Valeur par défaut : no


########
# Captures d'écran #
########

### Les paramètres prédéfinis ci-dessous servent uniquement à obtenir des images de qualité maximale
screenshot-format=webp                        # <jpg par défaut|(idem)jpeg|png|webp|jxl|avif>
#screenshot-png-compression=7                 # <0-9> Niveau de compression PNG ; un niveau trop élevé nuit aux performances. Valeur par défaut : 7
#screenshot-png-filter=5                      # Filtre appliqué avant la compression PNG. 0 : aucun, 1 : sub, 2 : up, 3 : average, 4 : Paeth, 5 : mixed. Il affecte le niveau de compression obtenu. Pour la plupart des images, mixed offre le meilleur taux de compression et constitue donc le réglage par défaut.
#screenshot-jpeg-quality=100                  # <0-100> Qualité JPEG maximale ; 90 par défaut
#screenshot-jpeg-source-chroma=no             # Écrit le JPEG avec le même sous-échantillonnage de chrominance que la vidéo source ; yes par défaut
#screenshot-webp-lossless=yes                 # WEBP sans perte ; no par défaut
screenshot-webp-quality=85                    # <0-100> [Actif lorsque --screenshot-webp-lossless=no] Qualité du WEBP avec perte ; 75 par défaut
screenshot-webp-compression=6                 # <0-6> Niveau de compression WEBP ; un niveau trop élevé nuit aux performances. Valeur par défaut : 4. Attention : avec un WEBP avec perte, cela affecte aussi la qualité de l'image
#screenshot-jxl-distance=0                    # <0-15> Distance du modèle visuel JXL ; 0 correspond à une qualité sans perte, 0.1 à une qualité visuellement sans perte et la valeur par défaut 1 à une qualité JPEG de 90
#screenshot-jxl-effort=5                      # <1-9> Niveau de compression JXL ; un niveau trop élevé nuit aux performances. Valeur par défaut : 4
screenshot-tag-colorspace=no                  # Marque les captures d'écran avec l'espace colorimétrique approprié (tous les formats ne le prennent pas en charge). Valeur par défaut : yes
#screenshot-high-bit-depth=no                 # Affecte surtout PNG et JPEG XL ; utilise si possible la même profondeur de couleur que la sortie vidéo. Valeur par défaut : yes. Attention : cela augmente fortement la taille finale des fichiers png/jxl
#screenshot-sw=yes                            # Utilise ou non le rendu logiciel pour les captures d'écran (par défaut : no). Avec yes, le scaler logiciel convertit la vidéo en RGB (ou dans tout format requis par la capture). Le moteur de rendu logiciel peut ne pas prendre en charge certaines fonctions, comme le rendu HDR
screenshot-template="~~/files/screen/%{media-title}-%P-%n"
                                              # # [Si le chemin est défini directement dans le modèle, --screenshot-dir est inutile] Modèle de nom des captures d'écran : https://mpv.io/manual/master/#options-screenshot-template
#screenshot-dir=~~desktop/                    # [Si le chemin est déjà défini dans le modèle de nom, ce paramètre est inutile] Enregistre par défaut les captures sur le bureau

####################
# Scripts, filtres et shaders #
####################

gpu-shader-cache-dir="~~/cache/shaders_cache"                                   # Définit le dossier de stockage des shaders GPU compilés afin d’accélérer le démarrage. Activé par défaut
                                                                                ## Attention ! Si ce dossier n’est pas placé dans APPDATA, vérifiez que l’utilisateur dispose des droits d’écriture.
                                                                                ## Le cache des shaders est censé accélérer le chargement, mais des performances d’E/S disque insuffisantes peuvent produire l’effet inverse ; désactivez-le ou non selon votre situation
##⇘⇘Scripts
## Activation des scripts intégrés (sauf nécessité particulière, ne désactivez pas les fonctions intégrées de mpv)
#load-scripts=no                                                                # Charge automatiquement tous les scripts externes du sous-dossier scripts situé à côté du fichier de configuration ; yes par défaut. Avec no, la commande de la ligne suivante permet de charger des scripts externes précis ; déconseillé
#scripts="~~/scripts/autoload.lua;~~/scripts/playlistmanager.lua"
#load-auto-profiles=no                                                          # <yes|no|auto par défaut> Active le script intégré de profils conditionnels de mpv [auto_profiles.lua]
#load-osd-console=no                                                            # Active le script de console intégré de mpv [console.lua] ; yes par défaut
#load-stats-overlay=no                                                          # Active le script de statistiques intégré de mpv [stats.lua] ; yes par défaut
#load-select=no                                                                 # Active le script de menu de sélection intégré de mpv [select.lua] ; yes par défaut
load-context-menu=yes                                                           # Active le script intégré de rendu des menus de mpv [context_menu.lua] ; no par défaut sous Windows
#ytdl=no                                                                        # Active le script intégré de mpv améliorant l’analyse des URL [ytdl-hook.lua] ; yes par défaut
#ytdl-format=bestvideo*+bestaudio/best                                          # <ytdl|best|worst|mp4|webm|...> Format/qualité vidéo transmis directement à youtube-dl
                                                                                ## ytdl ne transmet pas l’option --format à youtube-dl et ne remplace donc pas sa valeur par défaut. Notez que youtube-dl renvoie parfois des formats inutilisables par mpv ; dans ce cas, la valeur par défaut de mpv peut être préférable
#ytdl-extract-chapters=no                                                       # <yes par défaut|no> Active l’extraction des chapitres depuis la description vidéo fournie par youtube-dl
#ytdl-raw-options=sub-langs="zh.*",write-subs=,write-auto-subs=
#ytdl-raw-options-append=write-subs=
#ytdl-raw-options-append=yes-playlist=
#ytdl-raw-options-append=cookies-from-browser=Firefox                           # Transmet et utilise les cookies du navigateur ; prend notamment en charge Firefox, Chrome, Chromium, Edge, Opera et Vivaldi
                                                                                ## Remarque : l’option cookies-from-browser exige que le navigateur soit déjà connecté au site cible et que les cookies n’aient pas expiré
                                                                                ## Pour les navigateurs basés sur Chromium (Chrome, Edge, etc.), tous les processus doivent être fermés afin de lire les cookies ; vous pouvez aussi utiliser --ytdl-raw-options-append=cookies=cookies.txt
#ytdl-raw-options-append=cookies=[D:/cookies.txt]                               # Transmet et utilise le fichier cookies.txt ; seuls les chemins absolus sont pris en charge
#ytdl-raw-options-append=proxy=http://127.0.0.1:7890
                                                                                # [Valable lors de l’analyse d’une URL avec yt-dlp/youtube-dl] --ytdl-raw-options=<key>=<value>[,<key>=<value>[,...]] transmet des options personnalisées à ytdl https://github.com/yt-dlp/yt-dlp#usage-and-options
                                                                                ## Pour transmettre plusieurs paramètres, mieux vaut les ajouter séparément avec plusieurs options --ytdl-raw-options-append https://mpv.io/manual/master/#options-ytdl-raw-options
#stream-lavf-o-append=http_proxy=http://127.0.0.1:7890                          # [Valable lors de l’analyse d’une URL avec libavformat] --stream-lavf-o-append=<key>=<value>[,<key>=<value>[,...]] transmet des options personnalisées à libavformat
                                                                                ## Pour transmettre plusieurs paramètres, mieux vaut les ajouter séparément avec plusieurs options --stream-lavf-o-append https://mpv.io/manual/master/#options-stream-lavf-o
                                                                                ## Notez qu’en pratique, le proxy défini par cette option est également transmis à ytdl et aux autres requêtes réseau
#input-builtin-bindings=no                                                      # Désactive le chargement des raccourcis intégrés de mpv au démarrage. Cette option n’affecte pas les raccourcis des scripts externes chargés
input-default-bindings=no                                                       # Désactive les raccourcis intégrés de mpv ainsi que ceux définis avec --mp.add_key_binding par les scripts externes chargés
                                                                                ## Cela résout efficacement les conflits entre raccourcis de scripts ; après activation, définissez les raccourcis nécessaires dans input.conf

##⇘⇘Filtres
## Syntaxe des filtres audio/vidéo chargés au démarrage de MPV (plusieurs filtres possibles) : --af/vf=filtre①=paramètre❶=valeur:paramètre❷=valeur,filtre②...
## --af et --vf ne peuvent apparaître qu’une seule fois chacun. Pour ne pas vous limiter à ce paramètre, séparez les réglages : utilisez par exemple plusieurs fois --vf-toggle afin d’ajouter individuellement d’autres filtres sans remplacer ceux définis par --vf=<value>
## Les algorithmes de filtrage d’une même catégorie sont mutuellement exclusifs

## Règle le volume de chaque canal des pistes multicanales afin d’éviter une musique de fond ou des voix trop faibles (équipement stéréo)
#af-toggle=@dynaudnorm:lavfi=[dynaudnorm=f=500:g=31:p=0.5:m=5:r=0.9]
#af-toggle=@dynaudnorm:!dynaudnorm=p=0.65:r=0.9
## Autre série d’exemples
#af-toggle=@loudnorm:lavfi=[loudnorm=I=-16:TP=-1.5:LRA=11]
#af-toggle=@loudnorm:!loudnorm=I=-25:TP=-1.5:LRA=4:linear=false

## Choisissez un seul des trois filtres audio de changement de vitesse (la valeur par défaut actuelle est déjà suffisante)
#af=scaletempo=scale=1.0:stride=60:overlap=.20:search=14:speed=tempo
                                                                                # Ancien filtre audio de changement de vitesse utilisé par mpv. Les valeurs données en exemple sont celles par défaut
                                                                                # scale=<N> contrôle l’accélération vidéo supplémentaire ; une valeur stride=<N> trop élevée provoque des coupures audio à haute vitesse et de l’écho à basse vitesse, tandis qu’une valeur trop faible modifie la hauteur tonale ; l’augmenter améliore les performances
                                                                                # overlap=<N> est le pourcentage de chevauchement ; le réduire améliore la séparation et les performances. search=<N> est la longueur (en millisecondes) de recherche de la meilleure position de chevauchement ; la réduire améliore les performances
                                                                                # speed=<tempo|pitch|both|none> : tempo synchronise le rythme et la vitesse ; pitch provoque des saccades et n’est pas utilisé ; both préserve à la fois le rythme et la hauteur ; none ignore les changements de vitesse et n’est pas utilisé
#af=scaletempo2=min-speed=0.25:max-speed=4.0:search-interval=30:window-size=20  
                                                                                # Ce paramètre correspond au filtre audio activé automatiquement par défaut lors d’une lecture à vitesse variable. En dehors de la plage min/max-speed=<N>, le son est directement coupé. scaletempo2 offre une meilleure qualité audio
#af=rubberband                                                                  # Qualité sonore située entre scaletempo et scaletempo2. Les réglages fins sont nombreux ; consultez la documentation officielle pour plus de détails. Les paramètres par défaut sont utilisés ici

#vf-toggle=fps=fps=60/1.001                                                     # Force la sortie vidéo à la fréquence indiquée (incompatible avec l’interpolation d’images), généralement pour rendre le défilement des commentaires plus fluide. L’emploi de --sub-fps=<value> est déconseillé. La valeur entière du numérateur doit correspondre à la fréquence de rafraîchissement de l’écran
#vf-toggle=@rtx-hdr:d3d11vpp=nvidia-true-hdr                                    # [Actif avec --gpu-api=d3d11]. Filtre vidéo NVIDIA RTX VIDEO HDR qui effectue une conversion inverse de SDR vers HDR dans un environnement de sortie HDR. Le résultat est bon et supérieur à la conversion inverse de gpu-next. Nécessite une carte graphique NVIDIA et un pilote compatibles
                                                                                ## Pour l’utiliser, appliquez-le correctement à l’aide du profil conditionnel [RTX-HDR] ci-dessous
#vf-toggle=@rtx-vsr:d3d11vpp=format=nv12:scale=2:scaling-mode=nvidia            # [Actif avec --gpu-api=d3d11]. Filtre vidéo NVIDIA RTX VSR activant la technologie de super-résolution de NVIDIA. Le résultat est inférieur aux shaders de super-résolution tiers de mpv et la consommation est plus élevée ; utilisation déconseillée. Nécessite une carte graphique NVIDIA et un pilote compatibles

##⇘⇘Shaders
### Les réglages liés aux shaders s’effectuent au moyen de profils. Les lignes suivantes ne sont que des exemples de paramètres ; pour les réglages concrets, consultez les profils correspondants dans les sections [Paramètres généraux complémentaires] et [Profils] ci-dessous
## Ici, --glsl-shaders=<value> désigne les shaders chargés à chaque démarrage de MPV (plusieurs éléments possibles)
## Exemple de syntaxe pour charger initialement plusieurs shaders
#glsl-shaders="~~/shaders/igv/KrigBilateral.glsl;~~/shaders/igv/FSRCNNX_x2_8-0-4-1.glsl;~~/shaders/igv/FSRCNNX_x2_8-0-4-1.glsl;~~/shaders/igv/SSimSuperRes.glsl;~~/shaders/igv/SSimDownscaler.glsl"
#glsl-shaders="~~/shaders/Anime4K/glsl/Restore/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_Soft_M.glsl;~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_CNN_x2_S.glsl"

## --glsl-shaders-append équivaut à --glsl-shader=<value> (notez la différence avec le paramètre décrit à la ligne précédente) et ajoute un shader, un seul à la fois, sans remplacer ceux indiqués par le premier --glsl-shaders=<value>. Cette commande peut être répétée sans limite.
#glsl-shaders-append="~~/shaders/other/PixelClipper.glsl"                       # Shader anti-ringing principalement destiné aux algorithmes internes de mise à l’échelle EWA de mpv. Ses résultats sont légèrement meilleurs que ceux de l’algorithme AR intégré à --vo=gpu-next
#glsl-shaders-append="~~/shaders/other/JointBilateral.glsl"                     # Shader de suréchantillonnage chromatique bilatéral, version gaussienne. Il utilise le plan de luminance comme guide afin d’obtenir des contours plus nets sans introduire de ringing. Disponible uniquement avec --vo=gpu-next
#glsl-shaders-append="~~/shaders/other/nlmeans_luma.glsl"                       # Shader de réduction du bruit offrant de bons résultats, mais assez coûteux en performances ; disponible uniquement avec --vo=gpu-next. Il doit rester tout en tête de la chaîne, sans quoi le débruitage après agrandissement perd nettement en qualité
#glsl-shaders-append="~~/shaders/other/colorlevels.glsl"                        # Shader réglant la plage de sortie RGB. Pour l’utiliser, adaptez les valeurs REFBLACK et REFWHITE du shader à votre matériel, faute de quoi l’image produite risque de ne pas correspondre au résultat attendu
#glsl-shaders-append="~~/shaders/igv/KrigBilateral.glsl"                        # Algorithme avancé de suréchantillonnage chromatique cscale qui, lorsqu’il est actif, remplace l’algorithme défini par --cscale=xxxxx. C’est actuellement le meilleur shader de suréchantillonnage chromatique
#glsl-shaders-append="~~/shaders/igv/FSRCNNX_x2_8-0-4-1.glsl"                   # Algorithme rapide d’agrandissement par réseau neuronal convolutif de super-résolution. Facteur minimal de déclenchement : 1.2. Lorsqu’il est actif, il remplace l’algorithme défini par --scale=xxxxx. Très mauvais sur les images de faible résolution, où il introduit de nombreux artefacts supplémentaires
#glsl-shaders-append="~~/shaders/igv/FSRCNNX_x2_16-0-4-1.glsl"                  # Algorithme rapide d’agrandissement par réseau neuronal convolutif de super-résolution. La variante 16x offre un meilleur résultat mais consomme davantage. Facteur minimal de déclenchement : 1.2. Lorsqu’il est actif, il remplace l’algorithme défini par --scale=xxxxx
#glsl-shaders-append="~~/shaders/igv/FSRCNNX_x1_16-0-4-1_distort.glsl"          # Algorithme rapide de suppression des artefacts par réseau neuronal convolutif de super-résolution. Variante de désartéfactage, sans facteur de déclenchement
#glsl-shaders-append="~~/shaders/nnedi3/nnedi3-nns32-win8x4.glsl"               # Algorithme d’agrandissement par interpolation de très haute qualité. Facteur minimal de déclenchement : 1.2, consommation modérée. nns16 → nns32 → nns64 → nns128 → nns256 ; win8x4 → win8x6 améliore la qualité, mais augmente fortement le coût en performances
#glsl-shaders-append="~~/shaders/ravu/ravu-zoom-ar-r3.glsl"                     # Variante zoom polyvalente de l’algorithme d’agrandissement ravu ; facteur de déclenchement >1. Agrandit jusqu’à la résolution cible et remplace alors l’algorithme défini par --scale=xxxxx. Au-delà d’un agrandissement par 4, le résultat est inférieur aux algorithmes scale internes de type EWA de mpv
#glsl-shaders-append="~~/shaders/ravu/ravu-lite-ar-r3.glsl"                     # Variante lite polyvalente de l’algorithme d’agrandissement ravu ; facteur minimal de déclenchement d’environ 1.2. C’est la variante la plus nette et, lorsqu’elle est active, elle remplace l’algorithme défini par --scale=xxxxx
#glsl-shaders="~~/shaders/AnimeJaNaiV3L1/AnimeJaNaiV3L1_HD_x2.glsl"             # Algorithme d’agrandissement AnimeJaNaiV3. Excellent traitement des artefacts ; shader d’animation supérieur à Anime4K. Plus net qu’Ani4k, il peut produire un effet de lissage proche d’AniSD. Coût en performances élevé
#glsl-shaders="~~/shaders/Ani4K/Ani4Kv2_ArtCNN_C4F32_i2.glsl"                   # Algorithme d’agrandissement Ani4k. Excellent traitement des artefacts tout en préservant autant que possible le style d’origine ; shader d’animation supérieur à Anime4K. Son coût en performances est toutefois très élevé ; utilisez-le selon les capacités de votre matériel
                                                                                # À utiliser avec --vo=gpu-next ; la variante CMP ne convient qu’à --gpu-api=vulkan
#glsl-shaders-append="~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_Soft_M.glsl" 
                                                                                # Module d’agrandissement Anime4k (restauration modérée de l’image + léger renforcement perceptuel + faible ajout d’artefacts). Facteur minimal de déclenchement de la variante CNN : 1.2. La variante adoucie et anti-crénelage Restore_CNN_Soft est recommandée afin de réduire le ringing et les autres artefacts
                                                                                # Présentation et mode d’emploi des shaders Anime4k : https://hooke007.github.io/mpv-lazy/[01]_%E7%AC%AC%E4%B8%89%E6%96%B9%E7%9D%80%E8%89%B2%E5%99%A8%E4%BB%8B%E7%BB%8D.html
#glsl-shaders-append="~~/shaders/igv/SSimSuperRes.glsl"                         # Corrige l’algorithme d’agrandissement intégré de mpv défini par --scale=xxxxx (suppression des artefacts de ringing, restauration de la netteté d’origine, etc.). Réservé aux algorithmes scale internes de mpv ; l’association avec d’autres shaders d’agrandissement est déconseillée et peut donner de mauvais résultats
#glsl-shaders-append="~~/shaders/igv/SSimDownscaler.glsl"                       # Améliore l’algorithme interne de réduction de mpv ; à utiliser avec --linear-downscaling=no
#glsl-shaders-append="~~/shaders/igv/adaptive-sharpen.glsl"                     # Shader d’accentuation adaptative. Ne doit pas être utilisé lors d’un sous-échantillonnage (réduction), car il introduit des artefacts de crénelage


##################
# Paramètres généraux complémentaires #
##################

#d3d11-output-csp=pq                          # [Nécessite --gpu-api=d3d11] Ce paramètre permet une sortie HDR directe ; incompatible avec les profils conditionnels, il affecte aussi la lecture SDR
                                              # Dans la version actuelle, le HDR doit d’abord être activé manuellement dans le système
#use-filedir-conf                             # Charge le fichier de configuration situé dans le même dossier que le fichier lu
#include="~~/profiles.conf"                   # Charge en complément le fichier de configuration indiqué
                                              # Tous les paramètres de profils ci-dessous peuvent également être placés séparément dans "~~/profiles.conf" ; activer ce paramètre produit le même effet
#input-conf="~~/input.conf"                   # Indique le fichier de configuration input servant à définir les raccourcis
#libplacebo-opts=tone_map_metadata=cie_y
                                              # Transmet des options brutes supplémentaires au moteur de rendu libplacebo (utilisé par --vo=gpu-next), à des fins de débogage
                                              # Paramètres détaillés : http://libplacebo.org/options
                                              # Effet du paramètre d’exemple : force l’utilisation de la détection du pic pour le tone mapping HDR

##⇘⇘Paramètres d’activation des profils ordinaires ci-dessous ; choisissez-les selon vos besoins
#profile=ICC                                  # Profil de gestion des couleurs ICC utilisant le profil d’affichage ICC défini dans les paramètres d’affichage du système d’exploitation
#profile=ICC+                                 # Profil de gestion des couleurs ICC utilisant un profil ICC générique fourni par color.org ou un profil d’étalonnage professionnel ; choisissez celui correspondant à l’espace colorimétrique de l’écran
profile=Target                                # Profil de gestion des couleurs Target, incompatible avec la gestion des couleurs ICC
profile=Dither                                # Profil d’algorithme de tramage (fruit), au résultat proche de error-diffusion et à faible consommation
#profile=Dither+                              # Profil d’algorithme de tramage (error-diffusion), tramage de profondeur des couleurs par diffusion d’erreur ; meilleur résultat, mais consommation la plus élevée
profile=Tscale                                # [Commentez d’abord --tscale=<value>] Algorithme d’interpolation temporelle ; voir les paramètres du profil homonyme dans la section de configuration ci-dessous
#profile=Tscale+                              # [Commentez d’abord --tscale=<value>] Autre algorithme d’interpolation temporelle ; voir les paramètres du profil homonyme dans la section de configuration ci-dessous
profile=HQ                                    # Profil d’algorithmes intégrés le plus courant
profile=DeBand-low                            # [Commentez d’abord --deband] Préréglage de réduction des bandes ; voir les paramètres du profil homonyme ci-dessous. Pour un deband proche de madvr, utilisez low, qui donne déjà de très bons résultats
#profile=DeBand-medium                        # [Commentez d’abord --deband] Autre préréglage de réduction des bandes ; voir les paramètres du profil homonyme ci-dessous. Pour un deband proche de madvr, utilisez medium
#profile=DeBand-high                          # [Commentez d’abord --deband] Autre préréglage de réduction des bandes ; voir les paramètres du profil homonyme ci-dessous. Pour un deband proche de madvr, utilisez high
profile=HDR2SDR                               # Profil des paramètres de conversion HDR vers SDR
                                              # Ce profil n’affecte pas la sortie directe HDR sur un écran HDR ; il n’est donc pas nécessaire de le commenter pour configurer cette sortie. Il affecte en revanche l’affichage du contenu SDR
                                              # En sortie directe HDR, le mappage dynamique et les algorithmes de ce profil peuvent néanmoins s’appliquer lorsque la luminosité de l’image HDR dépasse la luminance maximale de l’écran
#profile=SDR2HDR                              # Profil des paramètres de conversion SDR vers HDR, actif uniquement en mode d’affichage HDR ; activation déconseillée. Disponible uniquement avec --vo=gpu-next
#profile=SWscaler                             # Autre méthode de mise à l’échelle logicielle

## Profils de shaders ci-dessous : activez celui dont vous avez besoin (il remplacera les paramètres --glsl-shaders-append ci-dessus)
profile=NNEDI3                                # Convient à la plupart des scènes (NNEDI3-32)             ## Très bon dans l’immense majorité des cas et plus polyvalent que les autres profils (réduction du crénelage et des artefacts de ringing). À privilégier si vous recherchez la polyvalence
#profile=NNEDI3+                              # Convient à la plupart des scènes (NNEDI3-64)             ## En théorie, les variantes NNEDI3-64 et supérieures réduisent mieux les artefacts de ringing, mais leur consommation double à chaque palier ; choisissez selon les performances de votre matériel
#profile=ravu-zoom                            # Convient à la plupart des scènes (ravu-zoom)             ## Agrandit jusqu’à la résolution cible ; au-delà d’un facteur 4, le résultat est inférieur aux algorithmes scale internes de type EWA de mpv
#profile=FSRCNNX                              # Convient aux scènes HD (FSRCNNX)                         ## Résultat proche de NGU Sharp de madvr, mais avec davantage d’artefacts de ringing. Très mauvais sur les images de faible résolution, où il introduit de nombreux artefacts supplémentaires
#profile=FSRCNNX+                             # Convient aux scènes SD (FSRCNNX_distort)                 ## Excellente réduction des artefacts de ringing sur les images de faible résolution, mais un effet de lissage reste possible
#profile=AnimeJaNai                           # Convient à la plupart des animations (AnimeJaNai)        ## Excellent traitement des artefacts ; shader d’animation supérieur à Anime4K. Plus net qu’Ani4k, il peut produire un effet de lissage proche d’AniSD. Coût en performances élevé
#profile=Ani4K                                # Convient à la plupart des animations (Ani4k)             ## Excellent traitement des artefacts tout en préservant autant que possible le style d’origine ; shader d’animation supérieur à Anime4K. Son coût en performances est toutefois très élevé ; utilisez-le selon les capacités de votre matériel
#profile=AniSD                                # Convient aux animations SD (AniSD)                       ## Excellent traitement des artefacts des animations SD ; shader d’animation supérieur à Anime4K. Son coût en performances est toutefois très élevé ; utilisez-le selon les capacités de votre matériel
#profile=Anime4K                              # Convient à la plupart des animations (désartéfactage et anti-crénelage Anime4k) ## Réduit efficacement le crénelage, le ringing et d’autres artefacts, mais entraîne encore un lissage nettement perceptible
#profile=SSIM                                 # Convient aux configurations à faibles performances

##############
# Profils ordinaires #
##############

##⇘⇘Les profils ordinaires n’ont pas de condition d’activation automatique (tous les profils intégrés sont eux aussi ordinaires)
##Activez plusieurs profils dans le fichier de configuration principal avec --profile=<profile1,profile2,...> ou plusieurs lignes --profile=<xxx>

[ICC]
 icc-profile=""
 icc-profile-auto
 icc-intent=0
 icc-force-contrast=1000
 icc-3dlut-size=auto
 icc-cache-dir="~~/cache/icc_cache"

[ICC+]
 icc-profile="~~/icc/ITU-RBT709ReferenceDisplay.icc"
 icc-intent=0
 icc-force-contrast=no
 icc-3dlut-size=auto
 icc-cache-dir="~~/cache/icc_cache"

[Target]
 icc-profile=""
 icc-profile-auto=no
 target-prim=auto
 #target-trc=gamma2.2
 #target-peak=203
 target-contrast=auto
 #sdr-adjust-gamma=no
 #treat-srgb-as-power22=no

[Dither]
 dither-depth=auto
 dither=fruit
 dither-size-fruit=6

[Dither+]
 dither-depth=auto
