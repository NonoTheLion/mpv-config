##############
# Groupes de profils conditionnels #
##############

##⇘⇘Profils déclenchés sous condition : activent certains paramètres selon les conditions indiquées. Voir l’exemple pour le format simplifié
##Il suffit de commenter --profile-cond et --profile-restore pour convertir un profil conditionnel en profil ordinaire ; celui-ci s’utilise dans la section générale avec --profile=<value>

##⇘⇘Exemple de format d’un profil conditionnel
##[FS-loop]                                                  # nom du profil, personnalisable
##profile-desc    = Lire le fichier actuel en boucle en plein écran # description du profil, ce n’est pas un paramètre ; texte libre
##profile-cond    = fullscreen                               # condition de déclenchement du profil. Liste des propriétés disponibles : https://mpv.io/manual/master/#property-list
##profile-restore = copy                                     # sert généralement à rétablir les paramètres généraux antérieurs au déclenchement (ils seront conservés si cette option est désactivée)
##...                                                        # puis indiquer les paramètres activés lorsque la condition est remplie
##...

##⇘⇘Exemple de correspondance du nom de fichier : déclenche le profil selon certains caractères du nom
##Le caractère "-" doit être précédé du caractère d’échappement LUA "%"
#[VCB-Studio]
#profile-desc=Disjoncteur à vide
#profile-cond=filename:find("VCB%-Studio")~=nil
#profile-restore=copy
#deband=no

[SD]
 profile-desc=Amélioration des sources en basse définition
 profile-cond=height <= 720 or width <= 720
 profile-restore=copy
 profile=FSRCNNX+

[Deband]
 profile-desc=Activer la suppression des bandes pour les sources inférieures à YUV420P10 # désactivation forcée pour les vidéos 8k
 profile-cond=get("video-params/average-bpp") < 24 and not (get("video-params/w") > 7000 or get("video-params/h") > 3000)
 profile-restore=copy
 deband=yes

[hdr-2390]
 profile-cond=p.tone_mapping == "bt.2390" and p.current_vo == "gpu-next"
 profile-restore=copy
 tone-mapping-param=2.0

#[hdr-spline]
#profile-cond=p.tone_mapping == "spline"
#profile-restore=copy
#tone-mapping-param=1.0

[peak-percentile]
 profile-cond=get("video-params/avg-pq-y") < 0.21 and p.current_vo == "gpu-next"
 profile-restore=copy
 hdr-peak-percentile=99.8

[SDR-gamut]
 profile-desc=Mappage de l'espace colorimétrique du contenu SDR
 profile-cond=get("video-params/primaries") ~= "bt.709" and get("video-params/gamma") == "bt.1886"
 profile-restore=copy
 gamut-mapping-mode=clip

[SDR-target]
 profile-desc=Configuration de la cible d'affichage SDR
 profile-cond=get("video-params/gamma") == "bt.1886" and not get("inverse-tone-mapping") and p.current_vo == "gpu-next"
 profile-restore=copy
 target-colorspace-hint=no

#[RTX-HDR]
# Pour que ce profil soit effectif, désactivez le profil conditionnel [SDR-target] ci-dessus
# profile-desc=Conversion inverse de SDR vers HDR
# profile-cond=get("video-params/gamma") == "bt.1886" and get("video-target-params/max-luma") > 203 and p.current_vo == "gpu-next"
# profile-restore=copy
# inverse-tone-mapping=no
# target-colorspace-hint=auto
# vf-pre=@rtx-hdr:d3d11vpp=nvidia-true-hdr

[HDR]
 profile-desc=Configuration HDR
 profile-cond=get("video-params/max-luma") > 203
 profile-restore=copy
 target-peak=auto
 target-colorspace-hint=auto
 target-colorspace-hint-mode=target
 hdr-reference-white=100
 blend-subtitles=no
 deband=no
 vf=""

[HDR-PASS]
 profile-desc=Paramètres de transmission directe HDR, actifs uniquement en mode d'affichage HDR
 profile-cond=get("video-params/max-luma") > 203 and get("video-target-params/max-luma") > 203 and p.current_vo == "gpu-next"
 profile-restore=copy
 icc-profile=""
 icc-profile-auto=no
 target-colorspace-hint=auto
 target-colorspace-hint-mode=target
 inverse-tone-mapping=no      # La conversion inverse ne doit pas être activée en HDR
 target-prim=auto
 #target-gamut=dci-p3         # Ou adobe, pour l'espace colorimétrique argb
 target-trc=auto              # auto par défaut ; vaut pq avec une sortie HDR. Sous Windows 11, vous pouvez aussi essayer scrgb
 target-peak=auto             # Vous pouvez aussi indiquer la luminosité maximale de l'écran HDR ; par défaut, cette information est obtenue automatiquement
 target-contrast=auto         # Vous pouvez aussi indiquer le contraste de l'écran HDR ; par défaut, cette information est obtenue automatiquement
 #sub-hdr-peak=100            # Règle la luminosité des sous-titres textuels avec une sortie HDR ; plus la valeur est faible, plus ils sont sombres
 #image-subs-hdr-peak=10000   # Règle la luminosité des sous-titres graphiques avec une sortie HDR ; plus la valeur est élevée, plus ils sont sombres ; l'exemple utilise la valeur maximale

[video-sync]
 profile-desc=Change le mode de synchronisation audio-vidéo lorsque l'ajustement de la vitesse audio dépasse le seuil, afin d'éviter une variation perceptible de la hauteur du son
 profile-cond=(speed * audio_speed_correction) > 0 and ((speed * audio_speed_correction) < 0.96 or (speed * audio_speed_correction) > 1.04) and not (get("estimated-vf-fps") > 47 or get("display-fps") > 120)
 profile-restore=copy-equal
 video-sync=display-tempo

[fps-fix]
 profile-desc=Corrige la consommation d'énergie anormale ou les pertes d'images causées par une fréquence d'images vidéo ou un taux de rafraîchissement d'affichage trop élevés
 profile-cond=p.container_fps>32 or (p.display_fps/p.container_fps)>3.2 
 profile-restore=copy
 interpolation=no
 video-sync=audio

[8k-fix]
 profile-desc=En 8k av1, utilise le décodage matériel d3d11va pour éviter les pertes d'images ; cette solution n'est disponible qu'avec --gpu-api=d3d11
 profile-cond=get("video-params/w") > 7000 or get("video-params/h") > 3000
 profile-restore=copy
 hwdec=auto-safe
 video-sync=audio
 glsl-shaders=""
 deband=no
 vf=""

[pgs-fix]
 profile-desc=Corrige le décalage des sous-titres pgs intégrés aux encodages chinois de films lorsque leur format d'image diffère de celui de la vidéo
 profile-cond=get("video-params/aspect") > 16 / 9
 profile-restore=copy
 stretch-image-subs-to-screen=yes

#[deinterlace]
# profile-desc=Désentrelacement automatique
# profile-cond=get("video-frame-info/interlaced")
# profile-restore=copy
# deinterlace

#[audio-filter]
# Effet secondaire : le changement de périphérique de sortie audio provoque une désynchronisation audio-vidéo persistante
# profile-desc=Active le filtre de réglage de la plage dynamique lorsque le nombre de canaux audio est supérieur à 2 ; convient aux périphériques à deux canaux
