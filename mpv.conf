[pause]
 profile-desc=Désactive le maintien au premier plan pendant la pause
 profile-cond=pause
 profile-restore=copy
 ontop=no

#[fullscreen]
# profile-desc=Maintien automatique au premier plan en plein écran
# profile-cond=fullscreen or window_maximized
# profile-restore=copy
# ontop

[maximized]
 profile-desc=Désactive le redimensionnement automatique de la fenêtre lorsqu'elle est agrandie
 profile-cond=window_maximized and vid and not get("current-tracks/video/albumart")
 profile-restore=copy-equal
 auto-window-resize=no

[minimized]
 profile-desc=Met en pause lorsque la fenêtre est réduite
 profile-cond=window_minimized and vid and not get("current-tracks/video/albumart")
 profile-restore=copy-equal
 pause

[end]
 profile-desc=Quitte le plein écran à la fin de la liste de lecture
 profile-cond=idle_active
 no-fullscreen
 no-window-maximized

[media-title]
 profile-desc=Modifie le contenu du titre de la fenêtre pour les protocoles spéciaux
 profile-cond=path:find('://') ~= nil or path:find('^magnet:') ~= nil
 #profile-cond=demuxer_via_network == true
 profile-restore=copy
 title=${?pause==yes:⏸}${?mute==yes:🔇}${?ontop==yes:📌}${media-title}
 osd-playlist-entry=title

