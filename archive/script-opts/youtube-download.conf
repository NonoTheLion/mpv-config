###### Raccourcis clavier ######
#download_video_binding=ctrl+d
#download_audio_binding=ctrl+a
#download_subtitle_binding=ctrl+s
#download_video_embed_subtitle_binding=ctrl+i
#select_range_binding=ctrl+r
#download_mpv_playlist=ctrl+p
###### Raccourcis clavier ######

# Format audio : "best", "aac", "flac", "mp3", "m4a", "opus", "vorbis" ou "wav". Valeur par défaut : mp3
audio_format=aac

# Qualité audio de ffmpeg/avconv
# Pour le VBR, indiquez une valeur entre 0 (meilleure) et 9 (moins bonne), ou un débit précis tel que 128K. Valeur par défaut : 0
#audio_quality=0

# Intégrer la miniature aux fichiers audio. Désactivé par défaut
embed_thumbnail=yes

# Ajouter des métadonnées aux fichiers audio. Désactivé par défaut
audio_add_metadata=yes

# Ajouter des métadonnées aux fichiers vidéo. Désactivé par défaut
video_add_metadata=yes

# Équivalent à youtube-dl --format FORMAT
# Voir https://github.com/ytdl-org/youtube-dl/blob/master/README.md#format-selection
# Définissez la valeur sur "current" pour télécharger la même qualité que celle en cours de lecture (valeur par défaut)
#video_format=best

# Remultiplexer la vidéo dans un autre conteneur si nécessaire (formats actuellement pris en charge :
# avi, flv, gif, mkv, mov, mp4, webm, aac, aiff, alac, flac, m4a, mka, mp3,
# ogg, opus, vorbis, wav)
#remux_video=mkv

# Réencoder la vidéo dans un autre format si nécessaire (formats actuellement pris en charge : mp4|flv|ogg|webm|mkv|avi)
#recode_video="mp4"

# Limiter les noms de fichiers aux caractères ASCII et éviter « & » ainsi que les espaces. Valeur par défaut : yes
#restrict_filenames=no

# Télécharger toute la playlist (no) ou uniquement une vidéo (yes). Valeur par défaut : yes
# Same as youtube-dl --no-playlist
#no_playlist=no

# Télécharger toute la playlist mpv (yes) ou uniquement la vidéo actuelle (no). Valeur par défaut : no
# Ce réglage peut être remplacé par le raccourci download_mpv_playlist
#mpv_playlist=no

# Utiliser un fichier d'archive ; voir youtube-dl --download-archive
# Options disponibles :
# * Laissez cette option commentée pour ne pas utiliser de fichier d'archive
# * Indiquez un chemin absolu pour utiliser une seule archive pour tous les téléchargements, par exemple download_archive="/home/user/archive.txt"
# * Indiquez un chemin relatif ou un simple nom de fichier pour utiliser une archive par dossier, par exemple download_archive="archive.txt"
# * Utilisez $PLAYLIST pour créer une archive par playlist, par exemple download_archive="/home/user/archives/$PLAYLIST.txt"
#download_archive="$PLAYLIST.txt"

# Chemin de téléchargement des fichiers
## Utilisez '/:dir%mpvconf%' ou '~~/' pour désigner le dossier portable_config, ou '/:dir%script%' pour le dossier du script
## Utilisez '/:var' pour désigner une variable d'environnement, par exemple '/:var%APPDATA%' ou '/:var%HOME%', ou indiquez directement un chemin absolu
download_path=~~/files/ytdl/download
# Format du nom de fichier
filename=%(title)s.%(ext)s

# Langue des sous-titres
# Équivalent à youtube-dl --sub-lang en
# Définissez la valeur sur "all" pour télécharger ou intégrer toutes les langues
#sub_lang=en

# Format des sous-titres
# Équivalent à youtube-dl --sub-format best
#sub_format=best

# Télécharger les sous-titres générés automatiquement
# Équivalent à youtube-dl --write-auto-subs / --no-write-auto-subs
#sub_auto_generated=yes


# Utiliser un fichier de cookies avec youtube-dl
# Équivalent à youtube-dl --cookies
#cookies=C:\Users\username\cookies.txt

# Écrire les erreurs de téléchargement dans un fichier journal
#log_file=C:\Users\username\download.log

# Exécutable youtube-dl à utiliser, par exemple « youtube-dl », « yt-dlp » ou le chemin de l'exécutable
# Commentez cette option pour détecter automatiquement l'exécutable dans $PATH (comportement par défaut)
youtube_dl_exe=yt-dlp

# Utiliser le fichier de configuration correspondant (voir youtube-dl --config-location) à la place des options habituelles associées à ce raccourci
#download_video_config_file=C:\Users\username\video_config.txt
#download_audio_config_file=C:\Users\username\audio_config.txt
#download_subtitle_config_file=C:\Users\username\subtitle_config.txt
#download_video_embed_subtitle_config_file=C:\Users\username\embeded_config.txt

# Ouvrir une nouvelle fenêtre ou un nouvel onglet « Windows Terminal » pour le téléchargement
# Cela permet de suivre la progression du téléchargement
# Fonctionne actuellement uniquement sous Windows avec le nouveau terminal wt.exe
open_new_terminal=no
#open_new_terminal_timeout=

# Commande ouvrant un nouveau terminal (tableau JSON)
# Utilisez "$cwd" comme paramètre substituable du dossier de travail
# Utilisez "$cmd" comme paramètre substituable de la commande de téléchargement
# Exemple pour xfce4-terminal : `--tab` ouvre un onglet
# `-H` maintient l'onglet ouvert à la fin du téléchargement
# open_new_terminal_command=["xfce4-terminal", "--tab", "-H", "-x", "$cmd"]
# Exemple pour Windows Terminal : `new-tab` ouvre un onglet dans une nouvelle fenêtre
# Lance `ytdlp` et maintient l'onglet ouvert avec `/K` à la fin du téléchargement.
# Remplacez `/K` par `/C` pour fermer l'onglet à la fin du téléchargement.
#open_new_terminal_command=["wt", "-w", "ytdlp", "new-tab", "-d", "$cwd", "cmd", "/K", "$cmd"]

# Contenu affiché pour localiser le sous-menu du script dans uosc. Vide par défaut
locale_content=[{"Download": "Télécharger","Audio": "Audio","Subtitles": "Sous-titres","Select range": "Sélectionner une plage","Video (Current quality)": "Vidéo (qualité actuelle)","Video (Default quality)": "Vidéo (qualité par défaut)","Video with subtitles": "Vidéo avec sous-titres","Current file is not a youtube video": "Le fichier actuel n'est pas une vidéo YouTube","Video (Config file)": "Vidéo (fichier de configuration)","Audio (Config file)": "Audio (fichier de configuration)","Subtitle (Config file)": "Sous-titres (fichier de configuration)","Video with subtitles (Config file)": "Vidéo avec sous-titres (fichier de configuration)","Download whole mpv playlist": "Télécharger toute la playlist mpv"}]