# mpv_sort_script.lua

#Forcer ou non le tri des entrées d'un répertoire, même sans demande explicite. Activation recommandée, par défaut : no
always_sort=yes

#Descendre récursivement dans les sous-répertoires et trier en une seule fois tous les fichiers et répertoires trouvés, au lieu de trier chaque répertoire au moment où il est rencontré. Par défaut : no
#Remarque : actif uniquement si always_sort est activé
recursive_sort=no

#Profondeur de récursion maximale dans les sous-répertoires ; 0 signifie aucune récursion. Valeur par défaut : 10
max_recurse_depth=10

#Méthode de tri par défaut, utilisée quand aucun tri n'est indiqué explicitement. Doit valoir l'une des valeurs suivantes : name, date, size, random. Valeur par défaut : date
default_sort=name

#Priorité par défaut entre fichiers et répertoires (ordre de tri), utilisée quand rien n'est indiqué explicitement. Doit valoir l'une des valeurs suivantes : files, dirs, mix. Valeur par défaut : files
default_precedence=files

#Utiliser le tri descendant par défaut. Par défaut : no
default_descending=no

#Utiliser un tri alphanumérique plutôt qu'un simple tri caractère par caractère. Activation recommandée, par défaut : yes
alphanumeric_sort=yes
#Générer une graine aléatoire à partir du chemin ainsi que du nombre de fichiers et de répertoires, afin de mélanger les entrées de façon reproductible. Le tri aléatoire reste ainsi compatible avec la restauration ultérieure de la liste
stable_random_sort=yes
#Graine aléatoire supplémentaire utilisée par stable_random_sort, si vous souhaitez modifier cet ordre stable
random_seed=seed

#Liste, séparée par des virgules, des extensions de fichiers autorisés à la lecture dans un répertoire
extensions=3gp,amr,amv,asf,avi,avi,bdmv,f4v,flv,ifo,iso,m2ts,m4v,mkv,mov,mp4,mpeg,mpg,ogv,rm,rmvb,ts,vob,webm,wmv
#Un motif de correspondance Lua (à peu de chose près) permettant d'exclure des chemins de fichiers et de répertoires. '*' est automatiquement remplacé par '.-'. Vide par défaut
exclude=