####------Paramètres du script-----####

#--Utilisez auto pour détecter automatiquement le système, ou indiquez manuellement Windows, Mac ou Linux
device=auto

#--Commande de copie à utiliser sous Linux. Vous pouvez la remplacer par une autre commande
linux_copy=xclip -silent -selection clipboard -in

#--Commande de collage à utiliser sous Linux. Vous pouvez la remplacer par une autre commande
linux_paste=xclip -selection clipboard -o

#--Commande de copie à utiliser sous Mac. Vous pouvez la remplacer par une autre commande
mac_copy=pbcopy

#--Commande de collage à utiliser sous Mac. Vous pouvez la remplacer par une autre commande
mac_paste=pbpaste

#--Utiliser PowerShell pour copier sous Windows. Vous pouvez aussi indiquer une autre commande, par exemple clip
windows_copy=powershell

#--Utiliser PowerShell pour coller sous Windows. Vous pouvez aussi indiquer une autre commande
windows_paste=powershell

#--Liste à ouvrir automatiquement lorsque mpv est lancé sans vidéo ni fichier. 'none' désactive cette fonction. Choix : all, copy, paste, recents, distinct, protocols, fileonly, titleonly, timeonly, keywords.
auto_run_list_idle=none

#--Masquer le message d'écran inactif de l'OSC à l'ouverture et à la fermeture du menu (un comportement inattendu est possible si plusieurs scripts désactivent cet écran)
toggle_idlescreen=no

#--Définissez 0 pour reprendre à la position exacte, ou une valeur inférieure pour conserver un aperçu avant le point de reprise
resume_offset=-1

#--yes affiche des messages OSD lors des actions. no désactive tous les messages OSD produits par ce script
osd_messages=yes

#--yes marque les horodatages copiés comme chapitres. no désactive cette fonction
mark_clipboard_as_chapter=no

#--Méthode de copie du temps pendant la lecture. Choix : local, protocols, specifics, all, none.
##'none' désactive la fonction ; 'all' copie le temps pour toutes les vidéos ; 'protocols' uniquement pour les vidéos accessibles par protocole ; 'specifics' uniquement pour les sites définis ci-dessous ; 'local' uniquement pour les vidéos locales
copy_time_method=all

#--Comportement du collage lorsqu’un contenu valide est copié et qu’aucune vidéo n’est en cours de lecture. Choix : force, force-noresume
log_paste_idle_behavior=force-noresume

#--Comportement du collage lorsqu’un contenu valide est copié et qu’une vidéo est en cours de lecture. Choix : timestamp>playlist, timestamp>force, timestamp, playlist, force, force-noresume
log_paste_running_behavior=timestamp>playlist

#--Attribut temporel ajouté aux liens des sites indiqués dans cette liste. D’autres attributs peuvent être ajoutés au même format
specific_time_attributes=[ ["twitter", "?t=", ""], ["twitch", "?t=", "s"], ["youtube", "&t=", "s"] ]

#--Texte placé avant le temps de saut lors de la copie depuis mpv d’une vidéo accessible par protocole
protocols_time_attribute=&t=

#--Texte placé avant le temps de saut lors de la copie depuis mpv d’une vidéo locale
local_time_attribute=&time=

#--Attributs temporels collables ajoutés automatiquement par resume, specific_time_attributes, protocols_time_attribute et local_time_attribute
pastable_time_attributes=[" | time="]

#--Raccourci clavier utilisé pour la copie
##! Attention : ce raccourci remplace toute affectation identique dans input.conf ; il est recommandé de le laisser vide et d’associer la fonction dans input.conf
copy_keybind=[""]

#--Priorité du comportement de collage pendant la lecture. Choix : playlist, timestamp, force.
running_paste_behavior=playlist

#--Raccourci clavier utilisé pour le collage
##! Attention : ce raccourci remplace toute affectation identique dans input.conf ; il est recommandé de le laisser vide et d’associer la fonction dans input.conf
paste_keybind=[""]

#---Comportement de copie utilisé avec copy_specific_keybind. Choix : title, path, timestamp, path&timestamp.
copy_specific_behavior=path

#--Raccourci clavier utilisé selon le comportement de copie choisi
##! Attention : ce raccourci remplace toute affectation identique dans input.conf ; il est recommandé de le laisser vide et d’associer la fonction dans input.conf
copy_specific_keybind=[""]

#--Comportement de collage utilisé avec paste_specific_keybind. Choix : playlist, timestamp, force.
paste_specific_behavior=playlist

#--Raccourci clavier utilisé selon le comportement de collage choisi
##! Attention : ce raccourci remplace toute affectation identique dans input.conf ; il est recommandé de le laisser vide et d’associer la fonction dans input.conf
paste_specific_keybind=[""]

#--Ajoutez après la virgule les protocoles à coller, par exemple : 'ftp://'. Supprimez tous les protocoles définis et utilisez "" pour accepter n’importe quel protocole
paste_protocols=["://", "magnet:"]

#--Ajoutez après la virgule les extensions à coller, par exemple : 'pdf'. Supprimez toutes les extensions définies et utilisez "" pour accepter n’importe quelle extension
