#--Ajoutez après la virgule les extensions dont le collage doit tenter l’ajout comme fichier de sous-titres, par exemple : 'txt'. Supprimez toutes les extensions définies et utilisez "" pour essayer avec n’importe quelle extension
paste_subtitles=["aqt", "gsub", "jss", "sub", "ttxt", "pjs", "psb", "rt", "smi", "slt", "ssf", "srt", "ssa", "ass", "usf", "idx", "vtt"]

#--Raccourcis ouvrant la liste avec le filtre indiqué. Filtres disponibles : "all", "copy", "paste", "recents", "distinct", "protocols", "fileonly", "titleonly", "timeonly", "keywords".
##! Attention : ce raccourci remplace toute affectation identique dans input.conf ; il est recommandé de le laisser vide et d’associer la fonction dans input.conf
open_list_keybind=[ ["", "copy"], ["", "recents"] ]

#--Raccourcis dynamiques permettant d’accéder à un filtre lorsque la liste est ouverte (appuyer deux fois sur le raccourci du filtre ferme aussi la liste). Filtres disponibles : "all", "copy", "paste", "recents", "distinct", "protocols", "fileonly", "titleonly", "timeonly", "keywords".
list_filter_jump_keybind=[ ["c", "copy"], ["v", "paste"], ["r", "recents"], ["d", "distinct"], ["f", "fileonly"], ["p", "protocols"], ["t", "titleonly"], ["l", "playing"] ]

####------Paramètres du journal------####

#--Chemin d’enregistrement du journal des signets. Utilisez '/:dir%script%' pour le placer avec le script ou '/:dir%mpvconf%' pour le placer dans le dossier portable_config de mpv.
##Utilisez '/:var' pour une variable, par exemple '/:var%APPDATA%', ou un chemin tel que '/:var%APPDATA%\mpv', '/:var%HOME%/mpv', voire un chemin absolu tel que 'C:\Users\Eisa01\Desktop\'
log_path=/:dir%mpvconf%/files

#--Nom et extension du fichier contenant les données du journal
log_file=mpvClipboard.log

#--Format des dates du journal (voir les formats de date Lua), par exemple : "%d/%m/%y %X" ou "%d/%b/%y %X"
date_format=%A/%B %d/%m/%Y %X

#--Type d’enregistrement du titre du média : all, protocols ou none. Le titre est conservé dans le journal, ce qui est utile pour les sites et protocoles dont le lien seul ne permet pas de le déduire
file_title_logging=protocols

#--Ajoutez après la virgule les protocoles dont le titre doit être conservé dans le journal. Valable uniquement si file_title_logging vaut "protocols" ou "all"
logging_protocols=["://", "magnet:"]

#--Cas dans lesquels le nom de fichier doit être affiché à la place du titre. Choix : local, protocols, all, none
## "local" privilégie le nom des fichiers locaux ; "protocols" celui des ressources accessibles par protocole ; "all" utilise toujours le nom du fichier ; "none" utilise toujours le titre
prefer_filename_over_title=local

#--Limite du nombre d’entrées enregistrées pour un même chemin : -1 ne fixe aucune limite ; 0 met toujours à jour l’entrée existante ; 3 conserve trois entrées, puis met à jour la plus ancienne à partir de la quatrième
same_entry_limit=4

####------Paramètres de la liste-------####

#--Activer le défilement en boucle du curseur
loop_through_list=yes

#--Actualiser l’affichage avec de nouveaux éléments une fois le milieu de la liste atteint
list_middle_loader=yes

#--Afficher le chemin du fichier à la place du titre du média
show_paths=no

#--Afficher le numéro de chaque élément avant son nom et sa valeur
show_item_number=yes

#--Tronquer les noms de fichiers longs selon le nombre de caractères défini ci-dessous
slice_longfilenames=yes

#--Nombre de caractères conservés pour les noms de fichiers longs
slice_longfilenames_amount=80

#--Nombre maximal d’éléments affichés dans la liste actuelle
list_show_amount=10

#--Activer la sélection rapide dynamique avec les touches 0 à 9 lorsque la liste est ouverte (list_show_amount = 10 est la valeur maximale compatible)
quickselect_0to9_keybind=yes

#--Fermer la liste en appuyant deux fois sur le raccourci de la liste principale, même si elle a été ouverte avec un autre filtre
main_list_keybind_twice_exits=yes

#--Quitter intelligemment le mode de saisie de la recherche lorsque la zone de recherche est ouverte, sans appuyer sur Ctrl+Entrée
search_not_typing_smartly=yes

#--"specific" recherche les correspondances dans la date, le titre, le chemin ou l’URL et le temps. "any" recherche toute saisie dans leur combinaison. "any-notime" fait de même sans le temps afin de réduire les résultats indésirables
search_behavior=any

####------Paramètres des filtres-------####
##--Filtres disponibles : "all" affiche tout ; "keybinds" filtre selon les emplacements de raccourcis ; "recents" affiche les derniers éléments ajoutés sans doublons ; "distinct" affiche la dernière entrée enregistrée pour chaque chemin.
##"fileonly" affiche les fichiers sans temps enregistré ; "timeonly" ceux avec un temps ; "keywords" les fichiers correspondant aux mots-clés de la configuration ; "playing" les fichiers en cours de lecture.

#--Filtres parcourus avec les touches gauche et droite, dans l’ordre indiqué. Vous pouvez modifier l’ordre ou retirer des filtres
filters_and_sequence=["all", "copy", "paste", "recents", "distinct", "protocols", "playing", "fileonly", "titleonly", "keywords"]

#--Raccourcis passant au filtre suivant selon filters_and_sequence
next_filter_sequence_keybind=["RIGHT", "MBTN_FORWARD"]

#--Raccourcis passant au filtre précédent selon filters_and_sequence
previous_filter_sequence_keybind=["LEFT", "MBTN_BACK"]

#--Activer le parcours des filtres en boucle
loop_through_filters=yes

#--Créez un filtre "keywords" avec les termes souhaités. Par exemple, youtube.com filtre les vidéos YouTube. Vous pouvez aussi indiquer une partie du nom ou du titre, une extension, ou tout ou partie d’un chemin. Exemple : ["youtube.com", "mp4", "naruto", "c:\\users\\eisa01\\desktop"]. Laissez vide pour désactiver ce filtre
keywords_filter_list=[""]

####------Paramètres de tri-------####
##--Tris disponibles : added-asc place les éléments les plus récents en premier ; added-desc suit l’ordre d’ajout ; alphanum-asc trie de A à Z avec les petits numéros de fichier et d’épisode en premier ; alphanum-desc fait l’inverse ; time-asc et time-desc trient selon le temps

#--Méthode de tri par défaut pour tous les filtres. Choix : added-asc, added-desc, time-asc, time-desc, alphanum-asc, alphanum-desc
list_default_sort=added-asc

#--Tri par défaut de filtres précis, par exemple : [ ["all", "alphanum-asc"], ["playing", "added-desc"] ]
list_filters_sort=[ ["keybinds", "keybind-asc"], ["fileonly", "alphanum-asc"], ["playing", "time-asc"] ]

#--Raccourcis parcourant les tris disponibles lorsque la liste est ouverte
list_cycle_sort_keybind=["alt+s"]

####------Présentation de la liste------####

#--Alignement de la liste selon les positions 1 à 9 du pavé numérique, ou 0 pour le désactiver. Exemples : 7 en haut à gauche, 8 en haut au centre, 9 en haut à droite
list_alignment=7

#--Type de temps affiché dans la liste. Choix : duration, length, remaining.
text_time_type=duration

#--Style du séparateur affiché avant le temps enregistré
time_seperator= 🕒 

#--Style du texte signalant la présence d’autres éléments au-dessus. \N crée un saut de ligne et \h une espace
list_sliced_prefix=...\h\N

#--Style du texte signalant la présence d’autres éléments en dessous
list_sliced_suffix=...

#--yes active le préfixe affichant les raccourcis de sélection rapide avant la liste ; no le désactive
quickselect_0to9_pre_text=no

#--Couleur du texte de la liste, au format hexadécimal BGR
text_color=ffffff

#--Taille du texte de la liste
text_scale=80

#--Épaisseur du contour noir du texte de la liste
text_border=0.5

#--Couleur du texte précédant le curseur, au format hexadécimal BGR
text_cursor_color=ffbf7f

#--Taille du texte de l’élément actuellement sélectionné
text_cursor_scale=90

#--Épaisseur du contour noir du texte de l’élément actuellement sélectionné
text_cursor_border=0.7

#--Texte placé avant les éléments sélectionnés
text_highlight_pre_text=✅ 

#--Couleur de la zone de recherche en mode saisie
search_color_typing=ffffaa

#--Couleur de la zone de recherche lorsqu’elle est active mais hors du mode saisie
search_color_not_typing=56ffaa

#--Couleur du titre de la liste, au format hexadécimal BGR
header_color=56ffaa

#--Taille du titre de la liste
header_scale=100

#--Épaisseur du contour noir du titre de la liste
header_border=0.6

#--Texte utilisé comme titre de la liste
#--Variables disponibles dans le titre : %cursor%, %total%, %highlight%, %filter%, %search%, %listduration%, %listlength%, %listremaining%
#--Textes personnalisés affichés uniquement lorsque la variable correspondante est active : %prefilter%, %afterfilter%, %prehighlight%, %afterhighlight%, %presearch%, %aftersearch%, %prelistduration%, %afterlistduration%, %prelistlength%, %afterlistlength%, %prelistremaining%, %afterlistremaining%
#--Description : %cursor% indique la position du curseur ; %total% le nombre total d’éléments ; %highlight% le nombre d’éléments sélectionnés ; %filter% le nom du filtre ; %search% la recherche saisie. Exemple : %prefilter% est le texte placé avant le filtre et %afterfilter% celui placé après

header_text=📋 Presse-papiers [%cursor%/%total%]%prehighlight%%highlight%%afterhighlight%%prefilter%%filter%%afterfilter%%presort%%sort%%aftersort%%presearch%%search%%aftersearch%

#--Méthodes de tri masquées dans le titre lors de l’utilisation de la variable %sort%
header_sort_hide_text=added-asc

#--Texte affiché avant ou après les variables actives du titre
header_sort_pre_text= \{
header_sort_after_text=}
header_filter_pre_text= [Filter: 
header_filter_after_text=]
header_search_pre_text=\h\N[Search=
header_search_after_text=..]
header_highlight_pre_text=✅
header_highlight_after_text=
header_list_duration_pre_text= 🕒 
header_list_duration_after_text=
header_list_length_pre_text= 🕒 
header_list_length_after_text=
header_list_remaining_pre_text= 🕒 
header_list_remaining_after_text=

#--Style du séparateur affiché pour les éléments copiés dans la liste
copy_seperator= ©

#--Style du séparateur affiché pour les éléments collés dans la liste
paste_seperator= ℗

####-----Paramètres du format temporel-----####
##--Premier paramètre : default, hms, hms-full, timestamp ou timestamp-concise. "default" affiche HH:MM:SS.sss ; "hms" affiche 1h 2m 3.4s ; "hms-full" conserve les heures et minutes à zéro ; "timestamp" affiche 123456.700 ; "timestamp-concise" affiche 123456.7 et masque les décimales inutiles.
##--Deuxième paramètre : affichage, arrondi ou suppression des millisecondes. Valeurs : truncate supprime les millisecondes sans arrondir ; 0 les supprime en arrondissant les secondes ; 1 ou plus indique le nombre de chiffres de millisecondes. Valeur par défaut : 3.
##--Troisième paramètre : séparateur entre hour:minute:second (heure:minute:seconde). "default" utilise automatiquement ":" ; "hms" et "hms-full" utilisent une espace. Exemples : ["default", 3, "-"], ["hms-full", 5, "."], ["hms", "truncate", ":"], ["timestamp-concise"], ["timestamp", 0], ["timestamp", "truncate"], ["timestamp", 5]

copy_time_format=["timestamp-concise"]
osd_time_format=["default", "truncate"]
list_time_format=["default", "truncate"]
header_duration_time_format=["hms", "truncate", ":"]
header_length_time_format=["hms", "truncate", ":"]
header_remaining_time_format=["hms", "truncate", ":"]

####------Raccourcis de la liste------####
#--Ajoutez après la virgule les raccourcis supplémentaires à associer, ou modifiez les lettres entre guillemets
#--Exemples de modification et d’ajout : de ["b", "B"] à ["b"] ; de [""] à ["alt+b"] ; de [""] à ["a", "ctrl+a", "alt+a"]

#--Raccourcis permettant de monter dans la liste
list_move_up_keybind=["UP", "WHEEL_UP"]

#--Raccourcis permettant de descendre dans la liste
list_move_down_keybind=["DOWN", "WHEEL_DOWN"]

#--Raccourcis allant au premier élément de la page affichée
list_page_up_keybind=["PGUP"]

#--Raccourcis allant au dernier élément de la page affichée
list_page_down_keybind=["PGDWN"]

#--Raccourcis allant au premier élément de la liste
list_move_first_keybind=["HOME"]

#--Raccourcis allant au dernier élément de la liste
list_move_last_keybind=["END"]

#--Touche permettant de sélectionner pendant la navigation : maintenez Maj puis utilisez une touche de navigation telle que haut, bas, début ou page suivante
list_highlight_move_keybind=["SHIFT"]

#--Raccourcis sélectionnant tous les éléments affichés dans la liste
list_highlight_all_keybind=["ctrl+a"]

#--Raccourcis désélectionnant tous les éléments actuellement sélectionnés
list_unhighlight_all_keybind=["ctrl+d"]

#--Raccourcis chargeant l’entrée située sous le curseur
list_select_keybind=["ENTER", "MBTN_MID"]

#--Raccourcis ajoutant à la playlist l’entrée située sous le curseur
list_add_playlist_keybind=["CTRL+ENTER"]

#--Raccourcis ajoutant à la playlist toutes les entrées sélectionnées
list_add_playlist_highlighted_keybind=["SHIFT+ENTER"]

#--Raccourcis fermant la liste ; si la recherche est ouverte, ils ferment d’abord celle-ci
list_close_keybind=["ESC", "MBTN_RIGHT"]

#--Raccourcis supprimant l’entrée située sous le curseur
list_delete_keybind=["DEL"]

#--Raccourcis supprimant toutes les entrées sélectionnées de la liste
list_delete_highlighted_keybind=["SHIFT+DEL"]

#--Raccourcis activant la recherche
list_search_activate_keybind=["ctrl+f"]

#--Raccourcis quittant le mode de saisie tout en maintenant la recherche ouverte
list_search_not_typing_mode_keybind=["ALT+ENTER"]

#--Raccourcis ignorés lorsque la liste est ouverte
list_ignored_keybind=[""]
