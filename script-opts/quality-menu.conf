###### Raccourcis clavier ######
# Déplacer le curseur du menu vers le haut
up_binding=UP WHEEL_UP
# Déplacer le curseur du menu vers le bas
down_binding=DOWN WHEEL_DOWN
# Sélectionner l'entrée du menu
select_binding=ENTER MBTN_LEFT
# Fermer le menu de qualité
close_menu_binding=ESC MBTN_RIGHT CTRL+F ALT+F
###### Raccourcis clavier ######

# Mettre la taille de police à l'échelle de la fenêtre ; si non, il faut une police et des marges plus grandes
scale_playlist_by_window=yes

# Surcharge du style de la liste de lecture, entre accolades. \keyvalue est un champ, le \ supplémentaire sert à l'échappement en lua
# example {\\fnUbuntu\\fs10\\b0\\bord1} equals: font=Ubuntu, size=10, bold=no, border=1
# Référence des balises : https://aegi.vmoe.info/docs/3.0/ASS_Tags/
# Les balises non déclarées utilisent les réglages osd par défaut
# Ces styles s'appliquent à l'ensemble de la liste de lecture ; une mise en œuvre plus fine ne serait pas élégante
# Une police à chasse fixe est conseillée pour un rendu soigné
style_ass_tags={\\fnNoto Sans Mono CJK SC\\fs25\\bord0.5}

# Curseur personnalisé
# Les balises ASS évoquées plus haut sont également utilisables. Par exemple :
# selected_and_inactive={\c&H33FFFF&}●  -   | ajoute une couleur au format sélectionné
# Avec les balises ASS, il faut les réinitialiser sur chaque ligne
selected_and_active={\c&H00FF00&}▶  - 
selected_and_inactive={\c&H33FFFF&}●  - 
unselected_and_active={\c&HAAAAAA&}▷ - 
unselected_and_inactive={\c&HFFFFFF&}○ - 

# Décalage des coordonnées de dessin. Nécessaire pour la compatibilité avec mpv.net
shift_x=0
shift_y=0

# Marge intérieure en haut à gauche
text_padding_x=5
text_padding_y=10

# Assombrissement de l'écran à l'ouverture du menu
curtain_opacity=0.7

# Délai d'expiration du menu de qualité, en secondes
menu_timeout=6

# Utiliser youtube-dl pour obtenir la liste des formats disponibles (remplace quality_strings), par défaut : yes
fetch_formats=yes

# Liste des chaînes de format ytdl proposées au choix
quality_strings_video=[ {"4320p" : "bestvideo[height<=?4320p]"}, {"2160p" : "bestvideo[height<=?2160]"}, {"1440p" : "bestvideo[height<=?1440]"}, {"1080p" : "bestvideo[height<=?1080]"}, {"720p" : "bestvideo[height<=?720]"}, {"480p" : "bestvideo[height<=?480]"}, {"360p" : "bestvideo[height<=?360]"}, {"240p" : "bestvideo[height<=?240]"}, {"144p" : "bestvideo[height<=?144]"} ]
quality_strings_audio=[ {"default" : "bestaudio"} ]

# Afficher le menu des formats vidéo à l'ouverture d'une vidéo en ligne, par défaut : yes
start_with_menu=no

# Inclure les formats inconnus dans la liste ; la détection des formats vidéo ou audio n'est malheureusement pas toujours parfaite
# Mettre à yes pour être sûr de ne manquer aucun format, mais la liste peut alors contenir des formats qui ne sont ni vidéo ni audio. Les formats identifiés comme n'étant ni vidéo ni audio restent filtrés
include_unknown=no

# Masquer les colonnes identiques pour tous les formats, par défaut : yes
hide_identical_columns=yes

# Ordre d'affichage des attributs en colonnes, sous forme de liste séparée par ',' ; un '-' devant un attribut aligne la colonne à gauche
# Pour l'intégration uosc, le texte peut être scindé en titre et en indication
## Il suffit pour cela de séparer les deux colonnes par '|' au lieu d'une virgule
##Attributs disponibles :
#resolution, width, height, fps, dynamic_range, tbr, vbr, abr, asr,
#filesize, filesize_approx, vcodec, acodec, ext, video_ext, audio_ext,
#language, format, format_note, quality
##Les attributs suivants font l'objet d'un traitement particulier
#size, frame_rate, bitrate_total, bitrate_video, bitrate_audio,
#codec_video, codec_audio, audio_sample_rate
columns_video=-resolution,frame_rate|dynamic_range,bitrate_video,size,-codec_video,-ext
columns_audio=language,audio_sample_rate,bitrate_audio|size,-codec_audio,-ext

# Colonnes servant au tri ; pour les colonnes disponibles, voir 'columns_video'
# Liste séparée par des virgules, une colonne préfixée de « - » inverse l'ordre de tri
# Laisser vide pour conserver l'ordre de yt-dlp/youtube-dl
# Remarque : une colonne mal orthographiée ne provoque pas d'erreur, mais peut fausser le résultat
sort_video=
sort_audio=