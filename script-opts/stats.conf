###Les commentaires en fin de ligne d'option ne sont pas pris en charge, il faut les mettre sur une ligne à part

# -- Raccourcis clavier dynamiques (correspondant aux cinq pages d'informations)
#key_page_1=1
#key_page_2=2
#key_page_3=3
#key_page_4=4
#key_page_0=0

# -- Raccourcis clavier dynamiques (certaines pages peuvent défiler vers le haut et vers le bas)
#key_scroll_up=UP
#key_scroll_down=DOWN
##Nombre de lignes parcourues à chaque défilement. Par défaut : 1
#scroll_lines=1

##Durée de l'affichage bref (en secondes). Par défaut : 4
#duration=4
##Intervalle de rafraîchissement des données en affichage permanent (en secondes) ; la valeur 0 provoque un bug. Par défaut : 1
#redraw_delay=1
##Mise en forme du texte (ASS). Par défaut : yes
##ass_formatting=yes
##Empêcher les autres textes OSD de recouvrir les informations de stats. Par défaut : no
#persistent_overlay=yes
##Mettre à yes pour afficher le détail complet des passes. Par défaut : no
#print_perfdata_passes=no
##Si la liste des filtres dépasse cette longueur, afficher un filtre par ligne. Par défaut : 128
#filter_params_max_length=128
##Activer la sortie de débogage. Par défaut : 100
#debug=no

# -- Options et style des graphiques
##Afficher le graphique des données de performance. Par défaut : no
#plot_perfdata=yes
##Afficher les graphiques de synchronisation verticale et de gigue (uniquement quand les statistiques sont affichées en permanence). Par défaut : no
#plot_vsync_ratio=yes
#plot_vsync_jitter=yes
##Afficher le graphique des valeurs de cache (page 3), uniquement lors du basculement. Par défaut : no
#plot_cache=no
##Activer automatiquement la visualisation de la LUT de mappage tonal (uniquement quand les statistiques sont affichées en permanence). Par défaut : no
#plot_tonemapping_lut=no

#skip_frames=5
#global_max=yes
##Vider le tampon de données lors du basculement. Par défaut : yes
#flush_graph_data=yes
#plot_bg_border_width=1.25
#plot_bg_border_color=0000FF
#plot_bg_color=262626
#plot_color=FFFFFF

##Indique si le texte et les graphiques suivent la mise à l'échelle de la vidéo. no tente de garder une taille constante, auto les met à l'échelle de l'OSD
##l'OSD suivant lui-même la fenêtre ou gardant une taille constante, selon l'option --osd-scale-by-window. Par défaut : auto
#vidscale=auto

# -- Réglages liés à la police
font=Noto Sans Mono CJK SC
font_mono=Noto Sans Mono CJK SC
##Taille de police, par défaut 20
#font_size=20
##Couleur de la police
font_color=FFFFFF
##Épaisseur du contour de la police, par défaut 1.2
border_size=1.5
##Couleur du contour de la police, par défaut 262626
border_color=000000
shadow_x_offset=0.1
shadow_y_offset=0.1
shadow_color=000000
##<0-99> Transparence de la police, apparemment en pourcentage, par défaut 11
alpha=0

# -- En-tête personnalisé, servant à définir le style de sortie du texte à l'aide de balises ASS
# -- Définir ce paramètre fait ignorer les valeurs de style ci-dessus au profit de cette chaîne
#custom_header=

# -- Mise en forme du texte (ASS)
#ass_nl=\\N
#ass_indent=\\h\\h\\h\\h\\h
#ass_prefix_sep=\\h\\h
#ass_b1={\\b1}
#ass_b0={\\b0}
#ass_it1={\\i1}
#ass_it0={\\i0}
# -- Sans ASS
#no_ass_nl=\n
#no_ass_indent=\t
#no_ass_prefix_sep= 
#no_ass_b1=\027[1m
#no_ass_b0=\027[0m
#no_ass_it1=\027[3m
#no_ass_it0=\027[0m
