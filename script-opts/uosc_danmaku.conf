## Adresse du serveur de danmaku ; un service personnalisé doit être compatible avec l'api de dandanplay
## Il est possible d'indiquer plusieurs api_server, séparés par des virgules, dans l'ordre de priorité
## Chaque entrée accepte une note séparée par '|' ou '#', par exemple : "https://a.example.com|Secours A" ou "https://b.example.com#Secours B"
#api_server=https://danmaku-api.152468.xyz
## Serveur de repli pour la récupération des danmaku de bilibili, iQiyi, Tencent et Youku, surtout utile pour les contenus non animés
## Disponibles : https://dmku.hls.one, https://dmku.hls.one
#fallback_server=https://dmku.hls.one
## Clé API de tmdb, servant à obtenir les informations en chinois des entrées non animées (quand la recherche n'est pas en chinois)
## À récupérer dans les réglages du compte personnel après inscription sur https://www.themoviedb.org
## Attention : si vous personnalisez ce paramètre, la clé API obtenue doit être encodée en base64
#tmdb_api_key=NmJmYjIxOTZkNzIyN2UyMTIzMGM3Y2YzZjQ4MDNkZGM=
## Charger automatiquement les danmaku en ligne
auto_load=no
## Charger automatiquement les danmaku locaux
autoload_local_danmaku=no
## Charger automatiquement les danmaku lors de la lecture d'un flux par URL
autoload_for_url=yes
## Ouvrir automatiquement la boîte de recherche pour une recherche manuelle lorsque le chargement automatique échoue
#auto_fallback_search=no
## Enregistrer automatiquement les danmaku en ligne en local (fichier xml de même nom, dans le dossier de la vidéo)
save_danmaku=no
## Activer le filtre vidéo fps pour un défilement plus fluide des danmaku
##! Coûteux en performance
#vf_fps=yes
## Paramètre du filtre fps à utiliser
#fps=60/1.001
## Tolérance de l'intervalle de temps pour fusionner les danmaku identiques, en secondes. Par défaut : -1, c'est-à-dire désactivé
## Ignorer ou non les différences de type et de couleur lors de la fusion des danmaku identiques. Par défaut : no
#merge_without_style=yes
## Coefficient de croissance logarithmique de la taille de police des danmaku fusionnés, doit être un entier positif
#merge_fontsize_growth=8
## Taille de police maximale autorisée pour les danmaku fusionnés
#merge_fontsize_max=100
## Limite du nombre de danmaku affichés simultanément à l'écran, la valeur par défaut 0 signifie aucune limite
max_screen_danmaku=0
## Chemin du fichier d'historique des associations de danmaku, chemins absolus et relatifs pris en charge
history_path=~~/files/danmaku-history.json

## Conversion chinois simplifié / traditionnel. 0 - aucune conversion, 1 - vers le simplifié, 2 - vers le traditionnel
chConvert=0
## Durée d'affichage des danmaku défilants. Cela influe sur la vitesse de défilement
scrolltime=15
## Durée d'affichage des danmaku fixes
fixtime=5
## Police
fontname=Microsoft YaHei
## Taille de police
fontsize=50
## Opacité
opacity=0.6
## Gras
bold=yes
## Contour 0-4
outline=1
## Ombre
shadow=0
## Zone d'affichage de l'ensemble des danmaku (0.0-1.0)
displayarea=0.85

## Chemin du fichier des mots filtrés (black.txt), chemins absolus et relatifs pris en charge. Une entrée par ligne
## La syntaxe des expressions régulières de lua est prise en charge
#blacklist_path=
## Règles de remplacement supplémentaires pour l'analyse des titres, au format JSON, appliquées via la fonction string.gsub de lua
##! Attention : en raison de la version de lua embarquée dans mpv, les règles personnalisées ne gèrent que les groupes de capture de la forme %n, comme dans l'exemple, et non le remplacement direct de caractères
title_replace=[{"rules":[{ "^〔(.-)〕": "%1"},{ "^.*《(.-)》": "%1" }]}]
## Chemins ou dossiers des disques partagés (points de montage) à ignorer lors de la correspondance par hachage. Chemins absolus et relatifs pris en charge, séparés par des virgules
## Exemple : ["X:", "Z:", "F:/Download/", "Download"]
#excluded_path=