#######################################################
# Ceci est le fichier de configuration par défaut de mpv-file-browser
# https://github.com/CogentRedTester/mpv-file-browser
#######################################################

# Dossiers racine, séparés par des virgules
# sous linux, vous voudrez peut-être ajouter "/",
# sous windows, cela doit être utilisé pour ajouter différentes lettres de lecteur
# Exemples :
# linux:
#   root=~/,/
# windows:
#   root=~/,C:/
root=~/

# Caractères séparant les dossiers racine, chaque caractère fonctionne indépendamment
# au cas où quelqu'un utiliserait un dossier avec un nom particulier
root_separators=,

# Nombre d'éléments à afficher simultanément à l'écran
num_entries=20

# Nombre de dossiers à conserver dans l'historique, une taille de 0 désactive l'historique
history_size=100

# Si le défilement du dossier boucle, par défaut yes
wrap=yes

# Active ou non les extensions, par défaut : no
addons=yes

# Active les raccourcis clavier personnalisés
# le fichier json des raccourcis doit se trouver dans ~~/script-opts
custom_keybinds=yes

# Détecte automatiquement les lecteurs Windows et les ajoute au dossier racine
# Utiliser Ctrl+r dans le dossier racine relance une analyse
auto_detect_windows_drives=yes

# Lors de l'ouverture du navigateur en mode inactif, préfère le dossier de travail actuel au dossier racine
# Le dossier de travail est de toute façon défini comme dossier "actuel", donc pendant la lecture le navigateur se positionnera automatiquement sur le dossier de travail actuel, même si cette option est réglée sur no
default_to_working_directory=no

# À l'ouverture du navigateur, préfère le dossier ouvert par une précédente instance de MPV du navigateur de fichiers
# Remplace l'option `default_to_working_directory`
# Nécessite que `save_last_opened_directory` soit à yes
# Utilise l'extension interne `last-opened-directory`
default_to_last_opened_directory=no

# Enregistre ou non le dernier dossier ouvert
save_last_opened_directory=no

# Lorsque le fichier en lecture change, déplace le curseur sur l'élément en cours de lecture (s'il y en a un)
cursor_follows_playing_item=no

####################################
########## paramètres de filtre ####
####################################

# N'affiche dans le navigateur que les fichiers compatibles avec mpv
filter_files=yes

# Par défaut, le navigateur de fichiers n'affiche que les fichiers compatibles avec mpv
# Les extensions de fichier ajoutées à cette liste seront ajoutées à la liste blanche des extensions
# Séparez avec le séparateur racine, sans utiliser d'espace
extension_whitelist=amv;bdmv;ifo;iso

# Les extensions de fichier ajoutées à cette liste désactiveront le type de fichier par défaut
# Cela remplace toutes les options de liste blanche ci-dessus et ci-dessous
#extension_blacklist=mpls

# Les extensions de fichier ajoutées à cette liste seront ajoutées à la liste blanche des extensions de pistes audio externes
# Séparez avec le séparateur racine, sans utiliser d'espace
audio_extensions=mka,dts,dtshd,dts-hd,truehd,true-hd,flac

# Les extensions de fichier ajoutées à cette liste seront ajoutées à la liste blanche des extensions de sous-titres
# Séparez avec le séparateur racine, sans utiliser d'espace
subtitle_extensions=etf,etf8,utf-8,idx,sub,srt,rt,ssa,ass,mks,vtt,sup,scc,smi,lrc,pgs

# Filtre les dossiers ou fichiers commençant par '.', comme .config
# Pour les systèmes linux
#filter_dot_dirs=no
#filter_dot_files=no

####################################
### paramètres de chargement des fichiers ###
####################################

# Cette option inverse le comportement du raccourci alt+ENTER
# Lorsque le raccourci est désactivé, le chargement automatique doit être activé pour les fichiers
# Lorsque le raccourci est activé, le chargement automatique des fichiers sera désactivé
autoload=no

# Active la récursion simultanée des dossiers lors de l'ajout d'éléments à la liste de lecture (expérimental), valeur par défaut : no
# Cette fonction offre un potentiel d'amélioration des performances considérable lorsqu'elle est combinée avec des extensions utilisant des E/S asynchrones
concurrent_recursion=yes

# Nombre maximal de récursions pouvant s'exécuter simultanément
# Si ce nombre est trop élevé, la file d'attente d'événements de mpv risque de déborder, ce qui peut entraîner l'abandon complet de certains dossiers, valeur par défaut : 16
max_concurrency=16

# Lors de l'ajout de fichiers locaux à la liste de lecture, remplace les barres obliques inversées par des barres obliques
# Peut être utile sur les systèmes Windows, valeur par défaut : no
substitute_backslash=no

# Si le chargement automatique est déclenché en sélectionnant le fichier en cours de lecture, la configuration « à regarder plus tard » du fichier actuel sera conservée avant fermeture et réouverture
# Lorsque cette option est désactivée, le fichier actuel ne redémarrera pas
autoload_save_current=yes

####################################
### paramètres d'analyse des dossiers ###
####################################

# Le cache de dossiers permet d'améliorer la vitesse de lecture des dossiers,
# activez cette fonction si le chargement des dossiers prend beaucoup de temps.
# Cela peut toutefois entraîner l'affichage de fichiers "fantômes" (supprimés mais toujours présents)
# ou empêcher l'affichage des fichiers récemment créés.
# Le cache n'est pas utilisé lors du rechargement du dossier avec Ctrl+r.
# Utilisez Ctrl+Shift+r pour forcer le vidage du cache.
cache=no

# Active l'extension interne `ls`, qui utilise la commande `ls` pour analyser les dossiers.
# Permet à l'analyse des dossiers de s'exécuter en parallèle, ce qui évite les ralentissements du navigateur.
# Cette fonction est automatiquement désactivée sur les systèmes Windows.
ls_parser=yes

# Lors de la remontée dans les dossiers, ne s'arrête pas sur un schéma de protocole vide, par exemple `ftp://`
# Par exemple, remonter depuis `ftp://localhost/` ira directement au dossier racine, plutôt qu'à `ftp://`
skip_protocol_schemes=yes

# Associe les chemins de lecteur des disques à leurs chemins de fichiers respectifs
# Par exemple, associe bd:// à la valeur de la propriété bluray-device
map_bd_device=yes
map_dvd_device=yes
map_cdda_device=yes

####################################
########## paramètres divers #######
####################################

# Active ou non l'utilisation des informations du script pour contrôler l'affichage du texte du logo sur l'écran de veille
toggle_idlescreen=no

# Sous Linux, la barre oblique inversée est un caractère valide dans un nom de fichier et ne doit pas être convertie
normalise_backslash=no

# Définit l'état d'ouverture actuel du navigateur dans le champ `file_browser/open` de la propriété `user-data`
# Cette propriété n'est disponible qu'à partir de mpv v0.36+
set_user_data=yes

# Définit l'état d'ouverture actuel du navigateur dans le champ `file_browser-open` de la propriété `shared-script-properties`
# Cette propriété est obsolète
set_shared_script_properties=no

####################################
########## substitutions de fichiers #########
####################################

# Dossier de chargement des modules externes
module_directory=~~/script-modules
addon_directory=~~/script-modules/file-browser-addons
custom_keybinds_file=~~/script-opts/file-browser-keybinds.json
last_opened_directory_file=~~/files/file_browser-last_opened_directory


####################################
######### paramètres de style ######
####################################

# Remplace le dossier personnel de l'utilisateur par "~/" dans le titre, via l'extension interne de label
home_label=yes

# Configure le navigateur de fichiers pour utiliser un alignement de texte spécifique (par défaut : en haut à gauche)
# Utilise la numérotation d'alignement des balises ASS : https://aegi.vmoe.info/docs/3.0/ASS_Tags/#index23h3
# Réglez sur 'auto' pour utiliser l'option d'alignement OSD par défaut de mpv
# Options : 'auto'|'top'|'center'|'bottom'
align_y=top
# Options : 'auto'|'left'|'center'|'right'
align_x=left

# Chaîne de format utilisée pour l'en-tête. Utilise les codes de remplacement des raccourcis personnalisés
# pour modifier dynamiquement le contenu de l'en-tête. Voir : docs/custom-keybinds.md#codes
# Par exemple, pour ajouter la numérotation des fichiers, réglez sur : {\fnMonospace}[%i/%x]{\fn<font_name_header or blank>} %q\N----------------------------------------------------
format_string_header=%q\N----------------------------------------------------

# Chaîne de format utilisée pour les enveloppes (wrappers). Prend en charge les codes de remplacement des raccourcis personnalisés, ainsi que deux codes supplémentaires : '%<' et '%>', qui affichent respectivement le nombre d'éléments avant et après la liste visible
# Définir ces options avec une chaîne vide désactive les enveloppes
format_string_topwrapper=%< éléments masqués\N
format_string_bottomwrapper=\N%> éléments restants

# Permet de personnaliser les icônes du curseur et des dossiers, avec des graphiques vectoriels ou des glyphes Unicode. L'exemple correspond au réglage par défaut (graphiques vectoriels)
#folder_icon={\p1}m 6.52 0 l 1.63 0 b 0.73 0 0.01 0.73 0.01 1.63 l 0 11.41 b 0 12.32 0.73 13.05 1.63 13.05 l 14.68 13.05 b 15.58 13.05 16.31 12.32 16.31 11.41 l 16.31 3.26 b 16.31 2.36 15.58 1.63 14.68 1.63 l 8.15 1.63{\p0}\h
#cursor_icon={\p1}m 14.11 6.86 l 0.34 0.02 b 0.25 -0.02 0.13 -0 0.06 0.08 b -0.01 0.16 -0.02 0.28 0.04 0.36 l 3.38 5.55 l 3.38 5.55 3.67 6.15 3.81 6.79 3.79 7.45 3.61 8.08 3.39 8.5l 0.04 13.77 b -0.02 13.86 -0.01 13.98 0.06 14.06 b 0.11 14.11 0.17 14.13 0.24 14.13 b 0.27 14.13 0.31 14.13 0.34 14.11 l 14.11 7.28 b 14.2 7.24 14.25 7.16 14.25 7.07 b 14.25 6.98 14.2 6.9 14.11 6.86{\p0}\h
#cursor_icon_flipped={\p1}m 0.13 6.86 l 13.9 0.02 b 14 -0.02 14.11 -0 14.19 0.08 b 14.26 0.16 14.27 0.28 14.21 0.36 l 10.87 5.55 l 10.87 5.55 10.44 6.79 10.64 8.08 10.86 8.5l 14.21 13.77 b 14.27 13.86 14.26 13.98 14.19 14.06 b 14.14 14.11 14.07 14.13 14.01 14.13 b 13.97 14.13 13.94 14.13 13.9 14.11 l 0.13 7.28 b 0.05 7.24 0 7.16 0 7.07 b 0 6.98 0.05 6.9 0.13 6.86{\p0}\h

# Définit l'opacité de la police (hexadécimal), de 00 (opaque) à FF (transparent)
font_opacity_selection_marker=99

# Utilise le gras pour l'en-tête
font_bold_header=yes

# Indique le facteur d'échelle du navigateur ; 2 double la taille, 0.5 la divise par deux, et ainsi de suite.
# L'en-tête et les enveloppes sont mis à l'échelle par rapport à la taille de base
scaling_factor_base=1
scaling_factor_header=1.4
scaling_factor_wrappers=0.64

# Nom de police personnalisé, vide par défaut
# Définir une police personnalisée pour le dossier/curseur peut corriger des icônes endommagées ou manquantes
#font_name_header=
font_name_body=Noto Sans Mono CJK SC
#font_name_wrappers=
#font_name_folder=
#font_name_cursor=

# Couleurs de police personnalisées
# les couleurs sont au format hexadécimal, dans l'ordre bleu-vert-rouge
# ce qui est l'inverse de l'ordre de la plupart des codes de couleur RGB
font_colour_header=00ccff
font_colour_body=ffffff
font_colour_wrappers=00ccff
font_colour_cursor=00ccff
font_colour_escape_chars=413eff

# Les options suivantes définissent les couleurs appliquées aux éléments de la liste selon leur état
font_colour_selected=fce788
font_colour_multiselect=fcad88
font_colour_playing=33ff66
font_colour_playing_multiselected=22b547
