####------Réglages du script-----####

##--Filtres disponibles : all, keybinds, groups, recents, distinct, protocols, fileonly, titleonly, timeonly, keywords.
##--Description des filtres : 'all' affiche tous les éléments. 'groups' affiche la liste filtrée sur les éléments ajoutés à un groupe quelconque. 'keybinds' affiche la liste filtrée sur les emplacements de raccourcis clavier. "recents" affiche les éléments récemment ajoutés au journal, sans doublon. "distinct" affiche la dernière entrée enregistrée pour les fichiers de chemins différents. "fileonly" affiche les fichiers enregistrés sans position temporelle. "timeonly" affiche les fichiers n'ayant qu'une position temporelle. "keywords" affiche les fichiers correspondant aux mots-clés définis dans la configuration. "playing" affiche la liste du fichier en cours de lecture.
##--Les filtres peuvent aussi être cumulés avec %+%, ou exclus avec %-%. Par exemple : "groups%+%keybinds" n'affiche que les groupes et les raccourcis clavier, "all%-%groups%-%keybinds" affiche tous les éléments sans groupe et sans raccourci clavier.
##--Il est également possible d'appeler un groupe défini avec /:group%Group Name%

#--Exécuter automatiquement la liste à l'ouverture de mpv lorsqu'aucune vidéo/fichier n'est chargé. 'none' pour désactiver. Ou choisir parmi les filtres disponibles : all, keybinds, recents, distinct, protocols, fileonly, titleonly, timeonly, keywords.
auto_run_list_idle=none

#--(0/#number). Charge au démarrage de mpv l'entrée enregistrée correspondant à son numéro. -1 pour l'entrée la plus ancienne. 1 pour la plus récente. Un nombre, par exemple : 13, pour charger une entrée précise. 0 pour désactiver
load_item_on_startup=0

#--Masquer le message de l'écran de veille de l'OSC à l'ouverture et à la fermeture du menu (si plusieurs scripts déclenchent la désactivation de cet écran de veille, le comportement peut être inattendu). Par défaut : yes
toggle_idlescreen=no

#--Mettre 0 pour que l'élément reprenne exactement à la position enregistrée, ou diminuer la valeur pour disposer d'un peu de contexte avant le point de reprise
resume_offset=-1

#--yes pour afficher un message OSD lorsqu'une action a lieu. Mettre no désactive tous les messages OSD générés par ce script
osd_messages=yes

#--Lors d'une tentative de chargement d'un signet alors qu'aucune vidéo/fichier n'est chargé, mpv se rend à votre dernier signet
bookmark_loads_last_idle=yes

#--Lors d'une tentative d'ajout d'un signet fichier seul alors qu'aucune vidéo/fichier n'est chargé, mpv se rend à votre dernier signet sans restaurer la progression
bookmark_fileonly_loads_last_idle=yes

#--yes pour marquer l'instant du signet comme chapitre. no désactive le marquage comme chapitre
mark_bookmark_as_chapter=yes

#--Raccourci clavier utilisé pour enregistrer la vidéo et sa progression dans le fichier journal des signets
##! Attention : ce raccourci écrase la même touche dans input.conf, il est conseillé de le laisser vide et de définir cette fonction dans input.conf
bookmark_save_keybind=[""]

#--Raccourci clavier utilisé pour enregistrer uniquement la vidéo dans le fichier journal des signets
##! Attention : ce raccourci écrase la même touche dans input.conf, il est conseillé de le laisser vide et de définir cette fonction dans input.conf
bookmark_fileonly_keybind=[""]

#--Raccourci clavier utilisé pour ouvrir la liste avec le filtre indiqué. Filtres disponibles : "all", "keybinds", "recents", "distinct", "protocols", "fileonly", "titleonly", "timeonly", "keywords". Il est aussi possible d'appeler un groupe défini avec /:group%Group Name%
##! Attention : ce raccourci écrase la même touche dans input.conf, il est conseillé de le laisser vide et de définir cette fonction dans input.conf
open_list_keybind=[ ["", "recents"], ["", "keybinds"] ]

#--Raccourcis clavier dynamiques, utilisés lorsque la liste est ouverte pour aller à un filtre précis (une double pression sur la touche du filtre ferme également la liste). Filtres disponibles : "all", "keybinds", "recents", "distinct", "protocols", "fileonly", "titleonly", "timeonly", "keywords".
list_filter_jump_keybind=[ ["a", "all"], ["k", "keybinds"], ["r", "recents"], ["d", "distinct"], ["f", "fileonly"], ["p", "protocols"], ["t", "titleonly"], ["l", "playing"], ["!", "/:group%Séries TV%"], ["@", "/:group%Films%"], ["SHARP", "/:group%Animation%"], ["$", "/:group%Films d'animation%"], ["%", "/:group%Bonus animation%"], ["r", "recents"], ["R", "recents"], ["d", "distinct"], ["D", "distinct"], ["f", "fileonly"], ["F", "fileonly"] ]

####------Réglages des emplacements de raccourcis-------####

#--Lors de l'enregistrement rapide d'un signet dans un emplacement de raccourci, la position n'est pas enregistrée
keybinds_quicksave_fileonly=yes

#--Si l'emplacement de raccourci est vide, ceci active le signet rapide et son ajout à l'emplacement ; sinon, le raccourci est attribué depuis la liste des signets ou par enregistrement rapide
keybinds_empty_auto_create=no

#--Lors de la création automatique d'un emplacement de raccourci, la position n'est pas enregistrée
keybinds_empty_fileonly=yes

#--Au chargement d'un emplacement de raccourci, la reprise se fait automatiquement à l'instant du signet
keybinds_auto_resume=yes

#--Raccourci clavier utilisé pour lier un élément de la liste à une touche, et pour charger cette touche. Par exemple : appuyer sur Alt+1 à la position du curseur dans la liste pour l'ajouter, puis appuyer sur Alt+1 liste masquée pour charger l'élément lié à alt+1. (Un nouvel emplacement est créé automatiquement pour chaque raccourci, par exemple : ..'Alt+9, Alt+0'. où alt+0 crée un 10e emplacement)
##! Attention : ce raccourci écrase la même touche dans input.conf
keybinds_add_load_keybind=[""]

#--Pour enregistrer un raccourci dans un emplacement sans ouvrir la liste ; pour charger ces raccourcis, keybinds_add_load_keybind est utilisé
##! Attention : ce raccourci écrase la même touche dans input.conf
keybinds_quicksave_keybind=[""]

#--Raccourci clavier utilisé lorsque la liste est ouverte, pour supprimer l'emplacement de raccourci à la position du curseur
keybinds_remove_keybind=["alt+-"]

#--Raccourci clavier utilisé lorsque la liste est ouverte, pour supprimer les emplacements de raccourcis des éléments mis en évidence
keybinds_remove_highlighted_keybind=["alt+_"]

####------Réglages des groupes-------####

#--Définit les groupes attribuables aux signets, avec éventuellement un raccourci clavier permettant de placer un signet dans le groupe correspondant lorsque la liste est ouverte. Vous pouvez aussi utiliser list_group_add_cycle_keybind pour affecter un élément à un groupe
groups_list_and_keybind=[ ["Séries TV", "ctrl+1", "ctrl+!"], ["Films", "ctrl+2", "ctrl+@"], ["Animation", "ctrl+3", "ctrl+#"], ["Films d'animation", "ctrl+4", "ctrl+$"], ["Bonus animation", "ctrl+5"] ]

#--Raccourci clavier utilisé lorsque la liste est ouverte, pour supprimer le groupe à la position du curseur
list_groups_remove_keybind=["ctrl+-"]

#--Raccourci clavier utilisé lorsque la liste est ouverte, pour supprimer les groupes des éléments mis en évidence
list_groups_remove_highlighted_keybind=["ctrl+_"]

#--Raccourci clavier pour ajouter un élément à un groupe. Lorsque la liste est ouverte, il parcourt en boucle tous les groupes disponibles
list_group_add_cycle_keybind=["ctrl+g"]

#--Raccourci clavier pour ajouter les éléments mis en évidence à un groupe. Lorsque la liste est ouverte, il parcourt en boucle tous les groupes disponibles
list_group_add_cycle_highlighted_keybind=["ctrl+G"]

####------Réglages de la journalisation------####

#--Indique le chemin d'enregistrement du fichier journal des signets. Mettre '/:dir%script%' pour le placer dans le même dossier que le script, ou '/:dir%mpvconf%' pour le placer dans le dossier portable_config de mpv.
##Ou utiliser '/:var' pour écrire n'importe quelle variable, puis la variable '/:var%APPDATA%' ; vous pouvez aussi indiquer un chemin, par exemple : '/:var%APPDATA%\mpv' ou '/:var%HOME%/mpv', ou encore un chemin absolu, par exemple : 'C:\Users\Eisa01\Desktop\'
log_path=/:dir%mpvconf%/files

#--Nom + extension du fichier utilisé pour stocker les données du journal
log_file=mpvBookmark.log

#--Choisir le type d'enregistrement du titre du média parmi 'all', 'protocols', 'local', 'none'. Cette option stocke le titre du média dans le fichier journal, ce qui est utile pour les sites web/protocoles dont le titre ne peut pas être déduit du seul lien
file_title_logging=protocols

#--Ajoutez ci-dessous (après la virgule) les protocoles dont vous souhaitez stocker le titre dans le fichier journal. Valable uniquement pour (file_title_logging = "protocols" or file_title_logging = "all")
logging_protocols=["://", "magnet:"]

#--Limite le nombre d'entrées enregistrées pour un même chemin : -1 pour aucune limite, 0 met toujours à jour l'entrée du même chemin, une valeur comme 3 limite à 3 entrées, la 4e venant mettre à jour la plus ancienne
same_entry_limit=-1

#--Indique s'il faut conserver le groupe/l'emplacement ou toute autre propriété lors de l'écrasement d'une entrée. Par défaut : yes
overwrite_preserve_properties=yes

####------Réglages de la liste-------####

#--Indique s'il faut activer le défilement circulaire du curseur
loop_through_list=yes

#--Indique s'il faut afficher de nouveaux éléments une fois le milieu de la liste atteint
list_middle_loader=yes

#--Active ou non les raccourcis de sélection dynamique, de 0 à 9, pour choisir rapidement une entrée lorsque la liste est ouverte (list_show_amount = 10 est la valeur maximale pour que cette fonction marche)
quickselect_0to9_keybind=yes

#--Active ou non la fermeture de la liste par double appui sur la touche de la liste principale, même si la liste a été ouverte via un autre filtre
main_list_keybind_twice_exits=yes

#--Passe intelligemment la recherche en mode sans saisie (quand le champ de recherche est ouvert), sans avoir à appuyer sur ctrl+entrée
search_not_typing_smartly=yes

#--'any' pour rechercher la saisie dans la combinaison date, titre, chemin/URL et heure. 'any-notime' recherche la saisie dans la combinaison date, titre et chemin/URL, mais pas l'heure (afin de réduire les résultats indésirables)
search_behavior=any

####------Réglages des filtres-------####

#--Filtres vers lesquels sauter, dans l'ordre affiché lors de la navigation avec les touches gauche/droite. Vous pouvez modifier l'ordre et supprimer les filtres inutiles
filters_and_sequence=["all", "keybinds", "groups", "/:group%Séries TV%", "/:group%Films%", "/:group%Animation%", "/:group%Films d'animation%", "/:group%Bonus animation%", "protocols", "fileonly", "titleonly", "timeonly", "playing", "keywords", "recents", "distinct", "keybinds%+%groups", "all%-%groups%-%keybinds"]

#--Raccourci clavier utilisé pour passer au filtre disponible suivant selon filters_and_sequence
next_filter_sequence_keybind=["RIGHT", "MBTN_FORWARD"]

#--Raccourci clavier utilisé pour passer au filtre disponible précédent selon filters_and_sequence
previous_filter_sequence_keybind=["LEFT", "MBTN_BACK"]

#--Active ou non le parcours circulaire des filtres
loop_through_filters=yes

#--Créez le filtre "keywords" de votre choix, par exemple : youtube.com filtrera les vidéos provenant de YouTube. Vous pouvez aussi indiquer une partie du nom de fichier ou du titre, une extension, ou un chemin complet ou partiel. Par exemple : ["youtube.com", "mp4", "naruto", "c:\\users\\eisa01\\desktop"]. Laisser vide désactive le filtre par mots-clés
keywords_filter_list=[]

####------Réglages du tri-------####
##--Tris disponibles : added-asc pour afficher d'abord les éléments ajoutés le plus récemment. Ou added-desc pour respecter l'ordre d'ajout. Ou alphanum-asc pour la méthode de A à Z, noms de fichiers et numéros d'épisode les plus faibles en premier. Ou alphanum-desc pour la méthode inverse, de Z à A. Ou time-asc, time-desc pour trier la liste selon le temps

#--Indique la méthode de tri par défaut pour tous les filtres de la liste. Choix possibles : added-asc, added-desc, time-asc, time-desc, alphanum-asc, alphanum-desc
list_default_sort=added-asc

#--Indique le tri par défaut de filtres particuliers, par exemple : [ ["all", "alphanum-asc"], ["playing", "added-desc"] ]
list_filters_sort=[ ["keybinds", "keybind-asc"], ["fileonly", "alphanum-asc"], ["playing", "time-asc"] ]

#--Raccourci clavier pour parcourir les différents tris disponibles lorsque la liste est ouverte
list_cycle_sort_keybind=["alt+s"]

####------Réglages de l'apparence de la liste------####

#--Indique l'alignement de la liste, à choisir de 1 à 9 selon la disposition du pavé numérique, ou 0 pour désactiver. Par exemple : 7 en haut à gauche, 8 en haut au centre, 9 en haut à droite
list_alignment=7

#--Indique s'il faut tronquer les noms de fichiers longs au nombre de caractères précisé ci-dessous
slice_name=yes

#--Nombre de caractères utilisé pour tronquer les noms de fichiers longs
slice_name_amount=80

#--Augmentez le nombre maximal pour afficher davantage d'éléments dans la liste courante
list_show_amount=10

#--Indique le format des éléments à l'ouverture de la liste
#--Variables disponibles : %quickselect%, %number%, %name%, %title%, %path%, %duration%, %length%, %remaining%, %dt%, %dt_"format%"%
#--Description des variables : %quickselect% : raccourci de sélection rapide. %number% : numéro d'ordre de l'élément. %name% : nom du fichier. %title% : titre du fichier. %path% : chemin du fichier ou URL. %duration% : position de lecture atteinte par l'élément. %length% : durée totale de l'élément. %remaining% : temps de lecture restant de l'élément. %dt% : date et heure de l'enregistrement.
#--Il est aussi possible d'utiliser %dt_"format%"%" selon le format de date lua (https://www.lua.org/pil/22.1.html). Il se précise après dt_ .. Exemple : (%dt_%a% %dt_%b% %dt_%y%) pour jour, mois et année abrégés
list_content_text=%number%. %name%%0_duration%%duration%%0_keybind%%keybind%%0_group%%group%%1_group%\h\N\N

#--Variables définies par l'utilisateur, affichées uniquement lorsque la variable associée est déclenchée
#--#_group, #_keybind, #_duration, #_length, #_remaining, #_dt. (# variables définies par l'utilisateur, affichées uniquement lorsque la variable associée est déclenchée : "0_keybind", "1_keybind")
list_content_variables=[ ["0_duration", " 🕒 "], ["0_keybind", " ⌨ "], ["0_group", " 🖿 "] ]

#--Indique le style du texte signalant qu'il y a d'autres éléments au-dessus. \n pour un saut de ligne. \h pour un espace
list_sliced_prefix=...\h\N

#--Indique le style du texte signalant qu'il y a d'autres éléments en dessous
list_sliced_suffix=...

#--Indique la couleur du texte de la liste, en hexadécimal BGR
text_color=ffffff

#--Taille de police du texte de la liste
text_scale=80

#--Épaisseur du contour noir du texte de la liste
text_border=0.5

#--Couleur du texte à la position du curseur, en hexadécimal BGR
text_cursor_color=ffbf7f

#--Taille de police du texte à la position actuelle du curseur dans la liste
text_cursor_scale=90

#--Épaisseur du contour noir du texte à la position actuelle du curseur dans la liste
text_cursor_border=0.7

#--Texte précédant les éléments mis en évidence lors d'une sélection multiple
text_highlight_pre_text=✅ 

#--Couleur du champ de recherche en mode saisie
search_color_typing=00bfff

#--Couleur du champ de recherche lorsqu'il est actif mais hors mode saisie
search_color_not_typing=ffffaa

#--Couleur du titre de la liste, en hexadécimal BGR
header_color=ffffaa

#--Taille du texte du titre de la liste
header_scale=100

#--Épaisseur du contour noir du titre de la liste
header_border=0.6

#--Texte à afficher comme titre de la liste
#--Variables d'en-tête disponibles : %cursor%, %total%, %highlight%, %filter%, %search%, %duration%, %length%, %remaining%.
#--Description des variables : %cursor% : position du curseur dans la liste. %total% : nombre total d'éléments de la liste courante. %highlight% : nombre total d'éléments mis en évidence. %filter% : nom du filtre, %search% : texte de recherche saisi. %duration% : temps de lecture cumulé de tous les éléments affichés. %length% : durée totale cumulée des fichiers de tous les éléments affichés. %remaining% : temps de lecture restant cumulé des fichiers de tous les éléments affichés
header_text=🔖 Menu des signets [%cursor%/%total%]%0_highlight%%highlight%%0_filter%%filter%%1_filter%%0_sort%%sort%%1_sort%%0_search%%search%%1_search%\h\N\N

#--Variables définies par l'utilisateur, affichées uniquement lorsque la variable associée est déclenchée
#--#_filter, #_sort, #_highlight, #_search, #_duration, #_length%, #_remaining. (# indique la possibilité de créer plusieurs variables avec des numéros différents, par exemple : "0_filter", "1_filter")
header_variables=[ ["0_highlight", "✅"], ["0_filter", " [Filter: "], ["1_filter", "]"], ["0_sort", " \\{"], ["1_sort", "}"], ["0_search", "\\h\\N\\N[Search="], ["1_search", "..]"] ]

#--Indique la méthode de tri masquée dans l'en-tête lors de l'utilisation de la variable %sort%
header_sort_hide_text=added-asc


####-----Réglages du format de l'heure-----####
##--Dans le premier paramètre, vous pouvez choisir parmi les styles disponibles : default, hms, hms-full, timestamp, timestamp-concise. "default" affiche au format HH:MM:SS.sss. "hms" affiche au format 1h 2m 3.4s. "hms-full" est identique à hms, mais reste constant quand les heures et les minutes valent 0. "timestamp" affiche le temps total sous forme d'horodatage au format 123456.700. "timestamp-concise" affiche le temps total au format 123456.7 (les décimales sont affichées ou masquées selon les besoins).
##--Dans le deuxième paramètre, vous pouvez choisir d'afficher les millisecondes, de les arrondir ou de les tronquer. Options disponibles : 'truncate' supprime les millisecondes et conserve les secondes. 0 supprime les millisecondes et arrondit les secondes. 1 ou plus correspond au nombre de millisecondes à afficher. La valeur par défaut est 3 millisecondes.
##--Dans le troisième paramètre, vous pouvez définir le séparateur entre hour:minute:second (heures:minutes:secondes). Le style "default" utilise automatiquement ":", "hms" et "hms-full" utilisent automatiquement " ". Vous pouvez définir le vôtre. Quelques exemples : ["default", 3, "-"], ["hms-full", 5, "."], ["hms", "truncate", ":"], ["timestamp-concise"], ["timestamp", ["timestamp", 0], ["timestamp", "truncate"], ["timestamp", 5]

osd_time_format=["default", "truncate"]
list_duration_time_format=["default", "truncate"]
list_length_time_format=["default", "truncate"]
list_remaining_time_format=["default", "truncate"]
header_duration_time_format=["hms", "truncate", ":"]
header_length_time_format=["hms", "truncate", ":"]
header_remaining_time_format=["hms", "truncate", ":"]

####------Réglages des raccourcis de la liste------####
#--Ajoutez ci-dessous (après la virgule) tout autre raccourci clavier à associer. Ou modifiez la lettre entre guillemets pour changer le raccourci
#--Exemples de modification et d'ajout de raccourcis : --de ["b", "B"] à ["b"]. --de [""] à ["alt+b"]. --de [""] à ["a" "ctrl+a", "alt+a"]

#--Raccourci clavier utilisé pour naviguer vers le haut dans la liste
list_move_up_keybind=["UP", "WHEEL_UP"]

#--Raccourci clavier utilisé pour naviguer vers le bas dans la liste
list_move_down_keybind=["DOWN", "WHEEL_DOWN"]

#--Raccourci clavier utilisé pour aller au premier élément de la page affichée dans la liste
list_page_up_keybind=["PGUP"]

#--Raccourci clavier utilisé pour aller au dernier élément de la page affichée dans la liste
list_page_down_keybind=["PGDWN"]

#--Raccourci clavier utilisé pour aller au premier élément de la liste
list_move_first_keybind=["HOME"]

#--Raccourci clavier utilisé pour aller au dernier élément de la liste
list_move_last_keybind=["END"]

#--Raccourci clavier pour mettre en évidence pendant la navigation : maintenez shift, puis appuyez sur n'importe quelle touche de navigation, par exemple : up, down, home, pgdwn, etc.
list_highlight_move_keybind=["SHIFT"]

#--Raccourci clavier utilisé pour mettre en évidence tous les éléments affichés dans la liste
list_highlight_all_keybind=["ctrl+a"]

#--Raccourci clavier utilisé pour retirer la mise en évidence de tous les éléments de la liste
list_unhighlight_all_keybind=["ctrl+d"]

#--Raccourci clavier utilisé pour charger l'entrée à la position du curseur
list_select_keybind=["ENTER", "MBTN_MID"]

#--Raccourci clavier utilisé pour ajouter à la liste de lecture l'entrée à la position du curseur
list_add_playlist_keybind=["CTRL+ENTER"]

#--Raccourci clavier utilisé pour ajouter à la liste de lecture toutes les entrées mises en évidence
list_add_playlist_highlighted_keybind=["SHIFT+ENTER"]

#--Raccourci clavier utilisé pour fermer la liste (si la recherche est ouverte, elle est fermée en premier)
list_close_keybind=["ESC", "MBTN_RIGHT"]

#--Raccourci clavier utilisé pour supprimer l'entrée à la position du curseur
list_delete_keybind=["DEL"]

#--Raccourci clavier utilisé pour supprimer de la liste toutes les entrées mises en évidence
list_delete_highlighted_keybind=["SHIFT+DEL"]

#--Raccourci clavier utilisé pour déclencher la recherche
list_search_activate_keybind=["ctrl+f"]

#--Raccourci clavier utilisé pour quitter le mode saisie de la recherche tout en la gardant ouverte
list_search_not_typing_mode_keybind=["ALT+ENTER"]

#--Raccourcis clavier ignorés lorsque la liste est ouverte
list_ignored_keybind=[""]
