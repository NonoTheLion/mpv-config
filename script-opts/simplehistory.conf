####------Paramètres du script-----####

#--Exécute automatiquement la liste à l'ouverture de mpv si aucune vidéo/fichier n'est chargé. 'none' désactive la fonction. Ou choisissez parmi : all, recents, distinct, protocols, fileonly, titleonly, timeonly, keywords.
auto_run_list_idle=none

#--Comportement au démarrage de mpv lorsque rien n'est chargé. 'none' désactive la fonction. 'resume' reprend automatiquement le dernier élément lu. 'resume-notime' reprend le dernier élément lu, mais depuis le début
startup_idle_behavior=none

#--Masque le message d'écran de veille OSC à l'ouverture et à la fermeture du menu (si plusieurs scripts déclenchent la désactivation de l'écran de veille OSC, cela peut provoquer un comportement inattendu)
toggle_idlescreen=no

#--Mettez à 0 pour que l'élément reprenne exactement à la position sauvegardée, ou réduisez la valeur pour obtenir un aperçu avant le point de reprise
resume_offset=-10

#--yes pour afficher un message OSD à chaque action. Mettez sur no pour désactiver tous les messages OSD générés par ce script
osd_messages=yes

#--none : désactive la fonction. notification : déclenche un message pour reprendre au dernier point atteint. force : force la reprise de la dernière lecture selon le seuil défini
resume_option=none

#--0 déclenche toujours l'option de reprise si la même vidéo a déjà été lue ; une valeur (par exemple 5) ne déclenchera l'option de reprise que si la dernière lecture a commencé après 5 % de la vidéo et s'est terminée avant les 5 % restants
resume_option_threshold=5

#--yes pour marquer les moments de l'historique comme chapitres. no désactive ce marquage en chapitres
mark_history_as_chapter=no

#--yes : inverse la liste noire en liste blanche, afin que les éléments (chemins/URL, etc.) ajoutés à history_blacklist soient les seuls enregistrés dans l'historique
invert_history_blacklist=no

#--Définit la liste noire : chemins / URL / sites web / fichiers / protocoles / extensions ; les types ou chemins figurant dans la liste noire ne seront pas ajoutés à l'historique
##Par exemple : ["c:\\users\\eisa01\\desktop", "c:\\users\\eisa01\\desktop\\*", "c:\\temp\\naruto-01.mp4", "youtube.com", "https://dailymotion.com/", "avi", "https://www.youtube.com/watch?v=e8YBesRKq_U", ".jpeg", "magnet:", "https://", "ftp"]
history_blacklist=[""]

#--Raccourci clavier permettant de charger et reprendre immédiatement le dernier élément lorsqu'aucune vidéo n'est en lecture. Si une vidéo est en cours de lecture, elle reprendra à la dernière position trouvée
##! Attention : ce raccourci écrasera la même touche définie dans input.conf, il est recommandé de le laisser vide ici et de configurer cette fonction dans input.conf
history_resume_keybind=[""]

#--Raccourci clavier permettant de charger immédiatement le dernier élément sans reprise lorsqu'aucune vidéo n'est en lecture. Si une vidéo est en cours de lecture, l'élément sera ajouté à la liste de lecture
##! Attention : ce raccourci écrasera la même touche définie dans input.conf, il est recommandé de le laisser vide ici et de configurer cette fonction dans input.conf
history_load_last_keybind=[""]

#--Raccourci clavier permettant d'ouvrir la liste avec le filtre spécifié. Filtres disponibles : "all", "recents", "distinct", "protocols", "fileonly", "titleonly", "timeonly", "keywords".
##! Attention : ce raccourci écrasera la même touche définie dans input.conf, il est recommandé de le laisser vide ici et de configurer cette fonction dans input.conf
open_list_keybind=[ ["", "distinct"], ["", "recents"] ]

#--Raccourci clavier dynamique utilisé, lorsque la liste est ouverte, pour aller directement à un filtre donné (permet aussi de fermer la liste en appuyant deux fois sur le raccourci du filtre). Filtres disponibles : "all", "recents", "distinct", "protocols", "fileonly", "titleonly", "timeonly", "keywords".
list_filter_jump_keybind=[ ["a", "all"], ["r", "recents"], ["d", "distinct"], ["f", "fileonly"], ["p", "protocols"], ["t", "titleonly"], ["l", "playing"] ]

####------Paramètres du mode incognito-----####

#--Indique si le mode incognito doit démarrer automatiquement au lancement de MPV
auto_run_incognito_mode=no

#--yes : supprime automatiquement de l'historique les fichiers lus alors que le mode incognito était actif, no : conserve dans l'historique les fichiers lus en mode incognito
delete_incognito_entry=yes

#--"none" désactive la fonction, "deleted-restore" restaure automatiquement les fichiers supprimés en entrant en mode incognito, "always" met toujours à jour immédiatement l'entrée de l'historique après la sortie du mode incognito
restore_incognito_entry=always

#--Raccourci clavier déclenchant le mode incognito. Une fois activé, les fichiers lus ne seront pas ajoutés à l'historique tant que ce mode n'est pas désactivé
##! Attention : ce raccourci écrasera la même touche définie dans input.conf, il est recommandé de le laisser vide ici et de configurer cette fonction dans input.conf
history_incognito_mode_keybind=[""]

####------Paramètres de journalisation------####

#--Indique le chemin d'enregistrement du fichier journal des signets. Remplacez par '/:dir%script%' pour le placer dans le même dossier que le script, ou par '/:dir%mpvconf%' pour le placer dans le dossier portable_config de mpv.
##Ou utilisez '/:var' suivi du nom d'une variable, par exemple '/:var%APPDATA%' ; vous pouvez aussi utiliser des chemins comme '/:var%APPDATA%\mpv' ou '/:var%HOME%/mpv', ou indiquer un chemin absolu, par exemple : 'C:\Users\Eisa01\Desktop\'
log_path=/:dir%mpvconf%/files

#--Nom + extension du fichier utilisé pour stocker les données du journal
log_file=mpvHistory.log

#--Format de date dans le journal (voir le format de date Lua), par exemple : "%d/%m/%y %X" ou "%d/%b/%y %X"
date_format=%A/%B %d/%m/%Y %X

#--Choisissez parmi all, protocols, none le type de titres de média à enregistrer. Cette option stocke le titre du média dans le fichier journal, ce qui est utile pour les sites web/protocoles car le titre ne peut pas être déduit uniquement du lien
file_title_logging=protocols

#--Ajoutez ci-dessous (après la virgule) tout protocole dont vous voulez que le titre soit stocké dans le fichier journal. Ceci n'a d'effet que si (file_title_logging = "protocols" ou file_title_logging = "all")
logging_protocols=["://", "magnet:"]

#--Indique dans quels cas afficher le nom de fichier plutôt que le titre. Choisissez entre local, protocols, all et none
##"local" privilégie le nom de fichier pour les vidéos sans protocole. "protocols" privilégie le nom de fichier uniquement pour les protocoles. "all" utilise toujours le nom de fichier plutôt que le titre. "none" utilise toujours le titre plutôt que le nom de fichier
prefer_filename_over_title=local

#--Limite le nombre d'entrées enregistrées pour un même chemin : -1 pour aucune limite, 0 met toujours à jour l'entrée du même chemin ; par exemple la valeur 3 limitera à 3 entrées, puis mettra à jour les anciennes valeurs à partir de la 4e entrée
same_entry_limit=2

####------Paramètres de la liste-------####

#--Définit si le défilement en boucle du curseur est activé
loop_through_list=yes

#--Définit si l'affichage se met à jour pour montrer de nouveaux éléments une fois le milieu de la liste atteint
list_middle_loader=yes

#--Affiche le chemin du fichier plutôt que le titre du média
show_paths=no

#--Affiche le numéro de chaque élément avant son nom et sa valeur
show_item_number=yes

#--Définit si les noms de fichiers longs doivent être tronqués selon le nombre de caractères indiqué ci-dessous
slice_longfilenames=yes

#--Nombre de caractères utilisé pour tronquer les noms de fichiers longs
slice_longfilenames_amount=80

#--Modifiez ce nombre maximal pour afficher plus d'éléments dans la liste actuelle
list_show_amount=10

#--Active ou non les raccourcis de sélection rapide, entrées de 0 à 9, pour sélectionner rapidement un élément lorsque la liste est ouverte (list_show_amount = 10 est la valeur maximale pour que cette fonction fonctionne)
quickselect_0to9_keybind=yes

#--Active ou non la fermeture de la liste en appuyant deux fois sur le raccourci de la liste principale, même si la liste a été ouverte via un autre filtre
main_list_keybind_twice_exits=yes

#--Bascule intelligemment la recherche en mode « sans saisie » (quand la boîte de recherche est ouverte) sans avoir besoin d'appuyer sur ctrl+entrée
search_not_typing_smartly=yes

#--"specific" recherche une correspondance exacte parmi la date, le titre, le chemin/URL, l'heure. "any" recherche le texte saisi dans la combinaison date, titre, chemin/URL et heure. "any-notime" recherche le texte saisi dans la combinaison date, titre et chemin/URL, mais pas dans l'heure (afin de réduire les résultats indésirables)
search_behavior=any

####------Paramètres des filtres-------####
##--Filtres disponibles : "all" pour afficher tous les éléments. Ou "keybinds" pour afficher la liste filtrée par emplacement de raccourci clavier. Ou "recents" pour afficher les éléments récemment ajoutés à enregistrer sans doublon. Ou "distinct" pour afficher la dernière entrée enregistrée pour chaque chemin distinct.
##Ou "fileonly" pour afficher les fichiers enregistrés sans horodatage. Ou "timeonly" pour afficher uniquement les fichiers avec horodatage. Ou "keywords" pour afficher les fichiers correspondant aux mots-clés définis dans la configuration. Ou "playing" pour afficher la liste du fichier en cours de lecture.

#--Bascule vers les filtres suivants, dans l'ordre affiché, lors de la navigation avec les touches gauche/droite. Vous pouvez modifier l'ordre et supprimer les filtres non désirés
filters_and_sequence=["all", "recents", "distinct", "protocols", "playing", "fileonly", "titleonly", "keywords"]

#--Raccourci clavier permettant de passer au filtre disponible suivant selon filters_and_sequence
next_filter_sequence_keybind=["RIGHT", "MBTN_FORWARD"]

#--Raccourci clavier permettant de passer au filtre disponible précédent selon filters_and_sequence
previous_filter_sequence_keybind=["LEFT", "MBTN_BACK"]

#--Active ou non le parcours en boucle des filtres
loop_through_filters=yes

#--Créez un filtre pour "keywords" avec les mots voulus, par exemple : youtube.com filtrera les vidéos de YouTube. Vous pouvez aussi indiquer une partie du nom de fichier ou du titre, une extension, ou un chemin complet/partiel. Exemple : ["youtube.com", "mp4", "naruto", "c:\\users\\eisa01\\desktop"]. Laissez vide pour désactiver le filtre par mots-clés
keywords_filter_list=["youtube.com"]

####------Paramètres de tri-------####
##--Tris disponibles : added-asc pour afficher en premier les éléments les plus récemment ajoutés. Ou added-desc pour afficher dans l'ordre d'ajout. Ou alphanum-asc pour un tri de A à Z, en tenant compte des noms de fichiers et des numéros d'épisode. Ou alphanum-desc pour le tri inverse, de Z à A. Ou time-asc, time-desc pour trier la liste selon l'heure

#--Indique la méthode de tri par défaut pour tous les filtres de la liste. Choix possibles : added-asc, added-desc, time-asc, time-desc, alphanum-asc, alphanum-desc
list_default_sort=added-asc

#--Indique le tri par défaut pour un filtre spécifique, par exemple : [ ["all", "alphanum-asc"], ["playing", "added-desc"] ]
list_filters_sort=[ ["keybinds", "keybind-asc"], ["fileonly", "alphanum-asc"], ["playing", "time-asc"] ]

#--Raccourci clavier permettant de parcourir en boucle les différents tris disponibles lorsque la liste est ouverte
list_cycle_sort_keybind=["alt+s"]

####------Paramètres d'apparence de la liste------####

#--Indique l'alignement de la liste, en choisissant une position de pavé numérique de 1 à 9, ou 0 pour désactiver. Par exemple : 7 pour un alignement en haut à gauche, 8 en haut au centre, 9 en haut à droite
list_alignment=7

#--Type de temps affiché pour les éléments de la liste. Choix : duration, length, remaining.
text_time_type=duration

#--Indique le style du séparateur affiché avant l'heure enregistrée
time_seperator= 🕒 

#--Indique le style du texte signalant qu'il y a d'autres éléments au-dessus. \n sert pour un retour à la ligne. \h représente une espace
list_sliced_prefix=...\h\N

#--Indique le style du texte signalant qu'il y a d'autres éléments en dessous
list_sliced_suffix=...

#--yes active le texte préfixe affichant les raccourcis de sélection rapide avant la liste. no désactive
quickselect_0to9_pre_text=no

#--Indique la couleur du texte de la liste, en hexadécimal BGR
text_color=ffffff

#--Taille de police du texte de la liste
text_scale=80

#--Taille du contour noir du texte de la liste
text_border=0.5

#--Couleur du texte à la position du curseur, en hexadécimal BGR
text_cursor_color=ffbf7f

#--Taille de police du texte à la position actuelle du curseur dans la liste
text_cursor_scale=90

#--Taille du contour noir du texte à la position actuelle du curseur dans la liste
text_cursor_border=0.7

#--Texte préfixe des éléments sélectionnés en multi-sélection
text_highlight_pre_text=✅ 

#--Couleur de la boîte de recherche en mode saisie
search_color_typing=ffffaa

#--Couleur de la boîte de recherche lorsqu'elle est active et hors mode saisie
search_color_not_typing=00bfff

#--Couleur du titre de la liste, en hexadécimal BGR
header_color=00bfff

#--Taille du texte du titre de la liste
header_scale=100

#--Taille du contour noir du titre de la liste
header_border=0.6

#--Texte à afficher comme titre de la liste
#--Variables d'en-tête disponibles : %cursor%, %total%, %highlight%, %filter%, %search%, %listduration%, %listlength%, %listremaining%
#--Texte défini par l'utilisateur, affiché uniquement quand la variable correspondante est déclenchée : %prefilter%, %afterfilter%, %prehighlight%, %afterhighlight% %presearch%, %aftersearch%, %prelistduration%, %afterlistduration%, %prelistlength%, %afterlistlength%, %prelistremaining%, %afterlistremaining%
#--Description des variables : %cursor affiche la position du curseur dans la liste. %total : nombre total d'éléments dans la liste actuelle. %highlight% : nombre total d'éléments sélectionnés. %filter : affiche le nom du filtre, %search : affiche le texte de recherche saisi. Exemple de texte utilisateur affiché uniquement quand la variable correspondante est déclenchée : %prefilter affiche le texte défini par l'utilisateur avant le filtre, %afterfilter affiche le texte défini par l'utilisateur après le filtre

header_text=⌛ Menu historique [%cursor%/%total%]%prehighlight%%highlight%%afterhighlight%%prelistduration%%listduration%%afterlistduration%%prefilter%%filter%%afterfilter%%presort%%sort%%aftersort%%presearch%%search%%aftersearch%

#--Indique la méthode de tri à masquer dans l'en-tête lors de l'utilisation de la variable %sort%
header_sort_hide_text=added-asc

#--Définit le texte affiché avant ou après le déclenchement d'une variable dans l'en-tête
header_sort_pre_text= \{
header_sort_after_text=}
header_filter_pre_text= [Filtre:
header_filter_after_text=]
header_search_pre_text=\h\N[Recherche=
header_search_after_text=..]
header_highlight_pre_text=✅
header_highlight_after_text=
header_list_duration_pre_text= 🕒 
header_list_duration_after_text=
header_list_length_pre_text= 🕒 
header_list_length_after_text=
header_list_remaining_pre_text= 🕒 
header_list_remaining_after_text=

####-----Paramètres de format de l'heure-----####
##--Dans le premier paramètre, vous pouvez choisir parmi les styles disponibles : default, hms, hms-full, timestamp, timestamp-concise. "default" affiche au format HH:MM:SS.sss. "hms" affiche au format 1h 2m 3.4s. "hms-full" est identique à hms, mais reste constant même quand les heures et les minutes valent 0. "timestamp" affiche le temps total au format horodatage 123456.700. "timestamp-concise" affiche le temps total au format 123456.7 (affiche ou masque les décimales selon leur disponibilité).
##--Dans le deuxième paramètre, vous pouvez définir si les millisecondes sont affichées, arrondies ou tronquées. Options disponibles : 'truncate' supprime les millisecondes et conserve les secondes. 0 supprime les millisecondes et arrondit les secondes. 1 ou plus indique le nombre de décimales de millisecondes à afficher. La valeur par défaut est 3 millisecondes.
##--Dans le troisième paramètre, vous pouvez définir le séparateur entre heure:minute:seconde (hour:minute:second). Le style "default" utilise automatiquement ":", "hms" et "hms-full" utilisent automatiquement " ". Vous pouvez définir le vôtre. Quelques exemples : ["default", 3, "-"], ["hms-full", 5, "."], ["hms", "truncate", ":"], ["timestamp-concise"], ["timestamp", ["timestamp", 0], ["timestamp", "truncate"], ["timestamp", 5]

osd_time_format=["default", "truncate"]
list_time_format=["default", "truncate"]
header_duration_time_format=["hms", "truncate", ":"]
header_length_time_format=["hms", "truncate", ":"]
header_remaining_time_format=["hms", "truncate", ":"]


####------Paramètres des raccourcis clavier de la liste------####
#--Ajoutez ci-dessous (après la virgule) tout autre raccourci clavier à lier. Ou modifiez la lettre entre guillemets pour changer le raccourci
#--Exemples de modification et d'ajout de raccourcis : --de ["b", "B"] à ["b"]. --de [""] à ["alt+b"]. --de [""] à ["a" "ctrl+a", "alt+a"]

#--Raccourci clavier permettant de naviguer vers le haut dans la liste
list_move_up_keybind=["UP", "WHEEL_UP"]

#--Raccourci clavier permettant de naviguer vers le bas dans la liste
list_move_down_keybind=["DOWN", "WHEEL_DOWN"]

#--Raccourci clavier permettant d'aller au premier élément de la page affichée
list_page_up_keybind=["PGUP"]

#--Raccourci clavier permettant d'aller au dernier élément de la page affichée
list_page_down_keybind=["PGDWN"]

#--Raccourci clavier permettant d'aller au premier élément de la liste
list_move_first_keybind=["HOME"]

#--Raccourci clavier permettant d'aller au dernier élément de la liste
list_move_last_keybind=["END"]

#--Raccourci clavier permettant de sélectionner en surbrillance lors de l'utilisation des raccourcis de navigation : maintenez shift, puis appuyez sur n'importe quel raccourci de navigation, par exemple : up, down, home, pgdwn, etc.
list_highlight_move_keybind=["SHIFT"]

#--Raccourci clavier permettant de sélectionner en surbrillance tous les éléments affichés dans la liste
list_highlight_all_keybind=["ctrl+a"]

#--Raccourci clavier permettant de retirer la sélection de tous les éléments actuellement en surbrillance
list_unhighlight_all_keybind=["ctrl+d"]

#--Raccourci clavier permettant de charger l'entrée située à la position du curseur
list_select_keybind=["ENTER", "MBTN_MID"]

#--Raccourci clavier permettant d'ajouter à la liste de lecture l'entrée située à la position du curseur
list_add_playlist_keybind=["CTRL+ENTER"]

#--Raccourci clavier permettant d'ajouter toutes les entrées en surbrillance à la liste de lecture
list_add_playlist_highlighted_keybind=["SHIFT+ENTER"]

#--Raccourci clavier permettant de fermer la liste (si la recherche est ouverte, elle sera fermée en premier)
list_close_keybind=["ESC", "MBTN_RIGHT"]

#--Raccourci clavier permettant de supprimer l'entrée située à la position du curseur
list_delete_keybind=["DEL"]

#--Raccourci clavier permettant de supprimer de la liste toutes les entrées en surbrillance
list_delete_highlighted_keybind=["SHIFT+DEL"]

#--Raccourci clavier permettant de déclencher la recherche
list_search_activate_keybind=["ctrl+f"]

#--Raccourci clavier permettant de quitter le mode de saisie de la recherche tout en la laissant ouverte
list_search_not_typing_mode_keybind=["ALT+ENTER"]

#--Raccourcis clavier ignorés lorsque la liste est ouverte
list_ignored_keybind=[""]
