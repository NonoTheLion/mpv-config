# Style d'affichage de la position actuelle dans la barre de temps. Valeurs : line, bar
timeline_style=bar
# Épaisseur de la ligne (line) de la barre de temps (mode fenêtré/plein écran)
timeline_line_width=2
# Taille de la barre de temps entièrement déployée, en pixels ; 0 pour désactiver
timeline_size=30
# Bordure supérieure de la couleur de fond, utile pour séparer visuellement la barre de temps de la vidéo
timeline_border=1
# Pas de déplacement, en secondes, lors de l'utilisation de la molette sur la barre de temps. Par défaut : 5
# La navigation rapide est utilisée par défaut. Ajouter le suffixe '!' pour une navigation précise. Exemple : '5!'
timeline_step=5
# Afficher ou non l'indicateur de cache de rendu des contenus réseau sur la barre de temps. Par défaut : yes
timeline_cache=yes
# Fournit une carte de chaleur pour les vidéos YouTube. Valeurs : overlay, above, no
timeline_heatmap=overlay
# États dans lesquels la barre de temps doit rester visible en permanence. Séparés par des virgules, valeurs : paused, audio, image, video, idle, windowed, fullscreen
timeline_persistency=
# Quand afficher la barre de progression toujours visible (barre de temps minimisée). Valeurs : windowed (par défaut), fullscreen, always, never
# La commande `toggle-progress` permet aussi de la basculer à la demande
progress=windowed
progress_size=2
progress_line_width=10

# Liste d'éléments séparés par des virgules servant à construire la barre de contrôle au-dessus de la barre de temps. Mettre `never` pour désactiver
# Convention : ce qui est entre `{}` est une valeur, ce qui est entre `[]` est facultatif
# Syntaxe complète d'un élément : `[<[!]{disposition1}[,[!]{dispositionN}]>]{element}[:{paramN}][#{badge}[>{limit}]][?{tooltip}]`
#
# Référence des attributs courants :
# `{icon}` paramètre indiquant le nom d'une icône (par exemple face) ; toutes les valeurs disponibles se trouvent ici https://fonts.google.com/icons?icon.platform=web&icon.set=Material+Icons&icon.style=Rounded
# Paramètres de `{element}` et leur description :
#   `{shorthand}` - les valeurs ci-dessous sont des raccourcis préconfigurés utilisables comme boutons :
#      play-pause (lecture/pause) menu (menu) subtitles (liste des pistes de sous-titres) audio (liste des pistes audio) video (liste des pistes vidéo) playlist (liste de lecture) chapters (liste des chapitres) editions (liste des versions)
#      stream-quality (préférence de qualité de diffusion) open-file (navigateur de fichiers) items (liste de lecture / navigateur de fichiers)
#      next (élément suivant) prev (élément précédent) first (premier) last (dernier) audio-device (liste des périphériques de sortie audio)
#      fullscreen (basculer le plein écran) loop-playlist (basculer la répétition de la liste) loop-file (basculer la répétition du fichier) shuffle (basculer la lecture aléatoire) autoload (chargement automatique des fichiers)
#
#      speed[:{scale}]            (curseur de vitesse, où scale est le coefficient de taille du contrôle, par défaut 1.3)
#      command:{icon}:{command}   (commande exécutée lors de l'appui sur ce bouton)
#      toggle:{icon}:{prop}       (bouton qui bascule une propriété mpv)
#
#      cycle:{default_icon}:{prop}:{value1}[={icon1}][!]/{valueN}[={iconN}][!]
#        Bouton qui parcourt les valeurs d'une propriété mpv ; chaque valeur peut recevoir une {icon} distincte et un marqueur d'activation. Un point d'exclamation facultatif en fin de valeur donne au bouton le style d'un élément activable.
#
#      gap[:{scale}]   (laisse un espace, où scale est le coefficient de taille, par défaut 0.3)
#      space (occupe tout l'espace restant entre deux contrôles, très pratique pour aligner des éléments à droite. Plusieurs space se partagent l'espace, ce qui permet de centrer)
#
# Contrôle de la visibilité des éléments de la barre :
##   `<[!]{disposition1}[+[!]{dispositionN}][,{more_dispositions}]>` - préfixe facultatif servant à contrôler la visibilité de {element}
#   - `+` crée une condition ET, `,` sépare des groupes OU. Exemple : `<foo,bar+baz>` -> `foo OU (bar ET baz)`
#   - Valeurs possibles de `{disposition}` :
##      idle             vrai si mpv est inactif
##      image            vrai si le fichier courant est une image fixe
##      audio            vrai si le fichier courant est purement audio
##      video            vrai si le fichier courant contient une piste vidéo
##      has_many_video   vrai si le fichier courant contient plusieurs pistes vidéo
##      has_image        vrai si le fichier courant possède une pochette ou une autre piste d'image
##      has_audio        vrai si le fichier courant contient une piste audio
##      has_many_audio   vrai si le fichier courant contient plusieurs pistes audio
##      has_sub          vrai si le fichier courant contient une piste de sous-titres
##      has_many_sub     vrai si le fichier courant contient plusieurs pistes de sous-titres
##      has_many_edition vrai si le fichier courant contient plusieurs versions
##      has_chapter      vrai si le fichier courant contient des chapitres
##      stream           vrai si le fichier courant est un flux
##      has_playlist     vrai si la liste de lecture contient plusieurs fichiers
##      {mpv_prop}       n'importe quelle propriété mpv (remarque : un script peut définir `user-data/foo` pour ajouter une propriété personnalisée)
##     Le préfixe facultatif `!` permet d'inverser la condition demandée
## Exemples :
##     - `<stream>stream-quality` - n'affiche le bouton « préférence de qualité de diffusion » que pour les flux
##     - `<has_audio,!audio>audio` - affiche le bouton « liste des pistes audio » pour tous les fichiers possédant une piste audio, mais pas pour les fichiers purement audio
#
# Placer `#{badge}[>{limit}]` après les paramètres de `{element}` lui ajoute un badge. Valeurs possibles de `badge` :
##   `sub`, `audio`, `video` - nombre de pistes
##   `{mpv_prop}` -  si la propriété mpv est un tableau, sa taille est affichée. Propriétés disponibles : https://mpv.io/manual/master/#property-list
##   `>{limit}` le badge n'est affiché que si sa valeur dépasse ce seuil
##   Exemple : `#audio>1`
#
# Placer `?{tooltip}` après la configuration de `{element}` lui ajoute une infobulle
## Exemple : `<stream>stream-quality?Stream quality`
#
# Exemples d'implémentation de quelques raccourcis disponibles :
##   menu = command:menu:script-binding uosc/menu-blurred?Menu
##   subtitles = command:subtitles:script-binding uosc/subtitles#sub>1?Subtitles
##   fullscreen = cycle:crop_free:fullscreen:no/yes=fullscreen_exit!?Fullscreen
##   loop-playlist = cycle:repeat:loop-playlist:no/inf!?Loop playlist
##   toggle:{icon}:{prop} = cycle:{icon}:{prop}:no/yes!
controls=open-file,<idle>command:history:script-binding recentmenu/open?Lecture récente,<idle>command:bookmark_border:script-binding simplebookmark/open-list?Menu des signets,gap,<!idle>command:analytics:script-binding stats/display-stats?Statistiques,<stream>stream-quality,<audio,has_image+!video>command:image:script-binding uosc/video#video?Pochette,<has_many_edition>editions,<video>video,<has_audio+!audio>audio,<video,audio>subtitles,<has_chapter>chapters,space,<has_chapter>command:skip_previous:add chapter -1?Chapitre précédent,<video,audio>speed,<has_chapter>command:skip_next:add chapter 1?Chapitre suivant,space,loop-file,shuffle,loop-playlist,gap,<has_playlist>prev,<has_playlist>playlist,<has_playlist>next,gap,<video,audio>command:picture_in_picture_alt:script-binding pip/toggle-pip?Incrustation d'image (PiP),fullscreen
controls_size=32
controls_margin=8
controls_spacing=2
controls_persistency=idle

# Position d'affichage du contrôle de volume : none, left, right
# Réglage du style de la barre de volume
volume=right
volume_size=40
volume_border=1
volume_step=1
volume_persistency=

# Widget de vitesse de lecture : glisser à la souris ou molette pour modifier, clic pour réinitialiser
speed_step=0.1
speed_step_is_factor=no
speed_persistency=

# Contrôle tous les menus : menu contextuel, chargeur/sélecteur de sous-titres, etc.
menu_item_height=36
menu_min_width=260
menu_padding=1
# Détermine s'il faut `/` ou `ctrl+f` pour activer la recherche, ou si la saisie de n'importe quel texte suffit
# Une fois activé, si le menu contient des caractères unicode, il n'est plus possible de le fermer avec la touche qui l'a ouvert
menu_type_to_search=no


# Logique d'affichage de la barre supérieure (visible uniquement en mode sans bordure et plein écran). Par défaut no-border ; autres valeurs : never, always
top_bar=no-border
top_bar_size=40
# Active les boutons de contrôle à droite de la barre supérieure ; l'exemple correspond à la valeur par défaut
top_bar_controls=yes
# Valeurs : `no` (masqué), `yes` (hérite du titre défini dans mpv.conf), ou une chaîne de modèle personnalisée
top_bar_title=yes
# Utiliser une chaîne de modèle pour activer un titre alternatif dans la barre supérieure. Si le titre alternatif est identique au titre principal, il est masqué
# Astuce : utiliser '${media-title}' pour le titre principal et '${filename}' pour le titre alternatif
top_bar_alt_title=${?media-title:${media-title}}
# Valeurs :
#   `below`  => affiche le titre alternatif sous le titre principal
#   `toggle` => bascule le texte du titre entre principal et alternatif en cliquant sur la barre supérieure, ou via le raccourci `toggle-title`
top_bar_alt_title_place=below
# Fait clignoter la barre supérieure au chargement des contenus suivants. Valeurs : audio,image,video,chapter. Par défaut : video,audio ; la valeur spéciale none désactive le clignotement
top_bar_flash_on=video,audio
top_bar_persistency=

# Bordure intérieure et transparence dessinées en mode avec bordure
window_border_size=1

# En l'absence de liste de lecture, à la fin d'un fichier, charge le fichier suivant du répertoire correspondant aux types indiqués par l'option load_types. Par défaut : no
# Quand cette option est activée, uosc impose les options mpv : `keep-open=yes` et `keep-open-pause=no`
autoload=no
# Active la lecture aléatoire lors de la navigation dans la liste de lecture ou le répertoire. Par défaut : no
# Nécessaire pour obtenir un mélange conforme aux attentes, y compris lors de la navigation dans les répertoires, car l'option « shuffle » intégrée à mpv est pratiquement inutilisable
shuffle=no

# Facteur d'échelle de l'interface ; à adapter au facteur de mise à l'échelle HIDPI de votre écran
scale=1
# Facteur d'échelle de l'interface en plein écran. Par défaut : 1.3
scale_fullscreen=1.3
# Police personnalisée de l'interface ; une police à chasse fixe est recommandée pour un meilleur rendu. Laisser vide pour utiliser 'osd-font'
font=Noto Sans Mono CJK SC
# Ajuste l'échelle du texte pour l'adapter à votre police
font_scale=1
# Épaisseur de la bordure du texte et des icônes lorsqu'ils sont dessinés directement sur la vidéo. Par défaut : 1.2
text_border=1.2
# Rayon des coins des boutons, des menus et de tous les autres rectangles. Par défaut : 4
border_radius=2
# Liste de redéfinitions de couleurs séparées par des virgules, au format hexadécimal RGB : `rrggbb`
# Par défaut : foreground=ffffff,foreground_text=000000,background=000000,background_text=ffffff,curtain=111111,match=69c5ff,heatmap=00adee
color=foreground=FFFBFE,foreground_text=1C1B1F,background=1C1B1F,background_text=FFFBFE
# Liste de redéfinitions d'opacité séparées par des virgules, pour les fonds et les formes des divers éléments de l'interface. Le texte est toujours à 100 %
# Exemple : opacity=timeline=0.5,title=0.5
# Par défaut : timeline=0.9,position=1,chapters=0.8,slider=0.9,slider_gauge=1,controls=0,speed=0.6,menu=1,submenu=0.4,border=1,title=1,
#       tooltip=1,thumbnail=1,curtain=0.8,idle_indicator=0.8,audio_indicator=0.5,buffering_indicator=0.3,playlist_position=0.8,heatmap=0.4
opacity=menu=0.9,submenu=0.7,curtain=0.5
# Liste de fonctionnalités séparées par des virgules, affinées au prix d'un certain impact sur les performances. Par défaut : vide
# text_width - mesure plus précise de la largeur du texte : chaque chaîne est mesurée individuellement, au lieu de mesurer une seule fois la largeur des lettres connues et de les additionner
# sorting    - le tri par nom de fichier gère mieux les langues non anglaises, en particulier les langues asiatiques. Actuellement disponible uniquement sous Windows, sans effet sur les autres plateformes
refine=sorting
# Durée des animations de transition (en millisecondes). Par défaut : 100
animation_duration=100
# Durée du clignotement (en millisecondes) utilisée par les commandes `flash-{element}`
flash_duration=1000
# Distance en pixels en deçà de laquelle les éléments apparaissent/disparaissent complètement en fondu
proximity_in=40
proximity_out=120
# Utiliser uniquement la graisse grasse dans toute l'interface. Par défaut : no
font_bold=no
# Manière d'afficher le temps à droite de la barre de temps : `total`, `playtime-remaining` (mis à l'échelle selon la vitesse actuelle), `time-remaining` (durée restante du fichier)
destination_time=playtime-remaining
# Précision infra-seconde des horodatages affichés, c'est-à-dire le nombre de décimales après la seconde. Par défaut : 0
time_precision=3
# Affiche dans la barre de temps la durée de flux mise en mémoire tampon si elle est inférieure à ce nombre de secondes ; 0 pour désactiver
buffered_time_threshold=60
# Masquer l'interface quand mpv masque automatiquement le curseur. Par défaut : no
autohide=no
# Style de l'indicateur affiché lors du basculement de l'état de pause
# Valeurs : none, flash, static, manual (piloté par les commandes flash-pause-indicator et decide-pause-indicator)
pause_indicator=manual
# Tailles listées dans le menu de qualité de flux
stream_quality_options=4320,2160,1440,1080,720,480,360,240,144
# Types de fichiers recherchés lors de la navigation entre fichiers média
video_types=3g2,3gp,asf,avi,bdmv,f4v,flv,h264,h265,iso,ifo,m2ts,m4v,mkv,mov,mp4,mp4v,mpeg,mpg,ogm,ogv,rm,rmvb,ts,vob,webm,wmv,y4m
audio_types=aac,ac3,aiff,ape,au,dsf,dts,flac,m4a,mid,midi,mka,mp3,mp4a,oga,ogg,opus,spx,tak,tta,wav,weba,wma,wv
image_types=apng,avif,bmp,gif,j2k,jp2,jfif,jpeg,jpg,jxl,mj2,png,svg,tga,tif,tiff,webp
playlist_types=m3u,m3u8,pls,url,cue
# Types de fichiers recherchés lors du chargement de sous-titres externes
subtitle_types=aqt,ass,gsub,idx,jss,lrc,mks,pgs,pjs,psb,rt,slt,smi,sub,sup,sbv,srt,ssa,ssf,ttxt,txt,usf,vt,vtt
# Types acceptés comme élément suivant lors du chargement automatique ou de la demande de lecture du fichier suivant
# Valeurs : video,audio,image,playlist,same. La valeur spéciale same signifie que seuls les fichiers média du même type que le fichier courant sont chargés
load_types=same
# Répertoire par défaut à l'ouverture du menu de fichiers. Par défaut : ~/. La valeur spéciale '{drives}' ouvre le menu des lecteurs sous Windows (par défaut '/' sous unix)
default_directory={drives}
# Lister ou non les fichiers cachés lors de la lecture d'un répertoire. Par défaut : no. En raison de limitations de l'environnement, seuls les fichiers commençant par un point '.' sont masqués
# Les fichiers cachés de Windows ne sont pas masqués (impossible de déterminer qu'ils le sont)
show_hidden_files=no
# Déplacer les fichiers vers la corbeille lors de leur suppression. Par défaut : no
use_trash=yes
# Ajuste les marges de l'OSD en fonction de la visibilité des éléments de l'interface. Par défaut : yes
adjust_osd_margins=no


# Convertit certains types de chapitres courants en indicateurs de plage de chapitres ; la portion de barre de temps concernée est alors colorée
# La syntaxe des indicateurs de plage est une liste « {type}:{color} » séparée par des virgules
# `{type}` - type de plage. Types actuellement pris en charge :
#  - `openings` - génériques et introductions d'animation
#  - `endings` - épilogues et génériques de fin d'animation
#  - `ads` - blocs sponsorisés créés par le script : https://github.com/po5/mpv_sponsorblock
# `{color}` - code couleur au format RRGGBB(AA)
#
# Pour ne convertir aucun type de plage, il suffit de le retirer de la liste ; tout laisser vide désactive cette fonctionnalité
# Exemple : chapter_ranges=openings:38869680,endings:38869680,ads:a5353580
chapter_ranges=openings:30abf964,endings:30abf964,intros:3fb95080,outros:3fb95080,ads:c54e4e80
# Motifs lua supplémentaires pour reconnaître le point de départ d'une plage de chapitres (tous les types sauf `ads`)
# Syntaxe : `{type}:{pattern}[,{patternN}][;{type}:{pattern}[,{patternN}]]`
# Types de plages de chapitres définissables actuellement : openings;endings;intros;outros
chapter_range_patterns=openings:^Intro%s*Start,オープニング$,^片头$,片头开始$;endings:^end$,^End$,エンディング$;intros:preview$,预告$,予告$;outros:credits$

# Priorité des langues de localisation, de la plus élevée à la plus faible
# Les langues intégrées se trouvent dans 'uosc/intl'.
# 'slang' est le mot-clé qui hérite de la valeur de la propriété '--slang'
# Un chemin vers un fichier json personnalisé est accepté : `languages=~~/custom.json,slang,en`
languages=fr,en

# Par défaut, les sous-titres sont téléchargés dans le répertoire du fichier ouvert
# Si le fichier est lu depuis une URL, c'est ce répertoire qui est utilisé (développé en `{mpv_config_dir}/subtitles`)
# Préfixer le chemin par `!` force l'enregistrement de tous les sous-titres à cet endroit, exemple : `!~~/subtitles`
subtitles_directory=~~/subtitles

# Liste d'identifiants d'éléments à désactiver, séparés par des virgules. Vide par défaut. Identifiants disponibles :
#   window_border, top_bar, timeline, controls, volume,
#   idle_indicator, audio_indicator, buffering_indicator, pause_indicator
disable_elements=idle_indicator,audio_indicator

# Chemin de l'exécutable `ziggy`. Par défaut : default, c'est-à-dire `~~/scripts/uosc/bin`
# Laisser vide pour chercher l'exécutable dans le PATH du système ; sous Windows, le répertoire contenant mpv.exe est également examiné
ziggy_path=