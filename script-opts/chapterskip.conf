# Mode de saut appliqué lorsqu'un chapitre ciblé est détecté, valeurs possibles : none|auto|manual (par défaut)
mode=manual
## Langue d'affichage des messages OSD du script, par défaut : eng
language=chs
## Délai d'affichage des messages OSD du script, en secondes. Par défaut : 20
timeout=20
# Noms de chapitres supplémentaires à prendre en compte pour le saut
categories=opening>^OP/ OP$/^[Oo]pening/[Oo]pening$/^Intro%s*Start/オープニング$/^片头$/片头开始$; ending>^ED/ ED$/^[Ee]nding/[Ee]nding$/エンディング$; credits>^[Cc]redits/[Cc]redits$; prologue>^[Pp]rologue/^[Ii]ntro$; preview>[Pp]review$/^[Pp]review/预告$/予告$; PartAB>Part [AB]/Ending 1; PartC>Part C
# Catégories de chapitres à sauter
skip=opening;ending;credits;prologue;preview

# Réglages d'inférence par position (déduction automatique du générique de début/fin d'après la position du chapitre)
# Activer l'inférence de chapitre basée sur la position. Par défaut : yes
enable_position_inference=yes
# Appliquer l'historique d'un fichier à l'autre pour les fichiers sans chapitre. Par défaut : no
# Si activé : les autres fichiers du même dossier héritent de l'historique (ex. l'enregistrement de S01E01 s'applique à S01E02)
# Si désactivé : l'historique ne vaut que pour le fichier enregistré, sans report d'un fichier à l'autre
# Cas d'usage : à activer pour le suivi d'une série, afin de « marquer une fois, valable toute la saison »
enable_history_position_inference=yes
# Le chapitre de générique de début doit se trouver dans les N premières secondes de la vidéo. Par défaut : 200
intro_time_window=200
# Le chapitre de générique de fin doit se trouver dans les N dernières secondes avant la fin. Par défaut : 300
outro_time_window=300

# Réglages de style des boutons
# Taille de police du bouton. Par défaut : 24
button_font_size=24
# Marge intérieure horizontale du bouton. Par défaut : 20
button_padding_x=20
# Marge intérieure verticale du bouton. Par défaut : 15
button_padding_y=15
# Distance entre le bouton et le bord de l'écran. Par défaut : 60
button_margin=60
# Épaisseur de la bordure du bouton. Par défaut : 2
button_border=2
# Rayon des coins arrondis du bouton. Par défaut : 13
button_radius=13

# Réglages de couleur des boutons (format BGR : BBGGRR)
# Couleur de la partie déjà parcourue de la barre de progression (état normal). Par défaut : 2442F4 (rouge)
button_progress_color=2442F4
# Couleur de la partie déjà parcourue de la barre de progression (état survolé). Par défaut : 2442F4 (rouge)
button_progress_hover_color=2442F4
# Couleur de la partie restante de la barre de progression (état normal). Par défaut : FFFFFF (blanc)
button_remaining_color=FFFFFF
# Couleur de la partie restante de la barre de progression (état survolé). Par défaut : 111111 (gris foncé)
button_remaining_hover_color=111111
# Couleur du texte du bouton (état normal). Par défaut : 000000 (noir)
button_text_color=000000
# Couleur du texte du bouton (état survolé). Par défaut : FFFFFF (blanc)
button_text_hover_color=FFFFFF
# Couleur de la bordure du bouton. Par défaut : FFFFFF (blanc)
button_border_color=FFFFFF

# Niveau de bruit maximal, exprimé en dB, déclenchant le saut des silences
# Par défaut : -40. -60 est très sensible
# -10 tolère beaucoup plus de bruit
silence_audio_level=-40
# Durée du silence détecté qui déclenche le saut. Par défaut : 0.7
silence_duration=0.7
# Le premier silence_duration détecté est ignoré pendant le nombre de secondes défini ici, et le saut se poursuit jusqu'au silence_duration suivant
# 0 pour désactiver, sinon indiquer un nombre de secondes. Par défaut : 1
ignore_silence_duration=5
# Durée minimale, en secondes, acceptée pour un saut avant le silence_duration configuré
# 0 pour désactiver, sinon indiquer un nombre de secondes. Par défaut : 0
min_skip_duration=0
# Durée maximale, en secondes, acceptée pour un saut avant le silence_duration configuré
# 0 pour désactiver, sinon indiquer un nombre de secondes. Par défaut : 120
max_skip_duration=120
# Couper le son pendant le saut, car l'audio en avance rapide est désagréable. Par défaut : no
force_mute_on_skip=yes
# Chemin du fichier d'historique des chapitres sautés. Chemins absolus et relatifs pris en charge
history_path=~~/files/chapterskip_history.json
