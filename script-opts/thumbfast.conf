# Chemin du socket (laisser vide pour une configuration automatique)
socket=

# Chemin du cache des vignettes (laisser vide pour une configuration automatique)
thumbnail=

# Taille maximale des vignettes, en pixels (réduites pour tenir dans ces limites)
# Cette valeur est mise à l'échelle automatiquement lorsque le hidpi est activé
max_height=200
max_width=200

# Identifiant de la surimpression
overlay_id=42

# Lancer le générateur de vignettes dès le chargement du fichier, pour obtenir plus vite les premières vignettes. Désactivé par défaut
spawn_first=no

# Arrêter le processus de génération de vignettes après ce délai d'inactivité (en secondes) ; 0 par défaut, soit désactivé
quit_after_inactivity=0

# Activer lors de la lecture en réseau. Désactivé par défaut
network=no

# Activer lors de la lecture de fichiers audio. Désactivé par défaut
audio=no

# Utiliser le décodage matériel pour générer les vignettes. Désactivé par défaut
# Remarque : le décodage matériel accélère la génération sur les cartes graphiques haut de gamme, mais peut poser problème sur les cartes d'entrée de gamme
hwdec=yes

# L'écriture directe dans un tube via l'API Windows n'est pas utilisée sous Linux
direct_io=no

# Chemin personnalisé de l'exécutable mpv. Par défaut : mpv
mpv_path=mpv

# Liste noire des extensions vidéo à ignorer, pour lesquelles la génération de vignettes ne fonctionne pas correctement
blacklist_ext=bdmv,ifo

## Chemins/dossiers des disques partagés (montés) à ignorer (génération de vignettes trop lente)
## Exemple : excluded_dir=["/mnt/nas", "/media/disque-lent"]
#excluded_dir=[]