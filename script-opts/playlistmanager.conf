###Ce fichier de configuration ne prend pas en charge les commentaires après un paramètre actif ; tout commentaire doit être placé sur une nouvelle ligne

#### ------- Configuration de Mpv-Playlistmanager ------- ####

#### ------- FONCTIONNEL ------- ####

#navigation : les raccourcis sont forcés uniquement lorsque la liste de lecture est visible
#Réglé sur "no", la liste de lecture peut être affichée par n'importe quelle touche de navigation
dynamic_binds=yes

#Raccourci du menu principal
key_showplaylist=

#Affiche la liste de lecture tant que la touche est maintenue
key_peek_at_playlist=

## Les raccourcis dynamiques ne doivent pas être définis dans input.conf (afin de ne pas entrer en conflit avec les raccourcis statiques)
## Plusieurs touches peuvent être liées, séparées par des espaces
key_moveup=UP WHEEL_UP
key_movedown=DOWN WHEEL_DOWN
key_movepageup=PGUP MBTN_BACK
key_movepagedown=PGDWN MBTN_FORWARD
key_movebegin=HOME
key_moveend=END
key_selectfile=RIGHT
key_unselectfile=LEFT
key_playfile=ENTER MBTN_LEFT
key_removefile=DEL BS
key_closeplaylist=ESC MBTN_RIGHT

## Raccourcis dynamiques pour des fonctions supplémentaires
## Plusieurs touches peuvent être liées, séparées par des espaces
key_sortplaylist=s
key_shuffleplaylist=r R
key_reverseplaylist=S
key_loadfiles=l L
key_saveplaylist=p P

# Format de remplacement json, consultez le fichier .lua pour les explications
# exemple json=[{"ext":{"all":true},"rules":[{"_":" "}]},{"ext":{"mp4":true,"mkv":true},"rules":[{"^(.+)%..+$":"%1"},{"%s*[%[%(].-[%]%)]%s*":""},{"(%w)%.(%w)":"%1 %2"}]},{"protocol":{"http":true,"https":true},"rules":[{"^%a+://w*%.?":""}]}]
# Valeur vide, aucun remplacement nécessaire
filename_replace=[{"protocol":{"all":true},"rules":[{"%%(%x%x)":"hex_to_char"}]},{"protocol":{"http":true,"https":true},"rules":[{"^%a[%a%d]+://localhost:.*/":""}]}]

## Indique les types de fichiers à rechercher et charger depuis le dossier. Remarque : cette option fait doublon avec la fonctionnalité du script autoload.lua
#loadfiles_filetypes=["3gp","amr","amv","asf","avi","avi","bdmv","f4v","flv","ifo","iso","m2ts","m4v","mkv","mov","mp4","mpeg","mpg","ogv","rm","rmvb","ts","vob","webm","wmv"]
#Charge un ou plusieurs fichiers dans la liste de lecture au démarrage. Remarque : cette option fait doublon avec la fonctionnalité du script autoload.lua
loadfiles_on_start=no

#Charge les fichiers du dossier de travail au démarrage en mode inactif
loadfiles_on_idle_start=no

#Place toujours les fichiers chargés après le fichier en cours de lecture
loadfiles_always_append=no

#Indique si un tri naturel doit être appliqué lors de l'ajout de fichiers à la liste de lecture après le chargement initial
sortplaylist_on_file_add=no

#Indique la méthode de tri à utiliser avec la fonction de tri, doit être l'une des suivantes : "name-asc", "name-desc", "date-asc", "date-desc", "size-asc", "size-desc".
default_sort=name-asc

#linux | windows | auto
system=auto

#Utilisez ~ pour le dossier personnel. Laissez vide pour utiliser mpv/playlists
playlist_savepath=

#Synchronise la position (pos) du fichier en cours de lecture à l'ouverture de la liste de lecture
sync_cursor_on_load=yes

#Affiche le titre du fichier à chaque chargement d'un nouveau fichier
show_title_on_file_load=no
#Affiche la liste de lecture à chaque chargement d'un nouveau fichier
show_playlist_on_file_load=no
#Ferme la liste de lecture après la sélection d'un fichier à lire
close_playlist_on_playfile=no

##Indique si le curseur revient automatiquement au premier élément une fois arrivé à la fin
loop_cursor=yes

#Réinitialise la navigation du curseur lorsque la liste de lecture n'est pas visible
reset_cursor_on_close=yes

#Autorise le gestionnaire de liste de lecture à écrire la configuration "à regarder plus tard" lors de la navigation entre les fichiers
allow_write_watch_later_config=no

#Affiche un retour visuel dans l'OSD lors de l'enregistrement, de la lecture aléatoire ou de l'inversion de la liste de lecture
display_osd_feedback=no

#prefer pour afficher le titre des fichiers suivants : "all", "url", "none". Le tri utilise toujours le nom de fichier
prefer_titles=url

#Indique l'exécutable ytdl à utiliser pour la résolution des titres, peut être un chemin absolu. Par défaut : yt-dlp
youtube_dl_executable=yt-dlp

#Utilise youtube-dl/yt-dlp pour résoudre le titre des URL dans la liste de lecture, par défaut : no
#prefer_titles doit être réglé sur "url" ou "all" pour que cela fonctionne correctement
resolve_url_titles=yes

#Indique le délai d'expiration pour la résolution des titres d'URL dans la liste de lecture, valeur par défaut : 15s
resolve_title_timeout=15

#Indique le nombre de titres de média URL résolus simultanément. Un nombre trop élevé peut provoquer des ralentissements notables
concurrent_title_resolve_limit=10

##Durée d'affichage de la liste de lecture dans l'OSD, valeur par défaut : 5s
playlist_display_timeout=5

##Nombre maximal de lignes affichées par la liste de lecture. La valeur spéciale -1 calcule automatiquement, valeur par défaut : -1
showamount=13

##Style de police de la liste de lecture
#exemple {\fnUbuntu\fs10\b0\bord1} équivaut à : font=Ubuntu, size=10, bold=no, border=1
#consultez http://docs.aegisub.org/3.2/ASS_Tags/ pour la référence des balises
#La valeur no reprend par défaut les réglages OSD de mpv.conf
style_ass_tags={\fnNoto Sans CJK SC\fs26\b1\bord0.5}

##Marge en haut à gauche
text_padding_x=10
text_padding_y=15

#Indique l'opacité de l'écran à l'ouverture du menu, valeur : 0.0 - 1.0 (0 = transparent (par défaut), 1 = opaque)
curtain_opacity=0.0

##Indique si le titre de la fenêtre MPV doit être modifié
set_title_stripped=no
title_prefix=
title_suffix= - mpv

##Indique si les noms de fichiers longs doivent être tronqués, nombre maximal de caractères affichés
slice_longfilenames=yes
slice_longfilenames_amount=100

##Titre de la liste de lecture
#%mediatitle ou %filename = titre ou nom du fichier en lecture
#%pos = position du fichier en lecture
#%cursor = position de navigation
#%plen = longueur de la liste de lecture
#%N = saut de ligne
playlist_header=Liste de lecture [%cursor/%plen]

##Modèle de la liste de lecture
#%pos = position du fichier en lecture
#%name = titre ou nom du fichier
#%N = saut de ligne
#Les balises ASS mentionnées ci-dessus peuvent également être utilisées. Par exemple :
# selected_file={\c&HFF00FF&}➔ %name   | ajoute une couleur au fichier sélectionné
#Si vous utilisez des balises ASS, vous devez les réinitialiser à chaque ligne (voir https://github.com/jonniek/mpv-playlistmanager/issues/20)
normal_file={\c&HFFFFFF&}□ %name
hovered_file={\c&H33FFFF&}■ %name
selected_file={\c&C1C1FF&}☑ %name
playing_file={\c&HAAAAAA&}▷ %name
playing_hovered_file={\c&H00FF00&}▶ %name
playing_selected_file={\c&C1C1FF&}☑ %name

##Affichage lorsque la liste de lecture est tronquée
playlist_sliced_prefix=▲
playlist_sliced_suffix=▼
